<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>市政考试答题 · 随机出题</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#eef2f8; --elev:#ffffff; --elev2:#f7f9fc;
  --ink:#111a27; --ink2:#586a7f; --ink3:#8a97a9;
  --line:#e2e8f1; --line2:#eef2f7;
  --brand:#2f6fed; --brand-d:#1e55c9; --brand-soft:#e9f0ff; --brand-ink:#1f47a8;
  --ok:#0e8557; --ok-soft:#e6f7ef; --ok-line:#a9dfc4;
  --bad:#d13b3b; --bad-soft:#fdecec; --bad-line:#f3bcbc;
  --warn:#a56606; --warn-soft:#fdf4e4; --warn-line:#f0d9a8;
  --shadow:0 1px 2px rgba(15,30,55,.05), 0 12px 30px -16px rgba(15,30,55,.22);
  --shadow-sm:0 1px 2px rgba(15,30,55,.06);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#0d1219; --elev:#161d28; --elev2:#1b2430;
  --ink:#e7eef8; --ink2:#9aa9bd; --ink3:#6d7d92;
  --line:#25313f; --line2:#1e2833;
  --brand:#5f92fc; --brand-d:#7ba5fd; --brand-soft:#182740; --brand-ink:#a9c6ff;
  --ok:#4ad392; --ok-soft:#122a20; --ok-line:#245a41;
  --bad:#f87171; --bad-soft:#2a1719; --bad-line:#5c2b2d;
  --warn:#f3c268; --warn-soft:#2a2314; --warn-line:#5a4820;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.72; min-height:100vh;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
b,strong{font-weight:600}
::selection{background:var(--brand-soft);color:var(--brand-ink)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .topbar{background:var(--bg)}
}
.tb-inner{max-width:900px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.5px;
  box-shadow:0 4px 12px -4px color-mix(in srgb,var(--brand) 60%, transparent);
}
.bt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bt b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.bt small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.nav button{
  padding:7px 12px;border-radius:9px;font-size:13.5px;color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
}
.nav button:hover{background:var(--elev);color:var(--ink)}
.nav button.on{background:var(--elev);color:var(--brand-ink);font-weight:600;box-shadow:var(--shadow-sm)}
.nav .theme{width:34px;height:34px;justify-content:center;padding:0;font-size:15px;border-radius:9px}
.badge{
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:11px;font-weight:600;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;
}
.badge.zero{background:var(--line);color:var(--ink3)}

/* ============ 布局 ============ */
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 120px}
.card{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.sec{margin-top:22px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line2)}
h1,h2,h3{margin:0;line-height:1.4}
h2{font-size:19px;letter-spacing:.2px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ============ 芯片 / 分段 ============ */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--elev);color:var(--ink2);
  font-size:14px;transition:.16s;user-select:none;
}
.chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.chip .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip.on .n{color:var(--brand)}
.chip.on::before{content:"✓";font-size:12px;margin-right:-2px}
.tick{
  width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:11px;color:transparent;flex:none;transition:.16s;
}
.chip.on .tick{background:var(--brand);border-color:var(--brand);color:#fff}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);background:var(--elev);color:var(--ink);
  transition:.16s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{
  background:linear-gradient(160deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand) 70%, transparent);
}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);color:#fff;transform:translateY(-1px)}
.btn.primary:active:not(:disabled){transform:translateY(0)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding:10px 14px}
.btn.ghost:hover:not(:disabled){background:var(--elev2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn .kbd{opacity:.65;font-size:11.5px;font-weight:500}

/* ============ 首页 ============ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:26px;letter-spacing:-.2px;line-height:1.3}
.hero p{margin:7px 0 0;color:var(--ink2);font-size:14px}
.hero .stat{display:flex;gap:22px;text-align:right}
.hero .stat div{display:flex;flex-direction:column}
.hero .stat b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.hero .stat span{font-size:11.5px;color:var(--ink3)}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dash a{
  display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:13px;
  background:var(--elev2);border:1px solid var(--line2);text-decoration:none;color:inherit;transition:.16s;
}
.dash a:hover{border-color:var(--brand);background:var(--elev)}
.dash b{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.dash span{font-size:12px;color:var(--ink3)}
.startbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.startbar .info{font-size:13.5px;color:var(--ink2)}
.startbar .info b{color:var(--ink);font-variant-numeric:tabular-nums}
.startbar .actions{margin-left:auto;display:flex;gap:10px}
.resume{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;
  background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);font-size:13.5px;margin-bottom:16px;
}
.resume b{color:inherit}
.resume .btn{margin-left:auto;background:transparent;border-color:var(--warn-line);color:var(--warn);padding:7px 13px;font-size:13px}

/* ============ 答题 ============ */
.quizhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qh-left{display:flex;align-items:center;gap:9px;min-width:0}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
  font-size:12px;font-weight:600;letter-spacing:.3px;flex:none;
}
.tag.single{background:var(--brand-soft);color:var(--brand-ink)}
.tag.multi{background:#f0e9ff;color:#6b34c9}
.tag.blank{background:var(--ok-soft);color:var(--ok)}
.tag.essay{background:var(--warn-soft);color:var(--warn)}
[data-theme="dark"] .tag.multi{background:#241a3d;color:#b79bfa}
.qh-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand-d));transition:width .3s cubic-bezier(.3,.7,.3,1)}

.qcard{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 24px 22px}
.qstem{font-size:17.5px;line-height:1.85;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word}
.qstem .hint{display:block;margin-top:10px;font-size:12.5px;color:var(--ink3);letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--elev);
  transition:.14s;font-size:15.5px;line-height:1.7;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt:disabled{cursor:default}
.opt .k{
  width:23px;height:23px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:var(--elev2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);
  margin-top:2px;transition:.14s;
}
.opt .v{flex:1;word-break:break-word}
.opt .mark{flex:none;font-size:15px;margin-top:1px}
.opt.picked{border-color:var(--brand);background:var(--brand-soft)}
.opt.picked .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mark{color:var(--bad)}
.opt.picked:disabled{opacity:1}

/* 填空 */
.fill{margin-top:18px;font-size:16.5px;line-height:2.5;white-space:pre-wrap;word-break:break-word}
.bwrap{display:inline-flex;align-items:baseline;gap:6px;margin:0 2px}
.binp{
  border:0;border-bottom:1.8px solid var(--brand);background:var(--brand-soft);
  padding:2px 8px;border-radius:6px 6px 0 0;font-size:15.5px;line-height:1.6;
  text-align:center;min-width:3em;max-width:22em;transition:.14s;outline:none;
}
.binp::placeholder{color:var(--ink3);font-size:13px}
.binp:focus{background:var(--elev);border-bottom-color:var(--brand-d);box-shadow:0 2px 0 0 var(--brand-d)}
.binp.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.binp.mid{border-bottom-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.binp.bad{border-bottom-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.binp:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fix{font-size:13px;color:var(--ok);background:var(--ok-soft);border:1px dashed var(--ok-line);padding:1px 7px;border-radius:6px;white-space:nowrap}
textarea.essaybox{
  width:100%;margin-top:18px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--elev2);resize:vertical;min-height:110px;line-height:1.8;outline:none;transition:.16s;
}
textarea.essaybox:focus{border-color:var(--brand);background:var(--elev);box-shadow:0 0 0 3px var(--brand-soft)}

/* 判定 */
.verdict{display:flex;align-items:center;gap:9px;margin-top:18px;padding:12px 15px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid transparent}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.verdict.mid{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.verdict .ic{font-size:16px}
.verdict small{font-weight:500;opacity:.85;font-size:12.5px}
.ansbox{margin-top:14px;border-radius:12px;border:1px solid var(--line);background:var(--elev2);padding:14px 16px}
.ansbox h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.6px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.ansbox .body{font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.ansbox.mine{border-style:dashed}
.srcline{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink3)}
.srcgo{border:0;background:none;padding:0;font:inherit;color:var(--brand);text-decoration:underline dotted;cursor:pointer}
.srcgo:hover{text-decoration:underline}
.stdtxt{white-space:pre-wrap;line-height:1.85;font-size:14px}
.stdit{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line2)}
.stdit:last-child{border-bottom:0}
.stdit .cn{font-variant-numeric:tabular-nums;color:var(--brand-ink);font-weight:600;font-size:13px;padding-top:1px}
.stdit.hl{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
.stdsec{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--elev);overflow:hidden}
.stdsec[open]{border-color:var(--brand)}
.stdsec>summary{cursor:pointer;padding:12px 15px;font-size:14.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.stdsec>summary::-webkit-details-marker{display:none}
.stdsec>summary .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400}
.misslist{display:flex;flex-direction:column;gap:7px}
.miss{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1.65}
.judge{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cov{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:12.5px;margin-left:6px;color:var(--ink3)}
.cov b{font-weight:600;color:inherit}
.judge .btn{flex:1;min-width:140px}

.foot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.foot .spacer{flex:1}
.foot .note{font-size:12.5px;color:var(--ink3)}

/* ============ 结果 ============ */
.result-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .mid{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15;
}
.ring .mid b{font-size:30px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:11.5px;color:var(--ink3);margin-top:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.kpi{background:var(--elev2);border:1px solid var(--line2);border-radius:12px;padding:13px 15px}
.kpi b{display:block;font-size:22px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink3)}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}
.rows{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--elev)}
.rows .hd,.rows .rw{display:grid;grid-template-columns:64px 1fr 76px 76px;gap:10px;align-items:center;padding:10px 15px;font-size:13.5px}
.rows .hd{background:var(--elev2);color:var(--ink3);font-size:12px;letter-spacing:.4px;border-bottom:1px solid var(--line)}
.rows .rw{border-bottom:1px solid var(--line2)}
.rows .rw:last-child{border-bottom:0}
.rows .rw .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.rows .rw .bar i{display:block;height:100%;background:var(--ok)}
.rows .rw .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ============ 列表（题库 / 错题本） ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{
  flex:1;min-width:200px;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:12px;
  background:var(--elev);border:1.5px solid var(--line);transition:.16s;
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;border:0;background:none;outline:none;font-size:14.5px}
.search .ic{color:var(--ink3);font-size:15px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink2);border:1.5px solid var(--line);background:var(--elev);transition:.14s}
.filters button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.qitem{border:1px solid var(--line);border-radius:12px;background:var(--elev);margin-bottom:9px;overflow:hidden;transition:.16s}
.qitem[open]{border-color:var(--brand);box-shadow:var(--shadow-sm)}
.qitem summary{
  display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;list-style:none;font-size:14.5px;
}
.qitem summary::-webkit-details-marker{display:none}
.qitem summary .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem summary .no{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.qitem summary .st{font-size:12px;font-weight:600;flex:none}
.qitem .bd{padding:2px 15px 15px;border-top:1px solid var(--line2);font-size:14px;line-height:1.8}
.qitem .bd p{margin:10px 0 0}
.qitem .bd .lb{color:var(--ink3);font-size:12px;letter-spacing:.4px;display:block}
.qitem .bd .an{color:var(--ok);font-weight:600}
.qitem .bd .my{color:var(--bad)}
.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.empty p{margin:0;font-size:14px}

/* ============ 模拟考试 ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,18,30,.55);padding:18px;
}
.overlay.on{display:flex}
.sheet{
  background:var(--elev);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;border:1px solid var(--line);
}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet p{margin:0;color:var(--ink2);font-size:14px;line-height:1.8}
.sheetfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.cardsec{margin-top:14px}
.cardsec>b{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.5px;display:block;margin-bottom:8px}
.cardgrid{display:flex;flex-wrap:wrap;gap:8px}
.cardno{
  width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--elev2);
  font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink2);transition:.14s;
}
.cardno:hover{border-color:var(--brand);color:var(--brand-ink)}
.cardno.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.cardno.cur{outline:2px solid var(--brand);outline-offset:1px}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.clock.warn{color:var(--warn)}
.clock.danger{color:var(--bad);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.exinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.exinfo div{background:var(--elev2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.exinfo b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.exinfo span{font-size:12px;color:var(--ink3)}
.exrow{display:grid;grid-template-columns:1fr 76px 76px;gap:10px;padding:9px 15px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.exrow:last-child{border-bottom:0}
.exrow .sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bigscore{display:flex;align-items:baseline;gap:10px}
.bigscore b{font-size:44px;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.bigscore span{font-size:14px;color:var(--ink3)}
.pass{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;font-size:12.5px;font-weight:600}
.pass.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.pass.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}


.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:99;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:86vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:760px){
  .tb-inner{gap:6px}
  .nav button{padding:6px 8px;font-size:12.5px}
  .nav{overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .nav::-webkit-scrollbar{display:none}
}
@media (max-width:720px){
  .wrap{padding:16px 13px 96px}
  .tb-inner{padding:8px 13px;gap:8px}
  .bt small{display:none}
  .nav button{padding:7px 9px;font-size:13px}
  .pad{padding:17px}
  .qcard{padding:18px 16px}
  .qstem{font-size:16.5px}
  .hero h1{font-size:22px}
  .hero .stat{gap:16px}
  .dash{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .rows .hd,.rows .rw{grid-template-columns:52px 1fr 60px;font-size:13px}
  .rows .hd span:nth-child(2),.rows .rw .bar{display:none}
  .opt{font-size:15px;padding:12px 13px}
  .fill{font-size:15.5px;line-height:2.6}
  .foot .btn{flex:1}
  .foot .spacer{display:none}
  .result-top{gap:20px}
  .ring{width:112px;height:112px}
  .ring .mid b{font-size:26px}
}
@media (max-width:420px){
  .bt b{font-size:13.5px}
  .nav button{padding:7px 8px;font-size:12.5px}
  .hero .stat{display:none}
}
</style>

"计量检定"},{"t":"text","v":"、"},{"t":"blank","v":"校准"},{"t":"text","v":"合格，并在"},{"t":"blank","v":"有效期内"},{"t":"text","v":"。监理单位应定期检查设备、仪器的"},{"t":"blank","v":"检定和校准报告"},{"t":"text","v":"。"}],"answers":["计量检定","校准","有效期内","检定和校准报告"],"src":"GB 55032-2022 第3.1.7条"},{"id":"T92","no":92,"segs":[{"t":"text","v":"对涉及结构安全、节能、环境保护和主要使用功能的试块、试件及材料，应按规定进行"},{"t":"blank","v":"见证检验"},{"t":"text","v":"。该检验应在"},{"t":"blank","v":"建设单位或者监理单位"},{"t":"text","v":"的监督下现场取样、送检，检测试样应具有"},{"t":"blank","v":"真实性和代表性"},{"t":"text","v":"。"}],"answers":["见证检验","建设单位或者监理单位","真实性和代表性"],"src":"GB 55032-2022 第3.2.2条"},{"id":"T93","no":93,"segs":[{"t":"text","v":"施工过程质量检测试样，除确定"},{"t":"blank","v":"工艺参数"},{"t":"text","v":"可制作"},{"t":"blank","v":"模拟试样"},{"t":"text","v":"外，均应从"},{"t":"blank","v":"现场相应的施工部位"},{"t":"text","v":"制取。"}],"answers":["工艺参数","模拟试样","现场相应的施工部位"],"src":"GB 55032-2022 第3.4.3条"},{"id":"T94","no":94,"segs":[{"t":"text","v":"塔机首次安装验收合格之日起"},{"t":"blank","v":"30"},{"t":"text","v":"日内，使用单位应向工程所在地"},{"t":"blank","v":"县级及以上"},{"t":"text","v":"地方人民政府建设主管部门办理"},{"t":"blank","v":"使用登记"},{"t":"text","v":"。"}],"answers":["30","县级及以上","使用登记"],"src":"DBJ33/T 1361-2026 第8.1.1条"},{"id":"T95","no":95,"segs":[{"t":"text","v":"不同额定起重力矩的塔机，达到规定出厂年限的应进行安全评估：额定起重力矩 M＜63t·m 的，出厂年限超过"},{"t":"blank","v":"10"},{"t":"text","v":"年；63≤M＜125 的，超过"},{"t":"blank","v":"15"},{"t":"text","v":"年；M≥125 的，超过"},{"t":"blank","v":"20"},{"t":"text","v":"年。安全评估宜委托"},{"t":"blank","v":"检验检测机构"},{"t":"text","v":"进行。"}],"answers":["10","15","20","检验检测机构"],"src":"DBJ33/T 1361-2026 第3.0.5条"},{"id":"T96","no":96,"segs":[{"t":"text","v":"使用单位应对塔机进行月度检查，每月检查不应少于"},{"t":"blank","v":"两次"},{"t":"text","v":"。塔机停用"},{"t":"blank","v":"6"},{"t":"text","v":"个月及以上，在使用前，施工单位应委托相应资质的"},{"t":"blank","v":"检验检测机构"},{"t":"text","v":"对塔机进行检验。"}],"answers":["两次","6","检验检测机构"],"src":"DBJ33/T 1361-2026 第8.2.3、8.2.4条"},{"id":"T97","no":97,"segs":[{"t":"text","v":"塔机的视频存储时间不宜小于"},{"t":"blank","v":"72h"},{"t":"text","v":"，其他运行数据存储时间不宜少于"},{"t":"blank","v":"30 个连续工作日"},{"t":"text","v":"。"}],"answers":["72h","30 个连续工作日"],"src":"DBJ33/T 1361-2026 第10.0.3条"}],"essay":[{"id":"E1","no":1,"q":"什么是刚性管道？什么是柔性管道？","a":"刚性管道，主要依靠管体材料强度支撑外力的管道，在外荷载作用下其变形很小，管道的失效是由于管壁强度的控制。本规范指钢筋混凝土、预（自）应力混凝土管道和预应力钢筒混凝土管道。\n柔性管道，在外荷载作用下变形显著的管道，竖向荷载大部分由管道两侧土体所产生的弹性抗力所平衡，管道的失效通常由变形造成而不是管壁的破坏。本规范主要指钢管、化学建材管和柔性接口的球墨铸铁管管道。"},{"id":"E2","no":2,"q":"重型压实机械或较重车辆在管道上部行驶时，管道顶部的最小填土厚度是多少？","a":"采用重型压实机械压实或较重车辆在回填土上行驶时，管道顶部以上应有一定厚度的压实回填土，其最小厚度应按压实机械的规格和管道的设计承载力，通过计算确定。"},{"id":"E3","no":3,"q":"给排水管道安装完成后应按什么要求进行管道功能性试验？","a":"1、压力管道应按规范规定进行压力管道水压试验，试验分为预试验和主试验阶段；试验合格的判定依据分为允许压力降值和允许渗水量值，按设计要求确定；设计无要求时，应根据工程实际情况，选用其中-项值或同时采用两项值作为试验合格的最终判定依据；\n2、无压管道应按规范规定进行管道的严密性试验，严密性试验分为闭水试验和闭气试验，按设计要求确定；设计无要求时，应根据实际情况选择闭水试验或闭气试验进行管道功能性试验；\n3、压力管道水压试验进行实际渗水量测定时，宜注水法。"},{"id":"E4","no":4,"q":"园林建筑、园林构筑物、园林小品、假山包括哪些内容？","a":"园林建筑是指亭、台、楼、阁、廊、舫、榭、温室等。园林构筑物是指河湖、水池、架、花池花坛、护坡、挡土墙。园林小品是指园凳、牌示、果皮箱、坐椅、栏杆、雕塑、景石、水景(不含土建内容)等。假山是指土、石构筑的仿自然山。"},{"id":"E5","no":5,"q":"桥梁工程竣工验收内容应符合什么规定？","a":"1、桥下净空不得小于设计要求。2、单位工程所含分部工程有关安全和功能的检测资料应完整。3、桥梁实体检测允许偏差符合规范规定。4、桥梁实体外形检查应符合规范要求。"},{"id":"E6","no":6,"q":"后张法预应力筋张拉应符合什么要求？","a":"1)混凝土强度应符合设计要求。2)预应力筋张拉端的设置，应符合设计要求。3)张拉前应根据设计要求对孔道的摩阻损失进行实测，以便确定张拉控制应力，并确定预应力筋的理论伸长值。4)预应力筋的张拉顺序应符合设计要求。5)预应力筋张拉程序应符合规范相关规定。6)张拉过程中预应力筋断丝、滑丝、断筋的数最不得超过规范的规定。"},{"id":"E7","no":7,"q":"缘石坡道的坡度应符合下列规定？","a":"1、全宽式单面坡缘石坡道的坡度不应大于 1: 20；2、三面坡缘石坡道正面及侧面的坡度不应大于1 : 12；3、其他形式的缘石坡道的坡度均不应大于 1: 12。"},{"id":"E8","no":8,"q":"盲道应符合下列规定？","a":"1、盲道按其使用功能可分为行进盲道和提示盲道；2、盲道的纹路应凸出路面 4mm 高；3、盲道铺设应连续，应避开树木(穴)、电线杆、拉线等障碍物，其他设施不得占用盲道；4、盲道的颜色宜与相邻的人行道铺面的颜色形成对比，并与周围景观相协调，宜采用中黄色；5 盲道型材表面应防滑。"},{"id":"E9","no":9,"q":"挖方施工应符合下列规定？","a":"1、挖土时应自上向下分层开挖，严禁掏洞开挖。作业中断或作业后，开挖面应做成稳定边坡。 2、机械开挖作业时，必须避开构筑糟、管线.在距管道边 1m 范围内应采用人工开挖；在距直埋缆线 2m 范围内必须采用人工开挖。3、严禁挖掘机等机械在电力架空线路下作业。需在其一制作业时，垂直及水平安全距离应符合表 6.3.10 的规定。"},{"id":"E10","no":10,"q":"水稳养护应符合下列规定？","a":"1、基层宜采用洒水养护，保持湿润。采用乳化沥青养护，应在其上撤布适量石屑。 2、养护期间应封闭交通。3、常温下成活后应经 7d 养护，方可在其上铺筑而层。"},{"id":"E11","no":11,"q":"级配碎石成活应符合下列规定？","a":"1、碎石压实后及成活中应适量洒水。2、视压实碎石的缝隙情况撒布嵌缝料。3、宜采用 12t 以上的压路机碾压成活，碾压至缝隙嵌挤应密实，稳定坚实、表面平整，轮迹小于 5mm。4、未铺装上层前，对已成活的碎石基层应保持养护，不得开通交通。"},{"id":"E12","no":12,"q":"砌筑雨水口应符合下列规定？","a":"1、雨水管端面应露出内井壁，其露出长度不应大于 2cm。2、雨水口井壁，应表面平整，砌筑砂浆应饱满，勾缝应平顺。3、雨水管穿井墙处，管顶应砌砖券。4、井底应采用水泥砂浆抹出雨水口泛水坡。"},{"id":"E13","no":13,"q":"危大工程专项施工方案的主要内容应当包括哪些？","a":"（一）工程概况：危大工程概况和特点、施工平面布置、施 工要求和技术保证条件； （二）编制依据：相关法律、法规、规范性文件、标准、规 范及施工图设计文件、施工组织设计等； （三）施工计划：包括施工进度计划、材料与设备计划； （四）施工工艺技术：技术参数、工艺流程、施工方法、操 作要求、检查要求等； （五）施工安全保证措施：组织保障措施、技术措施、监测 监控措施等；（六）施工管理及作业人员配备和分工：施工管理人员、专 职安全生产管理人员、特种作业人员、其他作业人员等； （七）验收要求：验收标准、验收程序、验收内容、验收人 员等； （八）应急处置措施； （九）计算书及相关施工图纸。"},{"id":"E14","no":14,"q":"危大工程验收人员应当包括哪些人员？","a":"（一）总承包单位和分包单位技术负责人或授权委派的专业 技术人员、项目负责人、项目技术负责人、专项施工方案编制人员、 项目专职安全生产管理人员及相关人员； （二）监理单位项目总监理工程师及专业监理工程师； （三）有关勘察、设计和监测单位项目技术负责人。"},{"id":"E15","no":15,"q":"《嘉兴市文明行为促进条例》第十二条的内容是什么？","a":"每日二十二时至次日六时，禁止在城市市区噪声敏感建筑物集中区域内进行产生环境噪声污染的建筑施工作业，但抢修、抢险作业和因生产工艺上要求或者特殊需要必须连续作业的除外。因特殊需要必须连续作业的，必须有县级以上人民政府或者其有关主管部门的证明。前款规定的夜间作业，应当提前三日向附近居民公告。中考、高考期间，市、县（市）人民政府应当对产生环境噪声污染的建筑施工作业、装修活动作出时间和区域的限制性规定，并提前七日向社会公告。"},{"id":"E16","no":16,"q":"给排水管道铺设完毕并经检验合格后，应及时回填沟槽。回填前，应符合下列规定：（给水排水管道工程施工及验收规范 GB50268-2008 ）","a":"1 预制钢筋混凝土管道的现浇筑基础的混凝土强度、水泥砂浆接口的水泥砂浆强度不应小于 5MPa； 2 现浇钢筋混凝上管渠的强度应达到设计要求；3 混合结构的矩形或拱形管渠，砌体的水泥砂浆强度应达到设计要求；4 井室、雨水口及其他附属构筑物的现浇混凝土强度或砌体水泥砂浆强度应达到设计要求；5 回填时采取防止管道发生位移或损伤的措施；6 化学建材管道或管径大于 900mm的钢管、球墨铸铁管等柔性管道在沟槽回填前，应采取措施控制管道的竖向变形；7 雨期应采取措施防止管道漂浮。"},{"id":"E17","no":17,"q":"无压管道闭水试验时，试验管段应符合下列规定：给水排水管道工程施工及验收规范 GB50268-2008","a":"1 管道及检查井外观质量已验收合格；2 管道未回填土且沟槽内无积水；3 全部预留孔应封堵，不得渗水；4 管道两端堵板承载力经核算应大于水压力的合力；除预留进出水管外，应封堵坚固，不得渗水；5 顶管施工，其注浆孔封堵且管口按设计要求处理完毕，地下水位于管底以下。"},{"id":"E18","no":18,"q":"模扳、支架和拱架的设计中应设施工预拱度。施工预拱度应考虑下列因素：《城市桥梁工程施工与质量验收规范》CJJ2-2008","a":"1 设计文件规定的结构预拱度；2 支架和拱架承受全部施工荷载引起的弹性变形；3 受载后由于杆件接头处的挤压和卸落设备压缩而产生的非弹性变形；4 支架、拱架基础受载后的沉降。"},{"id":"E19","no":19,"q":"梁(T 构)的合龙、体系转换和支座反力调整应符合下列规定：","a":"1 合龙段的长度宜为 2m。2 合龙前应观测气温变化与梁端高程及悬臂端间距的关系。3 合龙前应按设计规定，将两悬臂端合龙口予以临时连接，并将合龙跨一侧墩的临时锚固放松或改成活动变座。4 合龙前，在两端悬臂预加压重，并于浇筑混凝土过程中逐步撤除，以使悬臂端挠度保持稳定。5 台龙宜在一天中气温最低时进行。6 合龙段的混凝土强度宜提高一级，以尽早施加预应力。7 连续梁的梁跨体系转换，应在合龙段及全部纵向连续预应力筋张拉、压浆完成，并解除各墩临时固结后进行。8 粱跨体系转换时，支座反力的调整应以高程控制为主，反力作为校核。"},{"id":"E20","no":20,"q":"钢桥焊缝连接应符合下列规定？","a":"1 首次焊接之前必须进行焊接工艺评定试验。2 焊工和无损检测员必须经考试合格取得资格证书后，方可从事资格证书中认定范围内的上作，焊工停焊时间超过 6 个月，应重新考核。3 焊接环境温度，低合金钢不得低下 5℃，普通碳素结构钢不得低于 0℃。焊接环境湿度不宜高于 80%。4 焊接前应进行焊缝除锈，并应在除锈后 24h 内进行焊接。5 焊接前，对厚度25mm以上的低合金钢预热温度宜为80～120℃，预热范围宜为焊缝两侧50～80mm。6 多层焊接宜连续施焊，并应控制层间温度。每一层焊缝焊完后应及时清除药皮、熔渣、溢流和其他缺陷后，再焊下一层。7 钢梁杆件现场焊缝连接应按设计要求的顺序进行。设计无要求时，纵向应从跨中向两端进行，横向应从中线向两侧对称进行。8 现场焊接应设防风设施，遮盖全部焊接处。雨天不得焊接，箱形梁内进行 C02 气体保护焊时，必须使用通风防护设施。"},{"id":"E21","no":21,"q":"箱涵顶进应具备以下条件？","a":"1 主体结构混凝土必须达到设计强度，防水层及防护层应符合设计要求。2 顶进后背和顶进设备安装完成，经试运转合格。3 线路加固方案完成，并经主管部门验收确认。4 线路监测、抢修人员及设备等应到位。"},{"id":"E22","no":22,"q":"玻璃幕墙工程的安装，应提供下列资料？","a":"1 玻璃幕墙的设计文件。2 玻璃幕墙的气密性能、水密性能和抗风压性能的检验报告及设计要求的其他性能检验报告。3 幕墙组件出厂质量合格证书。4 施工安装的自查记录。5 淋水试验记录。6 隐蔽工程验收记录。"},{"id":"E23","no":23,"q":"模板、支架和拱架的设计中应设施工预拱度。施工预拱度应考虑下列因素？《城市桥梁工程施工与质量验收规范》CJJ2-2008","a":"1 设计文件规定的结构预拱度；2 支架和拱架承受全部施工荷载引起的弹性变形；3 受载后由于杆件接头处的挤压和卸落设备压缩而产生的非弹性变形；4 支架、拱架基础受载后的沉降。"},{"id":"E24","no":24,"q":"当釆用充气胶囊作空心构件芯模时，模板安装应符合下列规定：","a":"1 胶囊在使用前应经检查确认无漏气。2 从浇筑混凝土到胶囊放气止,应保持气压稳定｡3 使用胶囊内模时,应釆用定位箍筋与模板连接固定,防止上浮和偏移｡4 胶囊放气时间应经试验确定,以混凝土强度达到能保持 构件不变形为宜｡"},{"id":"E25","no":25,"q":"箱式消火栓的安装应符合下列规定：建筑给水排水及采暖工程施工质量验收规范 GB 50242-2002","a":"1 栓口应朝外，并不应安装在门轴侧。2 栓口中心距地面为1.1m，允许偏差±20mm。3 阀门中心距箱侧面为140mm，距箱后内表面为100mm，允许偏差±5mm。4 消火栓箱体安装的垂直度允许偏差为3mm。"},{"id":"E26","no":26,"q":"水泥混凝土路面裂缝处理要求？","a":"（1）对裂缝宽度大于或等于2mm且小于15mm且贯穿板厚的中等裂缝，可来采取扩缝补块的方法处治，扩缝补块的最小宽度不应小于100mm。（2）板角断裂应按破裂面确定切割范围；宜采用早强补偿收缩混凝土，并应按原路面设置纵缝、横向缩缝、胀缝。"},{"id":"E27","no":27,"q":"沟槽开挖与地基处理应符合的要求有哪些？","a":"①原状地基土不得扰动、受水浸泡或受冻。②检查地基承载力试验报告，地基承载力应满足设计要求。③按设计或规定要求进行检查，检查检测记录、试验报告是否满足设计要求。进行地基处理时，压实度、厚度应满足设计要求"},{"id":"E28","no":28,"q":"焊接施工单位应符合哪些要求？","a":"(1）应有负责焊接工艺的焊接技术人员、检查人员和检验人员。(2）应有符合焊接工艺要求的焊接设备且性能稳定可靠。(3）应有保证焊接工程质量达到标准的措施。"},{"id":"E29","no":29,"q":"无压管道闭水试验准备工作有哪些？","a":"（1）管道及检查井外观质量已验收合格。（2）开槽施工管道未回填土且沟槽内无积水。（3）全部预留孔应封堵，不得渗水。（4)管道两端堵板承载力经核算应大于水压力的合力，除预留进出水管外，应封堵坚固、不得渗水。（5）顶管施工，其注浆孔封堵且管口按设计要求处理完毕，地下水位于管底以下。 (6）应做好水源引接、排水疏导等方案。"},{"id":"E30","no":30,"q":"质量验收不合格的处理？","a":"(1）经返工返修或经更换材料、构件、设备等的检验批，应重新进行验收。 (2) 经有相应资质的检测单位检测鉴定能够达到设计要求的检验批，应予以验收。 (3）经有相应资质的检测单位检测鉴定达不到设计要求，但经原设计单位核算认可能够满足结构安全和使用功能要求的检验批，可子以验收。（4）经返修或加固处理的分项工程、分部（子分部）工程，虽然改变外形尺寸但仍能满足结构安全和使用功能要求，可按技术处理方案文件和协商文件进行验收。（5）经过返修或加固处理仍不能满足结构安全或使用功能要求的分部（子分部）工程、单位（子单位）工程，严禁验收。"},{"id":"E31","no":31,"q":"施工质量验收程序","a":"(1）检验批应由专业监理工程师组织施工单位项目专业质量检查员、专业工长等进行验收。 (2）分项工程应由专业监理工程师组织施工单位项目专业技术负责人等进行验收。 (3）分部工程应由总监理工程师组织施工单位项目负责人和项目技术负责人等进行验收。"},{"id":"E32","no":32,"q":"关于有限空间作业的要求？","a":"(1）加强管道通风、有毒有害气体检测和各项安全防护工作。（2）作业人员必须接受安全技术培训。考核合格后方可上岗。 (3）作业人员必要时可穿戴防毒面具，防水衣，防护靴、防护手套、安全帽、系有绳子的防护腰带，配备无线通信工具和安全灯等。(4）作业区和地面设专人值守，确保人身安全。"},{"id":"E33","no":33,"q":"改性沥青摊铺与压实温度有哪些要求？","a":"①摊铺温度不低于160℃； ②初压开始温度不低于150℃； ③碾压终了的表面温度应不低于 90~ 120℃； ④开放交通温度为冷却至50℃以下。"},{"id":"E34","no":34,"q":"沥青面层冬季施工的措施有哪些？","a":"(1）城市快速路、主干路的沥青混合料面层严禁冬期施工。次干路及其以下道路在施工温度低于5℃时，应停止施工。当风力在6级及以上时，沥青混合料面层不应施工。(2）粘层、透层，封层严禁冬期施工。"},{"id":"E35","no":35,"q":"水下灌注混凝土导管的要求有哪些？","a":"(1）导管内壁应光滑圆顺，直径宜为 200~300mm，节长宜为 2m。 (2)导管不得漏水，使用前应试拼、试压，试压的压力宜为孔底静水压力的1.5倍。 (3）导管轴线偏差不宜超过孔深的0.5%，且不宜大于 100mm。(4）导管采用法兰盘接头宜加锥形活套，采用螺旋丝扣型接头时必须有防止松脱装置。"},{"id":"E36","no":36,"q":"工程开工前，监理人员应参加由建设单位主持召开的第一次工地会议。会议纪要由项目监理机构负责整理，与会各方代表会签。第一次工地会议应包括以下主要内容:（监理工作标准）？","a":"1 建设单位介绍工程项目概况、工程建设目标和相关要求;2建设单位、施工单位和工程监理单位分别介绍各自驻现场的组织机构、人员及其分工;3 建设单位根据监理合同宣布对总监理工程师的授权;4 建设单位介绍本工程开工准备情况;5 施工单位介绍施工准备情况;6 建设单位和总监理工程师对施工准备情况提出意见和要求;7 总监理工程师介绍监理规划的主要内容:8研究确定各方在施工过程中参加监理例会的主要人员，召开监理例会的周期、地点及主要议题。"},{"id":"E37","no":37,"q":"根据《城市桥梁工程施工与质量验收规范》(CJJ2-2008)，桥梁工程竣工验收应进行实体检测的项目有那些？","a":"桥梁轴线位移、桥宽（含车行道和人行道） 、长度、引道中线与桥梁中线偏差、桥头高程衔接。"},{"id":"E38","no":38,"q":"基坑监测当出现那些情况时，应提高监测频率？ （DB33-1116-2015）","a":"1监测数据达到报警值:2监测数据变化较大或者速率加快;3 存在勘察未发现的不良地质;4支护结构出现开裂;5 周边地面突发较大沉降或出现严重开裂;6邻近的建(构)筑物突发较大沉降、不均匀沉降或出现严重开裂;7 基坑底部、侧壁出现管涌、渗漏、流沙或异响等迹象;8基坑工程发生事故后重新组织施工;9 出现其他影响基坑及周边环境安全的异常情况。"},{"id":"E39","no":39,"q":"脚手架及其基础应在下列阶段进行检查与验收？ （DB33-1116-2015）","a":"1 基础完工后、脚手架搭设前及悬挑梁安装完成后；2 作业层上施加荷载前；3 每搭设完 6m~8m 高度后；4 达到设计高度后；5 遇有六级及以上强风或大雨后、结冻解冻后；6 停用超过一个月。"},{"id":"E40","no":40,"q":"桥梁基础灌注桩监理要点？","a":"1、桩定位核验。2、冲(钻)机选型及检查。3、检查护筒埋设及泥浆比重。4、垂直度及孔径控制。5、终孔条件检查。6、清孔检查。7、钢筋笼制作与安装检查。8、旁站水下混凝土的浇筑，并见证试块留置。"},{"id":"E41","no":41,"q":"根据《建筑与市政工程施工质量控制通用规范》GB55032-2022，施工过程质量控制，在工程质量策划中应在那些部位和环节设置质量控制点？","a":"1、 影响施工质量的关键部位、关键环节。2、影响结构安全和使用功能的关键部位、关键环节。3、采用新技术、新工艺、新材料、新设备的部位和环节。4、隐蔽工程验收。"},{"id":"E42","no":42,"q":"根据《建筑与市政工程防水通用规范》GB55030-2022，防水材料及配套辅助材料进场时应提供那些资料？","a":"1、产品合格证。2、质量检验报告。3、使用说明书。4、 进场复验报告。防水卷材进场复验报告应包含无处理时卷材接缝剥离强度和搭接缝不透水性检测结果。"},{"id":"E43","no":43,"q":"桥梁工程防水层施工时注意那些要点？【《建筑与市政工程防水通用规范》GB55030-2022 】","a":"1、桥梁工程防水层施工，应在基层混凝土强度达到设计强度的 80%及以上后进行。2、 防水施工前，桥面基层混凝土应进行表面粗糙度处理，基层表面的浮灰应清除干净。3 、桥面防水层应直接铺设在混凝土结构表面，不应在二者间加铺砂浆找平层。"},{"id":"E44","no":44,"q":"在钻孔灌注桩混凝土灌注施工时，旁站监理控制要点包括那些？","a":"1、充盈系数控制。2、浇灌时间控制。3、初灌量控制。4、商品混凝土质量检查。"},{"id":"E45","no":45,"q":"根据《建筑地基基础工程施工质量验收标准》（GB50202-2018），泥浆护壁成孔灌注桩质量检验标准中主控检测项目是什么及对应的检测方法？","a":"1、承载力（ 不小于设计值 静载试验）。2、孔深 （不小于设计值 用测绳或井径仪测量）。3、桩身完整性（钻芯法,低应变法，声波透射法）。4、混凝土强度（不小于设计值 28d试块强度或钻芯法）。5、嵌岩深度（不小于设计值 取岩样或超前钻孔取样）。"},{"id":"E46","no":46,"q":"市政工程功能性检验主要项目应包括下列内容？","a":"1、道路工程的弯沉试验；2、无压力管道(工作压力<0.1MPa) 严密性试验；3、桥梁工程的动、静载试验；4、水池满水试验；5、消化池气密性试验；6、压力管道(工作压力≥0.1MPa) 的强度试验、严密性试验和通球试验等"},{"id":"E47","no":47,"q":"对危险性较大的分部分项工程资料，项目监理机构应纳入档案管理的有哪些？","a":"监理实施细则、专项施工方案审查、专项巡视检查、验收及整改等相关资料纳入档案管理。"},{"id":"E48","no":48,"q":"工程质量评估报告主要内容是什么？","a":"1、工程概况、工程各参建单位;2、工程施工过程介绍;3、工程质量验收情况;4、质量控制资料核查情况;5、工程质量事故及其处理情况;6、工程质量评估结论。"},{"id":"E49","no":49,"q":"监理单位应当将哪些相关资料纳入危大工程档案管理？","a":"监理实施细则、专项施工方案审查、专项巡视检查、验收及整改"},{"id":"E50","no":50,"q":"在主出入口明显处应设哪五牌二图？","a":"工程概况牌、管理人员名单及监督电话牌、消防保卫（防火责任）牌、安全生产牌、文明施工牌和施工现场平面图、消防安全平面布置图。"},{"id":"E51","no":51,"q":"《建设工程监理规范》GB/T 50319-2013规定，项目监理机构应根据建设工程监理合同约定，采用哪些方式对建设工程实施监理？","a":"巡视、平行检验、旁站、见证取样"},{"id":"E52","no":52,"q":"《建设工程监理规范》GB/T 50319-2013规定，工程监理单位用表、施工单位报审、报验用表中除了工程开工令和施工组织设计报审表需要由总监理工程师签字并加盖执业印章外还有哪些？","a":"工程暂停令、工程复工令、工程款支付证书、工程开工报审表、单位工程竣工验收报审表、工程款支付报审表、费用索赔报审表、工程临时或最终延期报审表。"},{"id":"E53","no":53,"q":"超过一定规模的危大工程专项施工方案专家论证会的参会人员应当包括哪些？","a":"1、专家；2、建设单位项目负责人；3、有关勘察、设计单位项目技术负责人及相关人员；4、总承包单位和分包单位技术负责人或授权委派的专业技术人员、项目负责人、项目技术负责人、专项施工方案编制人员、项目专职安全生产管理人员及相关人员；5、监理单位项目总监理工程师及专业监理工程师。"},{"id":"E54","no":54,"q":"安全生产事故根据安全事故造成的人员伤亡或者直接经济损失可分为哪四个等级？","a":"特别重大事故、重大事故、较大事故、一般事故"},{"id":"E55","no":55,"q":"建筑行业有哪些特种作业人员？","a":"建筑电工、架子工、起重信号司索工、起重机械司机、起重机械安装拆卸工、高处作业吊兰安装拆卸工、电焊工"},{"id":"E56","no":56,"q":"《建筑与市政工程施工质量控制通用规范》中规定当检验批施工质量不符合验收标准时，应按下列规定处理：","a":"（一）、经返工或返修的检验批，应重新进行验收。（二）、经有资质的检测机构检测能够达到设计要求的检验批，应予以验收。（三）、经有资质的检测机构检测达不到设计要求，但经原设计单位核算认可能够满足安全和使用功能的检验批，应予以验收。"},{"id":"E57","no":57,"q":"《危险性较大的分部分项工程安全管理规定》第三十六条 监理单位有下列行为之一的，依照《中华人民共和国安全生产法》《建设工程安全生产管理条例》对单位进行处罚；对直接负责的主管人员和其他直接责任人员处1000元以上 5000元以下的罚款：","a":"（一）总监理工程师未按照本规定审查危大工程专项施工方案的；（二）发现施工单位未按照专项施工方案实施，未要求其整改或者停工的；（三）施工单位拒不整改或者不停止施工时，未向建设单位和工程所在地住房城乡建设主管部门报告的。"},{"id":"E58","no":58,"q":"《危险性较大的分部分项工程安全管理规定》第三十七条 监理单位有下列行为之一的，责令限期改正，并处1万元以上 3 万元以下的罚款；对直接负责的主管人员和其他直接责任人员处 1000 元以上 5000 元以下的罚款：","a":"（一）未按照本规定编制监理实施细则的；（二）未对危大工程施工实施专项巡视检查的；（三）未按照本规定参与组织危大工程验收的；（四）未按照本规定建立危大工程安全管理档案的。"},{"id":"E59","no":59,"q":"危险性较大的分部分项工程专项施工方案编制指南中规定基坑工程方案编制需要包含哪些内容？","a":"（一）、工程概况；（二）、编制依据；（三）、施工计划；（四）、施工工艺技术；（五）、施工保证措施；（六）、施工管理及作业人员配备及分工；（七）、验收要求；（八）、应急处置措施；（九）、计算书及相关设计图纸。"},{"id":"E60","no":60,"q":"《给水排水管道工程施工及验收规范》GB 50268规定水压试验中主试验阶段的工作为哪些？","a":"（一）停止注水补压，稳定 15min；（二）当15min后压力下降不超过规范允许压力降数值时，将试验压力降至工作压力并保持恒压30min，进行外观检查若无漏水现象，则水压试验合格。"},{"id":"E61","no":61,"q":"《建设工程监理工作标准》专业监理工程师应对进场的主要施工机械、设备进行检查。检查应包括下列基本内容：","a":"（一）型号、规格符合施工组织设计的要求；（二）计量设备的定期检定证明；（三）定期维修保养记录；（四）整机或关键部件检验检测合格的有效期。"},{"id":"E62","no":62,"q":"《浙江省建筑施工安全管理规范》DB33-1116中 4.6.1 基坑施工需要实行基坑监测的三种情况包含哪些内容？","a":"（一）开挖深度大于或等于 5m 的基坑工程；（二）开挖深度小于 5m，但现场地质情况和周围环境较复杂的基坑工程；（三）其他需要监测的基坑工程。"},{"id":"E63","no":63,"q":"《浙江省建筑施工安全管理规范》DB33-1116中 4.6.3 规定基坑专业监测单位应由建设单位委托具备相应资质的第三方对基坑工程实施现场监测。基坑工程实施前监测单位应编制监测方案。监测方案需经哪些单位认可？","a":"建设单位、监理单位、基坑支护设计单位。"},{"id":"E64","no":64,"q":"《城镇供排水有限空间作业安全规程》DB33/T1149中5.13.14 规定作业期间发生五种下列情况之一时，作业者应停止作业，迅速撤离现场：","a":"（一）发现异常；（二）作业者出现身体不适；（三）安全防护设备或个体防护装备失效；（四）气体检测报警仪报警；（五）监护者或作业负责人下达撤离命令。"},{"id":"E65","no":65,"q":"《建设工程监理工作标准》DBJ33/T1104中6.5.4项目监理机构应安排监理人员对施工过程进行的巡视检查内容有哪些？","a":"（一）按图纸、规范和标准施工情况；（二）施工方案的的实施情况；（三）材料、设备、构配件使用情况；（四）施工现场管理人员到位情况；（五）特种作业人员的操作资格证；（六）施工环境。"},{"id":"E66","no":66,"q":"根据《建筑与市政工程施工质量控制通用规范》GB 55032-2022 第3.3.4条，施工工序间的衔接应符合哪些规定？","a":"1 每道施工工序完成后，施工单位应进行自检，并应保留检查记录；\n2 各专业工种之间的相关工序应进行交接检验，并应保留检查记录；\n3 对监理规划或监理实施细则中提出检查要求的重要工序，应经专业监理工程师检查合格并签字确认后，进行下道工序施工；\n4 隐蔽工程在隐蔽前应由施工单位通知监理单位进行验收，并应留存现场影像资料，形成验收文件，经验收合格后方可继续施工。","src":"GB 55032-2022 第3.3.4条"},{"id":"E67","no":67,"q":"根据 GB 55032-2022 第4.2.5条，分部工程质量验收合格应符合哪些规定？","a":"1 所含分项工程的质量应验收合格；\n2 质量控制资料应完整、真实；\n3 有关安全、节能、环境保护和主要使用功能的抽样检验结果应符合要求；\n4 观感质量应符合要求。","src":"GB 55032-2022 第4.2.5条"},{"id":"E68","no":68,"q":"根据 GB 55032-2022 第3.4.4条、第3.4.5条，检测机构出具检验检测数据和结果时应符合哪些要求？","a":"1 检测机构应独立出具检验检测数据和结果；\n2 检测机构应对检测数据和检测报告的真实性和准确性负责；\n3 对检测结果不合格的报告严禁抽撤、替换或修改；\n4 检测机构严禁出具虚假检测报告。","src":"GB 55032-2022 第3.4.4、3.4.5条"},{"id":"E69","no":69,"q":"根据浙江省标准 DBJ33/T 1361-2026 第3.0.6条，出现哪些情况之一的塔机不得使用？","a":"1 国家明令淘汰或者禁止使用的；\n2 不符合安全技术标准或超过生产厂家规定的使用年限的；\n3 未检验或经检验达不到安全技术标准规定的；\n4 没有齐全有效的安全保护装置的；\n5 安全评估达不到安全技术标准规定的；\n6 没有完整安全技术档案的。","src":"DBJ33/T 1361-2026 第3.0.6条"},{"id":"E70","no":70,"q":"根据 DBJ33/T 1361-2026 第3.0.10条，相关责任主体单位应编制哪些塔机专项施工方案？","a":"1 施工单位应编制《塔式起重机基础专项施工方案》；\n2 安装单位应编制《塔式起重机安装专项施工方案》《塔式起重机拆卸专项施工方案》及相应的生产安全事故应急救援预案；\n3 使用单位应编制《塔式起重机使用生产安全事故应急救援预案》；\n4 施工现场塔机安装数量二台及以上且臂架回转半径重叠时，施工单位应编制《塔式起重机群塔作业专项施工方案》。","src":"DBJ33/T 1361-2026 第3.0.10条"},{"id":"E71","no":71,"q":"根据 DBJ33/T 1361-2026 第8.1.7条，非工作状态下的塔机应符合哪些规定？","a":"1 回转机构应解除制动；\n2 应摘除吊钩上的吊索具，吊钩应升至最高限位处；\n3 小车变幅塔机的小车应收至起重臂根部，动臂变幅塔机的起重臂应停放在使用说明书规定的幅度位置；\n4 行走式塔机的夹轨器应与轨道夹紧，或采用锚定等抗风防滑措施。","src":"DBJ33/T 1361-2026 第8.1.7条"},{"id":"E72","no":72,"q":"根据 DBJ33/T 1361-2026 第9.0.1条，塔机检验包括哪几类？分别由谁委托检验检测机构完成？","a":"塔机检验应包括安装检验、定期检验和专项检验；安装检验和定期检验应由施工单位委托检验检测机构完成，专项检验应由产权单位委托检验检测机构完成。","src":"DBJ33/T 1361-2026 第9.0.1条"}],"papers":[{"id":"p2026h1","name":"2026 年上半年度","shortLabel":"2026上半年原卷","minutes":90,"pass":55,"note":"原卷问答题第 3 题（9 分）原文缺失，本卷按现有题目计分，共 30 题 / 91 分。","sections":[{"kind":"single","label":"一、选择题","weights":[2,2,2,2,2,2,2,2,2,2],"items":[{"id":"p2026h1-1","no":1,"kind":"single","stem":"水泥土搅拌法地基加固适用于（　　）。","options":[{"k":"A","v":"障碍物较多的杂填土"},{"k":"B","v":"欠固结的淤泥质土"},{"k":"C","v":"可塑的黏性土"},{"k":"D","v":"密实的砂类土"}],"answer":"C","score":2,"src":"2026 年上半年度选择题第1题"},{"id":"p2026h1-2","no":2,"kind":"single","stem":"混凝土结构蓄水类工程完工后，应进行水池满池蓄水试验，蓄水时间不应少于（　　）。","options":[{"k":"A","v":"12h"},{"k":"B","v":"24h"},{"k":"C","v":"36h"},{"k":"D","v":"48h"}],"answer":"B","score":2,"src":"2026 年上半年度选择题第2题"},{"id":"p2026h1-3","no":3,"kind":"single","stem":"下列供热管道的补偿器中，属于自然补偿方式的是（　　）。","options":[{"k":"A","v":"波形补偿器"},{"k":"B","v":"Z形补偿器"},{"k":"C","v":"方形补偿器"},{"k":"D","v":"填充式补偿器"}],"answer":"B","score":2,"src":"2026 年上半年度选择题第3题"},{"id":"p2026h1-4","no":4,"kind":"single","stem":"钢材的主要性能包括力学性能和工艺性能，以下属于工艺性能的是（　　）。","options":[{"k":"A","v":"抗拉性能"},{"k":"B","v":"硬度"},{"k":"C","v":"耐疲劳性能"},{"k":"D","v":"弯曲性能"}],"answer":"D","score":2,"src":"2026 年上半年度选择题第4题"},{"id":"p2026h1-5","no":5,"kind":"single","stem":"桥梁构造中起桥跨结构支撑作用的是（　　）。","options":[{"k":"A","v":"桥墩"},{"k":"B","v":"桥面铺装"},{"k":"C","v":"锥坡"},{"k":"D","v":"伸缩缝"}],"answer":"A","score":2,"src":"2026 年上半年度选择题第5题"},{"id":"p2026h1-6","no":6,"kind":"single","stem":"浙江省标准《浙江省园林绿化工程施工质量验收规范》DB33/1068-2010 中，土壤检测取样频率：客土按每（　　）m³ 抽样检测 1 次，不足 500m³ 的按 500m³ 计；原土按每 5000m² 取样抽测一次，面积≤5000m² 按 5000m² 计。","options":[{"k":"A","v":"500"},{"k":"B","v":"1000"},{"k":"C","v":"2000"},{"k":"D","v":"5000"}],"answer":"A","score":2,"src":"2026 年上半年度选择题第6题"},{"id":"p2026h1-7","no":7,"kind":"single","stem":"开关箱中漏电保护器的额定漏电动作电流和额定漏电动作时间分别不应大于（　　）。","options":[{"k":"A","v":"30mA，0.1s"},{"k":"B","v":"50mA，0.2s"},{"k":"C","v":"75mA，0.1s"},{"k":"D","v":"100mA，0.2s"}],"answer":"A","score":2,"src":"2026 年上半年度选择题第7题"},{"id":"p2026h1-8","no":8,"kind":"single","stem":"关于电缆线路敷设，以下做法错误的是（　　）。","options":[{"k":"A","v":"直接埋地敷设，深度不小于 0.7m"},{"k":"B","v":"架空敷设在专用电杆上"},{"k":"C","v":"沿脚手架绝缘捆绑敷设"},{"k":"D","v":"穿越道路时加设防护套管"}

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>市政考试答题 · 随机出题</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#eef2f8; --elev:#ffffff; --elev2:#f7f9fc;
  --ink:#111a27; --ink2:#586a7f; --ink3:#8a97a9;
  --line:#e2e8f1; --line2:#eef2f7;
  --brand:#2f6fed; --brand-d:#1e55c9; --brand-soft:#e9f0ff; --brand-ink:#1f47a8;
  --ok:#0e8557; --ok-soft:#e6f7ef; --ok-line:#a9dfc4;
  --bad:#d13b3b; --bad-soft:#fdecec; --bad-line:#f3bcbc;
  --warn:#a56606; --warn-soft:#fdf4e4; --warn-line:#f0d9a8;
  --shadow:0 1px 2px rgba(15,30,55,.05), 0 12px 30px -16px rgba(15,30,55,.22);
  --shadow-sm:0 1px 2px rgba(15,30,55,.06);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#0d1219; --elev:#161d28; --elev2:#1b2430;
  --ink:#e7eef8; --ink2:#9aa9bd; --ink3:#6d7d92;
  --line:#25313f; --line2:#1e2833;
  --brand:#5f92fc; --brand-d:#7ba5fd; --brand-soft:#182740; --brand-ink:#a9c6ff;
  --ok:#4ad392; --ok-soft:#122a20; --ok-line:#245a41;
  --bad:#f87171; --bad-soft:#2a1719; --bad-line:#5c2b2d;
  --warn:#f3c268; --warn-soft:#2a2314; --warn-line:#5a4820;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.72; min-height:100vh;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
b,strong{font-weight:600}
::selection{background:var(--brand-soft);color:var(--brand-ink)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .topbar{background:var(--bg)}
}
.tb-inner{max-width:900px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.5px;
  box-shadow:0 4px 12px -4px color-mix(in srgb,var(--brand) 60%, transparent);
}
.bt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bt b{font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.bt small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.nav button{
  padding:7px 12px;border-radius:9px;font-size:13.5px;color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
}
.nav button:hover{background:var(--elev);color:var(--ink)}
.nav button.on{background:var(--elev);color:var(--brand-ink);font-weight:600;box-shadow:var(--shadow-sm)}
.nav .theme{width:34px;height:34px;justify-content:center;padding:0;font-size:15px;border-radius:9px}
.badge{
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:11px;font-weight:600;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;
}
.badge.zero{background:var(--line);color:var(--ink3)}

/* ============ 布局 ============ */
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 120px}
.card{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.sec{margin-top:22px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line2)}
h1,h2,h3{margin:0;line-height:1.4}
h2{font-size:19px;letter-spacing:.2px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* ============ 芯片 / 分段 ============ */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--elev);color:var(--ink2);
  font-size:14px;transition:.16s;user-select:none;
}
.chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.chip .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip.on .n{color:var(--brand)}
.chip.on::before{content:"✓";font-size:12px;margin-right:-2px}
.tick{
  width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:11px;color:transparent;flex:none;transition:.16s;
}
.chip.on .tick{background:var(--brand);border-color:var(--brand);color:#fff}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);background:var(--elev);color:var(--ink);
  transition:.16s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{
  background:linear-gradient(160deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand) 70%, transparent);
}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);color:#fff;transform:translateY(-1px)}
.btn.primary:active:not(:disabled){transform:translateY(0)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding:10px 14px}
.btn.ghost:hover:not(:disabled){background:var(--elev2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn .kbd{opacity:.65;font-size:11.5px;font-weight:500}

/* ============ 首页 ============ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:26px;letter-spacing:-.2px;line-height:1.3}
.hero p{margin:7px 0 0;color:var(--ink2);font-size:14px}
.hero .stat{display:flex;gap:22px;text-align:right}
.hero .stat div{display:flex;flex-direction:column}
.hero .stat b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.hero .stat span{font-size:11.5px;color:var(--ink3)}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dash a{
  display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:13px;
  background:var(--elev2);border:1px solid var(--line2);text-decoration:none;color:inherit;transition:.16s;
}
.dash a:hover{border-color:var(--brand);background:var(--elev)}
.dash b{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.dash span{font-size:12px;color:var(--ink3)}
.startbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px dashed var(--line)}
.startbar .info{font-size:13.5px;color:var(--ink2)}
.startbar .info b{color:var(--ink);font-variant-numeric:tabular-nums}
.startbar .actions{margin-left:auto;display:flex;gap:10px}
.resume{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;
  background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);font-size:13.5px;margin-bottom:16px;
}
.resume b{color:inherit}
.resume .btn{margin-left:auto;background:transparent;border-color:var(--warn-line);color:var(--warn);padding:7px 13px;font-size:13px}

/* ============ 答题 ============ */
.quizhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qh-left{display:flex;align-items:center;gap:9px;min-width:0}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
  font-size:12px;font-weight:600;letter-spacing:.3px;flex:none;
}
.tag.single{background:var(--brand-soft);color:var(--brand-ink)}
.tag.multi{background:#f0e9ff;color:#6b34c9}
.tag.blank{background:var(--ok-soft);color:var(--ok)}
.tag.essay{background:var(--warn-soft);color:var(--warn)}
[data-theme="dark"] .tag.multi{background:#241a3d;color:#b79bfa}
.qh-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand-d));transition:width .3s cubic-bezier(.3,.7,.3,1)}

.qcard{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 24px 22px}
.qstem{font-size:17.5px;line-height:1.85;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word}
.qstem .hint{display:block;margin-top:10px;font-size:12.5px;color:var(--ink3);letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--elev);
  transition:.14s;font-size:15.5px;line-height:1.7;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt:disabled{cursor:default}
.opt .k{
  width:23px;height:23px;flex:none;border-radius:7px;display:grid;place-items:center;
  background:var(--elev2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);
  margin-top:2px;transition:.14s;
}
.opt .v{flex:1;word-break:break-word}
.opt .mark{flex:none;font-size:15px;margin-top:1px}
.opt.picked{border-color:var(--brand);background:var(--brand-soft)}
.opt.picked .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mark{color:var(--bad)}
.opt.picked:disabled{opacity:1}

/* 填空 */
.fill{margin-top:18px;font-size:16.5px;line-height:2.5;white-space:pre-wrap;word-break:break-word}
.bwrap{display:inline-flex;align-items:baseline;gap:6px;margin:0 2px}
.binp{
  border:0;border-bottom:1.8px solid var(--brand);background:var(--brand-soft);
  padding:2px 8px;border-radius:6px 6px 0 0;font-size:15.5px;line-height:1.6;
  text-align:center;min-width:3em;max-width:22em;transition:.14s;outline:none;
}
.binp::placeholder{color:var(--ink3);font-size:13px}
.binp:focus{background:var(--elev);border-bottom-color:var(--brand-d);box-shadow:0 2px 0 0 var(--brand-d)}
.binp.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.binp.mid{border-bottom-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.binp.bad{border-bottom-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.binp:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fix{font-size:13px;color:var(--ok);background:var(--ok-soft);border:1px dashed var(--ok-line);padding:1px 7px;border-radius:6px;white-space:nowrap}
textarea.essaybox{
  width:100%;margin-top:18px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--elev2);resize:vertical;min-height:110px;line-height:1.8;outline:none;transition:.16s;
}
textarea.essaybox:focus{border-color:var(--brand);background:var(--elev);box-shadow:0 0 0 3px var(--brand-soft)}

/* 判定 */
.verdict{display:flex;align-items:center;gap:9px;margin-top:18px;padding:12px 15px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid transparent}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.verdict.mid{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.verdict .ic{font-size:16px}
.verdict small{font-weight:500;opacity:.85;font-size:12.5px}
.ansbox{margin-top:14px;border-radius:12px;border:1px solid var(--line);background:var(--elev2);padding:14px 16px}
.ansbox h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.6px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.ansbox .body{font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.ansbox.mine{border-style:dashed}
.misslist{display:flex;flex-direction:column;gap:7px}
.miss{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1.65}
.judge{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cov{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:12.5px;margin-left:6px;color:var(--ink3)}
.cov b{font-weight:600;color:inherit}
.judge .btn{flex:1;min-width:140px}

.foot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.foot .spacer{flex:1}
.foot .note{font-size:12.5px;color:var(--ink3)}

/* ============ 结果 ============ */
.result-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .mid{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15;
}
.ring .mid b{font-size:30px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring .mid small{font-size:11.5px;color:var(--ink3);margin-top:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.kpi{background:var(--elev2);border:1px solid var(--line2);border-radius:12px;padding:13px 15px}
.kpi b{display:block;font-size:22px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink3)}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}
.rows{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--elev)}
.rows .hd,.rows .rw{display:grid;grid-template-columns:64px 1fr 76px 76px;gap:10px;align-items:center;padding:10px 15px;font-size:13.5px}
.rows .hd{background:var(--elev2);color:var(--ink3);font-size:12px;letter-spacing:.4px;border-bottom:1px solid var(--line)}
.rows .rw{border-bottom:1px solid var(--line2)}
.rows .rw:last-child{border-bottom:0}
.rows .rw .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.rows .rw .bar i{display:block;height:100%;background:var(--ok)}
.rows .rw .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ============ 列表（题库 / 错题本） ============ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{
  flex:1;min-width:200px;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:12px;
  background:var(--elev);border:1.5px solid var(--line);transition:.16s;
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;border:0;background:none;outline:none;font-size:14.5px}
.search .ic{color:var(--ink3);font-size:15px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink2);border:1.5px solid var(--line);background:var(--elev);transition:.14s}
.filters button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.qitem{border:1px solid var(--line);border-radius:12px;background:var(--elev);margin-bottom:9px;overflow:hidden;transition:.16s}
.qitem[open]{border-color:var(--brand);box-shadow:var(--shadow-sm)}
.qitem summary{
  display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;list-style:none;font-size:14.5px;
}
.qitem summary::-webkit-details-marker{display:none}
.qitem summary .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem summary .no{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.qitem summary .st{font-size:12px;font-weight:600;flex:none}
.qitem .bd{padding:2px 15px 15px;border-top:1px solid var(--line2);font-size:14px;line-height:1.8}
.qitem .bd p{margin:10px 0 0}
.qitem .bd .lb{color:var(--ink3);font-size:12px;letter-spacing:.4px;display:block}
.qitem .bd .an{color:var(--ok);font-weight:600}
.qitem .bd .my{color:var(--bad)}
.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.empty p{margin:0;font-size:14px}

/* ============ 模拟考试 ============ */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,18,30,.55);padding:18px;
}
.overlay.on{display:flex}
.sheet{
  background:var(--elev);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);
  width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;border:1px solid var(--line);
}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet p{margin:0;color:var(--ink2);font-size:14px;line-height:1.8}
.sheetfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.cardsec{margin-top:14px}
.cardsec>b{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.5px;display:block;margin-bottom:8px}
.cardgrid{display:flex;flex-wrap:wrap;gap:8px}
.cardno{
  width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--elev2);
  font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink2);transition:.14s;
}
.cardno:hover{border-color:var(--brand);color:var(--brand-ink)}
.cardno.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.cardno.cur{outline:2px solid var(--brand);outline-offset:1px}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.clock.warn{color:var(--warn)}
.clock.danger{color:var(--bad);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.exinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.exinfo div{background:var(--elev2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.exinfo b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.exinfo span{font-size:12px;color:var(--ink3)}
.exrow{display:grid;grid-template-columns:1fr 76px 76px;gap:10px;padding:9px 15px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.exrow:last-child{border-bottom:0}
.exrow .sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bigscore{display:flex;align-items:baseline;gap:10px}
.bigscore b{font-size:44px;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.bigscore span{font-size:14px;color:var(--ink3)}
.pass{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;font-size:12.5px;font-weight:600}
.pass.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.pass.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}


.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:99;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:86vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:720px){
  .wrap{padding:16px 13px 96px}
  .tb-inner{padding:8px 13px;gap:8px}
  .bt small{display:none}
  .nav button{padding:7px 9px;font-size:13px}
  .pad{padding:17px}
  .qcard{padding:18px 16px}
  .qstem{font-size:16.5px}
  .hero h1{font-size:22px}
  .hero .stat{gap:16px}
  .dash{grid-template-columns:repeat(2,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .rows .hd,.rows .rw{grid-template-columns:52px 1fr 60px;font-size:13px}
  .rows .hd span:nth-child(2),.rows .rw .bar{display:none}
  .opt{font-size:15px;padding:12px 13px}
  .fill{font-size:15.5px;line-height:2.6}
  .foot .btn{flex:1}
  .foot .spacer{display:none}
  .result-top{gap:20px}
  .ring{width:112px;height:112px}
  .ring .mid b{font-size:26px}
}
@media (max-width:420px){
  .bt b{font-size:13.5px}
  .nav button{padding:7px 8px;font-size:12.5px}
  .hero .stat{display:none}
}
</style>

.2试验管段的后背应符合下列规定：1、后背应设在"},{"t":"blank","v":"原状土"},{"t":"text","v":"或人工后背上，土质松软时应采取"},{"t":"blank","v":"加固措施"},{"t":"text","v":"；2、后背墙面应平整并与管道轴线"},{"t":"blank","v":"垂直"},{"t":"text","v":"。"}],"answers":["原状土","加固措施","垂直"]},{"id":"T84","no":84,"segs":[{"t":"text","v":"《给水排水管道工程施工及验收规范》GB 50268表9.2.10-1压力管道水压试验的试验压力 (MPa)中规定当工作压力为P时，钢管试验压力应为"},{"t":"blank","v":"P+0.5并不小于0.9"},{"t":"text","v":"；当工作压力分别为≤0.5和＞0.5时，球墨铸铁管试验压力应分别为"},{"t":"blank","v":"2P"},{"t":"text","v":"和"},{"t":"blank","v":"P+0.5"}],"answers":["P+0.5并不小于0.9","2P","P+0.5"]},{"id":"T85","no":85,"segs":[{"t":"text","v":"《建设工程监理工作标准》隐蔽工程、检验批、分部分项工程经施工单位自检合格并具备验收条件的，施工单位应提前"},{"t":"blank","v":"48"},{"t":"text","v":"h 通知工程监理单位进行验收。"}],"answers":["48"]},{"id":"T86","no":86,"segs":[{"t":"text","v":"《建筑施工高处作业安全技术规范》JGJ80中3.0.3 规定高处作业施工前，应对作业人员进行"},{"t":"blank","v":"安全技术教育及交底"},{"t":"text","v":"，并应配备相应"},{"t":"blank","v":"防护用品"},{"t":"text","v":"。"}],"answers":["安全技术教育及交底","防护用品"]},{"id":"T87","no":87,"segs":[{"t":"text","v":"《建筑与市政工程施工质量控制通用规范》GB55032中3.4.1"},{"t":"blank","v":"建设单位"},{"t":"text","v":"应委托具备相应资质的第三方检测机构进行工程质量检测，检测项目和数量应符合抽样检验要求。非"},{"t":"blank","v":"建设单位"},{"t":"text","v":"委托的检测机构出具的检测报告不得作为工程质量验收依据。"}],"answers":["建设单位","建设单位"]},{"id":"T88","no":88,"segs":[{"t":"text","v":"《浙江省建筑施工安全管理规范》DB33-1116中4.6.3 规定基坑专业监测单位应由"},{"t":"blank","v":"建设单位"},{"t":"text","v":"委托具备相应资质的第三方对基坑工程实施现场监测。基坑工程实施前监测单位应编制"},{"t":"blank","v":"监测方案"},{"t":"text","v":"。"}],"answers":["建设单位","监测方案"]},{"id":"T89","no":89,"segs":[{"t":"text","v":"《浙江省建筑施工安全管理规范》DB33-1116中 4.6.2 基坑工程监测应包括"},{"t":"blank","v":"专业单位"},{"t":"text","v":"监测和"},{"t":"blank","v":"施工企业现场"},{"t":"text","v":"监测。"}],"answers":["专业单位","施工企业现场"]},{"id":"T90","no":90,"segs":[{"t":"text","v":"《建筑与市政工程施工质量控制通用规范》GB55032中3.2.3进口产品应符合合同规定的质量要求，并附有"},{"t":"blank","v":"中文说明书"},{"t":"text","v":"和"},{"t":"blank","v":"商检证明"},{"t":"text","v":"，经进场验收合格后方可使用。"}],"answers":["中文说明书","商检证明"]}],"essay":[{"id":"E1","no":1,"q":"什么是刚性管道？什么是柔性管道？","a":"刚性管道，主要依靠管体材料强度支撑外力的管道，在外荷载作用下其变形很小，管道的失效是由于管壁强度的控制。本规范指钢筋混凝土、预（自）应力混凝土管道和预应力钢筒混凝土管道。\n柔性管道，在外荷载作用下变形显著的管道，竖向荷载大部分由管道两侧土体所产生的弹性抗力所平衡，管道的失效通常由变形造成而不是管壁的破坏。本规范主要指钢管、化学建材管和柔性接口的球墨铸铁管管道。"},{"id":"E2","no":2,"q":"重型压实机械或较重车辆在管道上部行驶时，管道顶部的最小填土厚度是多少？","a":"采用重型压实机械压实或较重车辆在回填土上行驶时，管道顶部以上应有一定厚度的压实回填土，其最小厚度应按压实机械的规格和管道的设计承载力，通过计算确定。"},{"id":"E3","no":3,"q":"给排水管道安装完成后应按什么要求进行管道功能性试验？","a":"1、压力管道应按规范规定进行压力管道水压试验，试验分为预试验和主试验阶段；试验合格的判定依据分为允许压力降值和允许渗水量值，按设计要求确定；设计无要求时，应根据工程实际情况，选用其中-项值或同时采用两项值作为试验合格的最终判定依据；\n2、无压管道应按规范规定进行管道的严密性试验，严密性试验分为闭水试验和闭气试验，按设计要求确定；设计无要求时，应根据实际情况选择闭水试验或闭气试验进行管道功能性试验；\n3、压力管道水压试验进行实际渗水量测定时，宜注水法。"},{"id":"E4","no":4,"q":"园林建筑、园林构筑物、园林小品、假山包括哪些内容？","a":"园林建筑是指亭、台、楼、阁、廊、舫、榭、温室等。园林构筑物是指河湖、水池、架、花池花坛、护坡、挡土墙。园林小品是指园凳、牌示、果皮箱、坐椅、栏杆、雕塑、景石、水景(不含土建内容)等。假山是指土、石构筑的仿自然山。"},{"id":"E5","no":5,"q":"桥梁工程竣工验收内容应符合什么规定？","a":"1、桥下净空不得小于设计要求。2、单位工程所含分部工程有关安全和功能的检测资料应完整。3、桥梁实体检测允许偏差符合规范规定。4、桥梁实体外形检查应符合规范要求。"},{"id":"E6","no":6,"q":"后张法预应力筋张拉应符合什么要求？","a":"1)混凝土强度应符合设计要求。2)预应力筋张拉端的设置，应符合设计要求。3)张拉前应根据设计要求对孔道的摩阻损失进行实测，以便确定张拉控制应力，并确定预应力筋的理论伸长值。4)预应力筋的张拉顺序应符合设计要求。5)预应力筋张拉程序应符合规范相关规定。6)张拉过程中预应力筋断丝、滑丝、断筋的数最不得超过规范的规定。"},{"id":"E7","no":7,"q":"缘石坡道的坡度应符合下列规定？","a":"1、全宽式单面坡缘石坡道的坡度不应大于 1: 20；2、三面坡缘石坡道正面及侧面的坡度不应大于1 : 12；3、其他形式的缘石坡道的坡度均不应大于 1: 12。"},{"id":"E8","no":8,"q":"盲道应符合下列规定？","a":"1、盲道按其使用功能可分为行进盲道和提示盲道；2、盲道的纹路应凸出路面 4mm 高；3、盲道铺设应连续，应避开树木(穴)、电线杆、拉线等障碍物，其他设施不得占用盲道；4、盲道的颜色宜与相邻的人行道铺面的颜色形成对比，并与周围景观相协调，宜采用中黄色；5 盲道型材表面应防滑。"},{"id":"E9","no":9,"q":"挖方施工应符合下列规定？","a":"1、挖土时应自上向下分层开挖，严禁掏洞开挖。作业中断或作业后，开挖面应做成稳定边坡。 2、机械开挖作业时，必须避开构筑糟、管线.在距管道边 1m 范围内应采用人工开挖；在距直埋缆线 2m 范围内必须采用人工开挖。3、严禁挖掘机等机械在电力架空线路下作业。需在其一制作业时，垂直及水平安全距离应符合表 6.3.10 的规定。"},{"id":"E10","no":10,"q":"水稳养护应符合下列规定？","a":"1、基层宜采用洒水养护，保持湿润。采用乳化沥青养护，应在其上撤布适量石屑。 2、养护期间应封闭交通。3、常温下成活后应经 7d 养护，方可在其上铺筑而层。"},{"id":"E11","no":11,"q":"级配碎石成活应符合下列规定？","a":"1、碎石压实后及成活中应适量洒水。2、视压实碎石的缝隙情况撒布嵌缝料。3、宜采用 12t 以上的压路机碾压成活，碾压至缝隙嵌挤应密实，稳定坚实、表面平整，轮迹小于 5mm。4、未铺装上层前，对已成活的碎石基层应保持养护，不得开通交通。"},{"id":"E12","no":12,"q":"砌筑雨水口应符合下列规定？","a":"1、雨水管端面应露出内井壁，其露出长度不应大于 2cm。2、雨水口井壁，应表面平整，砌筑砂浆应饱满，勾缝应平顺。3、雨水管穿井墙处，管顶应砌砖券。4、井底应采用水泥砂浆抹出雨水口泛水坡。"},{"id":"E13","no":13,"q":"危大工程专项施工方案的主要内容应当包括哪些？","a":"（一）工程概况：危大工程概况和特点、施工平面布置、施 工要求和技术保证条件； （二）编制依据：相关法律、法规、规范性文件、标准、规 范及施工图设计文件、施工组织设计等； （三）施工计划：包括施工进度计划、材料与设备计划； （四）施工工艺技术：技术参数、工艺流程、施工方法、操 作要求、检查要求等； （五）施工安全保证措施：组织保障措施、技术措施、监测 监控措施等；（六）施工管理及作业人员配备和分工：施工管理人员、专 职安全生产管理人员、特种作业人员、其他作业人员等； （七）验收要求：验收标准、验收程序、验收内容、验收人 员等； （八）应急处置措施； （九）计算书及相关施工图纸。"},{"id":"E14","no":14,"q":"危大工程验收人员应当包括哪些人员？","a":"（一）总承包单位和分包单位技术负责人或授权委派的专业 技术人员、项目负责人、项目技术负责人、专项施工方案编制人员、 项目专职安全生产管理人员及相关人员； （二）监理单位项目总监理工程师及专业监理工程师； （三）有关勘察、设计和监测单位项目技术负责人。"},{"id":"E15","no":15,"q":"《嘉兴市文明行为促进条例》第十二条的内容是什么？","a":"每日二十二时至次日六时，禁止在城市市区噪声敏感建筑物集中区域内进行产生环境噪声污染的建筑施工作业，但抢修、抢险作业和因生产工艺上要求或者特殊需要必须连续作业的除外。因特殊需要必须连续作业的，必须有县级以上人民政府或者其有关主管部门的证明。前款规定的夜间作业，应当提前三日向附近居民公告。中考、高考期间，市、县（市）人民政府应当对产生环境噪声污染的建筑施工作业、装修活动作出时间和区域的限制性规定，并提前七日向社会公告。"},{"id":"E16","no":16,"q":"给排水管道铺设完毕并经检验合格后，应及时回填沟槽。回填前，应符合下列规定：（给水排水管道工程施工及验收规范 GB50268-2008 ）","a":"1 预制钢筋混凝土管道的现浇筑基础的混凝土强度、水泥砂浆接口的水泥砂浆强度不应小于 5MPa； 2 现浇钢筋混凝上管渠的强度应达到设计要求；3 混合结构的矩形或拱形管渠，砌体的水泥砂浆强度应达到设计要求；4 井室、雨水口及其他附属构筑物的现浇混凝土强度或砌体水泥砂浆强度应达到设计要求；5 回填时采取防止管道发生位移或损伤的措施；6 化学建材管道或管径大于 900mm的钢管、球墨铸铁管等柔性管道在沟槽回填前，应采取措施控制管道的竖向变形；7 雨期应采取措施防止管道漂浮。"},{"id":"E17","no":17,"q":"无压管道闭水试验时，试验管段应符合下列规定：给水排水管道工程施工及验收规范 GB50268-2008","a":"1 管道及检查井外观质量已验收合格；2 管道未回填土且沟槽内无积水；3 全部预留孔应封堵，不得渗水；4 管道两端堵板承载力经核算应大于水压力的合力；除预留进出水管外，应封堵坚固，不得渗水；5 顶管施工，其注浆孔封堵且管口按设计要求处理完毕，地下水位于管底以下。"},{"id":"E18","no":18,"q":"模扳、支架和拱架的设计中应设施工预拱度。施工预拱度应考虑下列因素：《城市桥梁工程施工与质量验收规范》CJJ2-2008","a":"1 设计文件规定的结构预拱度；2 支架和拱架承受全部施工荷载引起的弹性变形；3 受载后由于杆件接头处的挤压和卸落设备压缩而产生的非弹性变形；4 支架、拱架基础受载后的沉降。"},{"id":"E19","no":19,"q":"梁(T 构)的合龙、体系转换和支座反力调整应符合下列规定：","a":"1 合龙段的长度宜为 2m。2 合龙前应观测气温变化与梁端高程及悬臂端间距的关系。3 合龙前应按设计规定，将两悬臂端合龙口予以临时连接，并将合龙跨一侧墩的临时锚固放松或改成活动变座。4 合龙前，在两端悬臂预加压重，并于浇筑混凝土过程中逐步撤除，以使悬臂端挠度保持稳定。5 台龙宜在一天中气温最低时进行。6 合龙段的混凝土强度宜提高一级，以尽早施加预应力。7 连续梁的梁跨体系转换，应在合龙段及全部纵向连续预应力筋张拉、压浆完成，并解除各墩临时固结后进行。8 粱跨体系转换时，支座反力的调整应以高程控制为主，反力作为校核。"},{"id":"E20","no":20,"q":"钢桥焊缝连接应符合下列规定？","a":"1 首次焊接之前必须进行焊接工艺评定试验。2 焊工和无损检测员必须经考试合格取得资格证书后，方可从事资格证书中认定范围内的上作，焊工停焊时间超过 6 个月，应重新考核。3 焊接环境温度，低合金钢不得低下 5℃，普通碳素结构钢不得低于 0℃。焊接环境湿度不宜高于 80%。4 焊接前应进行焊缝除锈，并应在除锈后 24h 内进行焊接。5 焊接前，对厚度25mm以上的低合金钢预热温度宜为80～120℃，预热范围宜为焊缝两侧50～80mm。6 多层焊接宜连续施焊，并应控制层间温度。每一层焊缝焊完后应及时清除药皮、熔渣、溢流和其他缺陷后，再焊下一层。7 钢梁杆件现场焊缝连接应按设计要求的顺序进行。设计无要求时，纵向应从跨中向两端进行，横向应从中线向两侧对称进行。8 现场焊接应设防风设施，遮盖全部焊接处。雨天不得焊接，箱形梁内进行 C02 气体保护焊时，必须使用通风防护设施。"},{"id":"E21","no":21,"q":"箱涵顶进应具备以下条件？","a":"1 主体结构混凝土必须达到设计强度，防水层及防护层应符合设计要求。2 顶进后背和顶进设备安装完成，经试运转合格。3 线路加固方案完成，并经主管部门验收确认。4 线路监测、抢修人员及设备等应到位。"},{"id":"E22","no":22,"q":"玻璃幕墙工程的安装，应提供下列资料？","a":"1 玻璃幕墙的设计文件。2 玻璃幕墙的气密性能、水密性能和抗风压性能的检验报告及设计要求的其他性能检验报告。3 幕墙组件出厂质量合格证书。4 施工安装的自查记录。5 淋水试验记录。6 隐蔽工程验收记录。"},{"id":"E23","no":23,"q":"模板、支架和拱架的设计中应设施工预拱度。施工预拱度应考虑下列因素？《城市桥梁工程施工与质量验收规范》CJJ2-2008","a":"1 设计文件规定的结构预拱度；2 支架和拱架承受全部施工荷载引起的弹性变形；3 受载后由于杆件接头处的挤压和卸落设备压缩而产生的非弹性变形；4 支架、拱架基础受载后的沉降。"},{"id":"E24","no":24,"q":"当釆用充气胶囊作空心构件芯模时，模板安装应符合下列规定：","a":"1 胶囊在使用前应经检查确认无漏气。2 从浇筑混凝土到胶囊放气止,应保持气压稳定｡3 使用胶囊内模时,应釆用定位箍筋与模板连接固定,防止上浮和偏移｡4 胶囊放气时间应经试验确定,以混凝土强度达到能保持 构件不变形为宜｡"},{"id":"E25","no":25,"q":"箱式消火栓的安装应符合下列规定：建筑给水排水及采暖工程施工质量验收规范 GB 50242-2002","a":"1 栓口应朝外，并不应安装在门轴侧。2 栓口中心距地面为1.1m，允许偏差±20mm。3 阀门中心距箱侧面为140mm，距箱后内表面为100mm，允许偏差±5mm。4 消火栓箱体安装的垂直度允许偏差为3mm。"},{"id":"E26","no":26,"q":"水泥混凝土路面裂缝处理要求？","a":"（1）对裂缝宽度大于或等于2mm且小于15mm且贯穿板厚的中等裂缝，可来采取扩缝补块的方法处治，扩缝补块的最小宽度不应小于100mm。（2）板角断裂应按破裂面确定切割范围；宜采用早强补偿收缩混凝土，并应按原路面设置纵缝、横向缩缝、胀缝。"},{"id":"E27","no":27,"q":"沟槽开挖与地基处理应符合的要求有哪些？","a":"①原状地基土不得扰动、受水浸泡或受冻。②检查地基承载力试验报告，地基承载力应满足设计要求。③按设计或规定要求进行检查，检查检测记录、试验报告是否满足设计要求。进行地基处理时，压实度、厚度应满足设计要求"},{"id":"E28","no":28,"q":"焊接施工单位应符合哪些要求？","a":"(1）应有负责焊接工艺的焊接技术人员、检查人员和检验人员。(2）应有符合焊接工艺要求的焊接设备且性能稳定可靠。(3）应有保证焊接工程质量达到标准的措施。"},{"id":"E29","no":29,"q":"无压管道闭水试验准备工作有哪些？","a":"（1）管道及检查井外观质量已验收合格。（2）开槽施工管道未回填土且沟槽内无积水。（3）全部预留孔应封堵，不得渗水。（4)管道两端堵板承载力经核算应大于水压力的合力，除预留进出水管外，应封堵坚固、不得渗水。（5）顶管施工，其注浆孔封堵且管口按设计要求处理完毕，地下水位于管底以下。 (6）应做好水源引接、排水疏导等方案。"},{"id":"E30","no":30,"q":"质量验收不合格的处理？","a":"(1）经返工返修或经更换材料、构件、设备等的检验批，应重新进行验收。 (2) 经有相应资质的检测单位检测鉴定能够达到设计要求的检验批，应予以验收。 (3）经有相应资质的检测单位检测鉴定达不到设计要求，但经原设计单位核算认可能够满足结构安全和使用功能要求的检验批，可子以验收。（4）经返修或加固处理的分项工程、分部（子分部）工程，虽然改变外形尺寸但仍能满足结构安全和使用功能要求，可按技术处理方案文件和协商文件进行验收。（5）经过返修或加固处理仍不能满足结构安全或使用功能要求的分部（子分部）工程、单位（子单位）工程，严禁验收。"},{"id":"E31","no":31,"q":"施工质量验收程序","a":"(1）检验批应由专业监理工程师组织施工单位项目专业质量检查员、专业工长等进行验收。 (2）分项工程应由专业监理工程师组织施工单位项目专业技术负责人等进行验收。 (3）分部工程应由总监理工程师组织施工单位项目负责人和项目技术负责人等进行验收。"},{"id":"E32","no":32,"q":"关于有限空间作业的要求？","a":"(1）加强管道通风、有毒有害气体检测和各项安全防护工作。（2）作业人员必须接受安全技术培训。考核合格后方可上岗。 (3）作业人员必要时可穿戴防毒面具，防水衣，防护靴、防护手套、安全帽、系有绳子的防护腰带，配备无线通信工具和安全灯等。(4）作业区和地面设专人值守，确保人身安全。"},{"id":"E33","no":33,"q":"改性沥青摊铺与压实温度有哪些要求？","a":"①摊铺温度不低于160℃； ②初压开始温度不低于150℃； ③碾压终了的表面温度应不低于 90~ 120℃； ④开放交通温度为冷却至50℃以下。"},{"id":"E34","no":34,"q":"沥青面层冬季施工的措施有哪些？","a":"(1）城市快速路、主干路的沥青混合料面层严禁冬期施工。次干路及其以下道路在施工温度低于5℃时，应停止施工。当风力在6级及以上时，沥青混合料面层不应施工。(2）粘层、透层，封层严禁冬期施工。"},{"id":"E35","no":35,"q":"水下灌注混凝土导管的要求有哪些？","a":"(1）导管内壁应光滑圆顺，直径宜为 200~300mm，节长宜为 2m。 (2)导管不得漏水，使用前应试拼、试压，试压的压力宜为孔底静水压力的1.5倍。 (3）导管轴线偏差不宜超过孔深的0.5%，且不宜大于 100mm。(4）导管采用法兰盘接头宜加锥形活套，采用螺旋丝扣型接头时必须有防止松脱装置。"},{"id":"E36","no":36,"q":"工程开工前，监理人员应参加由建设单位主持召开的第一次工地会议。会议纪要由项目监理机构负责整理，与会各方代表会签。第一次工地会议应包括以下主要内容:（监理工作标准）？","a":"1 建设单位介绍工程项目概况、工程建设目标和相关要求;2建设单位、施工单位和工程监理单位分别介绍各自驻现场的组织机构、人员及其分工;3 建设单位根据监理合同宣布对总监理工程师的授权;4 建设单位介绍本工程开工准备情况;5 施工单位介绍施工准备情况;6 建设单位和总监理工程师对施工准备情况提出意见和要求;7 总监理工程师介绍监理规划的主要内容:8研究确定各方在施工过程中参加监理例会的主要人员，召开监理例会的周期、地点及主要议题。"},{"id":"E37","no":37,"q":"根据《城市桥梁工程施工与质量验收规范》(CJJ2-2008)，桥梁工程竣工验收应进行实体检测的项目有那些？","a":"桥梁轴线位移、桥宽（含车行道和人行道） 、长度、引道中线与桥梁中线偏差、桥头高程衔接。"},{"id":"E38","no":38,"q":"基坑监测当出现那些情况时，应提高监测频率？ （DB33-1116-2015）","a":"1监测数据达到报警值:2监测数据变化较大或者速率加快;3 存在勘察未发现的不良地质;4支护结构出现开裂;5 周边地面突发较大沉降或出现严重开裂;6邻近的建(构)筑物突发较大沉降、不均匀沉降或出现严重开裂;7 基坑底部、侧壁出现管涌、渗漏、流沙或异响等迹象;8基坑工程发生事故后重新组织施工;9 出现其他影响基坑及周边环境安全的异常情况。"},{"id":"E39","no":39,"q":"脚手架及其基础应在下列阶段进行检查与验收？ （DB33-1116-2015）","a":"1 基础完工后、脚手架搭设前及悬挑梁安装完成后；2 作业层上施加荷载前；3 每搭设完 6m~8m 高度后；4 达到设计高度后；5 遇有六级及以上强风或大雨后、结冻解冻后；6 停用超过一个月。"},{"id":"E40","no":40,"q":"桥梁基础灌注桩监理要点？","a":"1、桩定位核验。2、冲(钻)机选型及检查。3、检查护筒埋设及泥浆比重。4、垂直度及孔径控制。5、终孔条件检查。6、清孔检查。7、钢筋笼制作与安装检查。8、旁站水下混凝土的浇筑，并见证试块留置。"},{"id":"E41","no":41,"q":"根据《建筑与市政工程施工质量控制通用规范》GB55032-2022，施工过程质量控制，在工程质量策划中应在那些部位和环节设置质量控制点？","a":"1、 影响施工质量的关键部位、关键环节。2、影响结构安全和使用功能的关键部位、关键环节。3、采用新技术、新工艺、新材料、新设备的部位和环节。4、隐蔽工程验收。"},{"id":"E42","no":42,"q":"根据《建筑与市政工程防水通用规范》GB55030-2022，防水材料及配套辅助材料进场时应提供那些资料？","a":"1、产品合格证。2、质量检验报告。3、使用说明书。4、 进场复验报告。防水卷材进场复验报告应包含无处理时卷材接缝剥离强度和搭接缝不透水性检测结果。"},{"id":"E43","no":43,"q":"桥梁工程防水层施工时注意那些要点？【《建筑与市政工程防水通用规范》GB55030-2022 】","a":"1、桥梁工程防水层施工，应在基层混凝土强度达到设计强度的 80%及以上后进行。2、 防水施工前，桥面基层混凝土应进行表面粗糙度处理，基层表面的浮灰应清除干净。3 、桥面防水层应直接铺设在混凝土结构表面，不应在二者间加铺砂浆找平层。"},{"id":"E44","no":44,"q":"在钻孔灌注桩混凝土灌注施工时，旁站监理控制要点包括那些？","a":"1、充盈系数控制。2、浇灌时间控制。3、初灌量控制。4、商品混凝土质量检查。"},{"id":"E45","no":45,"q":"根据《建筑地基基础工程施工质量验收标准》（GB50202-2018），泥浆护壁成孔灌注桩质量检验标准中主控检测项目是什么及对应的检测方法？","a":"1、承载力（ 不小于设计值 静载试验）。2、孔深 （不小于设计值 用测绳或井径仪测量）。3、桩身完整性（钻芯法,低应变法，声波透射法）。4、混凝土强度（不小于设计值 28d试块强度或钻芯法）。5、嵌岩深度（不小于设计值 取岩样或超前钻孔取样）。"},{"id":"E46","no":46,"q":"市政工程功能性检验主要项目应包括下列内容？","a":"1、道路工程的弯沉试验；2、无压力管道(工作压力<0.1MPa) 严密性试验；3、桥梁工程的动、静载试验；4、水池满水试验；5、消化池气密性试验；6、压力管道(工作压力≥0.1MPa) 的强度试验、严密性试验和通球试验等"},{"id":"E47","no":47,"q":"对危险性较大的分部分项工程资料，项目监理机构应纳入档案管理的有哪些？","a":"监理实施细则、专项施工方案审查、专项巡视检查、验收及整改等相关资料纳入档案管理。"},{"id":"E48","no":48,"q":"工程质量评估报告主要内容是什么？","a":"1、工程概况、工程各参建单位;2、工程施工过程介绍;3、工程质量验收情况;4、质量控制资料核查情况;5、工程质量事故及其处理情况;6、工程质量评估结论。"},{"id":"E49","no":49,"q":"监理单位应当将哪些相关资料纳入危大工程档案管理？","a":"监理实施细则、专项施工方案审查、专项巡视检查、验收及整改"},{"id":"E50","no":50,"q":"在主出入口明显处应设哪五牌二图？","a":"工程概况牌、管理人员名单及监督电话牌、消防保卫（防火责任）牌、安全生产牌、文明施工牌和施工现场平面图、消防安全平面布置图。"},{"id":"E51","no":51,"q":"《建设工程监理规范》GB/T 50319-2013规定，项目监理机构应根据建设工程监理合同约定，采用哪些方式对建设工程实施监理？","a":"巡视、平行检验、旁站、见证取样"},{"id":"E52","no":52,"q":"《建设工程监理规范》GB/T 50319-2013规定，工程监理单位用表、施工单位报审、报验用表中除了工程开工令和施工组织设计报审表需要由总监理工程师签字并加盖执业印章外还有哪些？","a":"工程暂停令、工程复工令、工程款支付证书、工程开工报审表、单位工程竣工验收报审表、工程款支付报审表、费用索赔报审表、工程临时或最终延期报审表。"},{"id":"E53","no":53,"q":"超过一定规模的危大工程专项施工方案专家论证会的参会人员应当包括哪些？","a":"1、专家；2、建设单位项目负责人；3、有关勘察、设计单位项目技术负责人及相关人员；4、总承包单位和分包单位技术负责人或授权委派的专业技术人员、项目负责人、项目技术负责人、专项施工方案编制人员、项目专职安全生产管理人员及相关人员；5、监理单位项目总监理工程师及专业监理工程师。"},{"id":"E54","no":54,"q":"安全生产事故根据安全事故造成的人员伤亡或者直接经济损失可分为哪四个等级？","a":"特别重大事故、重大事故、较大事故、一般事故"},{"id":"E55","no":55,"q":"建筑行业有哪些特种作业人员？","a":"建筑电工、架子工、起重信号司索工、起重机械司机、起重机械安装拆卸工、高处作业吊兰安装拆卸工、电焊工"},{"id":"E56","no":56,"q":"《建筑与市政工程施工质量控制通用规范》中规定当检验批施工质量不符合验收标准时，应按下列规定处理：","a":"（一）、经返工或返修的检验批，应重新进行验收。（二）、经有资质的检测机构检测能够达到设计要求的检验批，应予以验收。（三）、经有资质的检测机构检测达不到设计要求，但经原设计单位核算认可能够满足安全和使用功能的检验批，应予以验收。"},{"id":"E57","no":57,"q":"《危险性较大的分部分项工程安全管理规定》第三十六条 监理单位有下列行为之一的，依照《中华人民共和国安全生产法》《建设工程安全生产管理条例》对单位进行处罚；对直接负责的主管人员和其他直接责任人员处1000元以上 5000元以下的罚款：","a":"（一）总监理工程师未按照本规定审查危大工程专项施工方案的；（二）发现施工单位未按照专项施工方案实施，未要求其整改或者停工的；（三）施工单位拒不整改或者不停止施工时，未向建设单位和工程所在地住房城乡建设主管部门报告的。"},{"id":"E58","no":58,"q":"《危险性较大的分部分项工程安全管理规定》第三十七条 监理单位有下列行为之一的，责令限期改正，并处1万元以上 3 万元以下的罚款；对直接负责的主管人员和其他直接责任人员处 1000 元以上 5000 元以下的罚款：","a":"（一）未按照本规定编制监理实施细则的；（二）未对危大工程施工实施专项巡视检查的；（三）未按照本规定参与组织危大工程验收的；（四）未按照本规定建立危大工程安全管理档案的。"},{"id":"E59","no":59,"q":"危险性较大的分部分项工程专项施工方案编制指南中规定基坑工程方案编制需要包含哪些内容？","a":"（一）、工程概况；（二）、编制依据；（三）、施工计划；（四）、施工工艺技术；（五）、施工保证措施；（六）、施工管理及作业人员配备及分工；（七）、验收要求；（八）、应急处置措施；（九）、计算书及相关设计图纸。"},{"id":"E60","no":60,"q":"《给水排水管道工程施工及验收规范》GB 50268规定水压试验中主试验阶段的工作为哪些？","a":"（一）停止注水补压，稳定 15min；（二）当15min后压力下降不超过规范允许压力降数值时，将试验压力降至工作压力并保持恒压30min，进行外观检查若无漏水现象，则水压试验合格。"},{"id":"E61","no":61,"q":"《建设工程监理工作标准》专业监理工程师应对进场的主要施工机械、设备进行检查。检查应包括下列基本内容：","a":"（一）型号、规格符合施工组织设计的要求；（二）计量设备的定期检定证明；（三）定期维修保养记录；（四）整机或关键部件检验检测合格的有效期。"},{"id":"E62","no":62,"q":"《浙江省建筑施工安全管理规范》DB33-1116中 4.6.1 基坑施工需要实行基坑监测的三种情况包含哪些内容？","a":"（一）开挖深度大于或等于 5m 的基坑工程；（二）开挖深度小于 5m，但现场地质情况和周围环境较复杂的基坑工程；（三）其他需要监测的基坑工程。"},{"id":"E63","no":63,"q":"《浙江省建筑施工安全管理规范》DB33-1116中 4.6.3 规定基坑专业监测单位应由建设单位委托具备相应资质的第三方对基坑工程实施现场监测。基坑工程实施前监测单位应编制监测方案。监测方案需经哪些单位认可？","a":"建设单位、监理单位、基坑支护设计单位。"},{"id":"E64","no":64,"q":"《城镇供排水有限空间作业安全规程》DB33/T1149中5.13.14 规定作业期间发生五种下列情况之一时，作业者应停止作业，迅速撤离现场：","a":"（一）发现异常；（二）作业者出现身体不适；（三）安全防护设备或个体防护装备失效；（四）气体检测报警仪报警；（五）监护者或作业负责人下达撤离命令。"},{"id":"E65","no":65,"q":"《建设工程监理工作标准》DBJ33/T1104中6.5.4项目监理机构应安排监理人员对施工过程进行的巡视检查内容有哪些？","a":"（一）按图纸、规范和标准施工情况；（二）施工方案的的实施情况；（三）材料、设备、构配件使用情况；（四）施工现场管理人员到位情况；（五）特种作业人员的操作资格证；（六）施工环境。"}]};</script>
<script>
(function(){
'use strict';

/* ==================== 存储 ==================== */
var LS = (function(){
  var mem = {}, ok = true;
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); } catch(e){ ok = false; }
  return {
    get: function(k, d){ try { var v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set: function(k, v){ try { var s = JSON.stringify(v); if(ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){} },
    del: function(k){ try { if(ok) localStorage.removeItem(k); else delete mem[k]; } catch(e){} }
  };
})();
var K = { cfg:'szq.cfg', wrong:'szq.wrong', hist:'szq.hist', sess:'szq.sess', theme:'szq.theme' };

/* ==================== 数据 ==================== */
var KINDS = ['single','multi','blank','essay'];
var KLABEL = { single:'单选题', multi:'多选题', blank:'填空题', essay:'简答题' };

var ALL = [], BY_ID = {}, COUNT = { single:0, multi:0, blank:0, essay:0 };
(function(){
  (BANK.choice || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:q.type, stem:q.stem, options:q.options, answer:q.answer };
    ALL.push(item); BY_ID[item.id] = item; COUNT[item.kind]++;
  });
  (BANK.blank || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:'blank', segs:q.segs, answers:q.answers };
    ALL.push(item); BY_ID[item.id] = item; COUNT.blank++;
  });
  (BANK.essay || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:'essay', q:q.q, a:q.a };
    ALL.push(item); BY_ID[item.id] = item; COUNT.essay++;
  });
})();
var TOTAL = ALL.length;

/* ==================== 工具 ==================== */
var main = document.getElementById('main');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtSec(s){
  s = Math.max(0, Math.round(s));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(x) : m + ':' + pad2(x);
}
function pct(a, b){ return b > 0 ? Math.round(a / b * 100) : 0; }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

/* 填空模糊判分 */
function normBlank(s){
  return String(s || '').toLowerCase()
    .replace(/[\s\u3000]/g, '')
    .replace(/[。．.,，、；;：:！!？?（）()【】\[\]《》〈〉“”"'‘’\-—–_·]/g, '')
    .replace(/[～~]/g, '-')
    .replace(/％/g, '%');
}
function blankTokens(a){
  return String(a).split(/[、，,；;\/]|或者|或/).map(normBlank).filter(function(t){ return t.length > 0; });
}
function lcsRatio(a, b){
  if (!a.length || !b.length) return 0;
  if (a.length > 80 || b.length > 80) {
    var short = a.length < b.length ? a : b, long = a.length < b.length ? b : a, hit = 0;
    for (var i = 0; i < short.length; i++) if (long.indexOf(short.charAt(i)) >= 0) hit++;
    return hit / long.length;
  }
  var m = b.length, prev = new Array(m + 1).fill(0), cur = new Array(m + 1).fill(0);
  for (var x = 1; x <= a.length; x++){
    for (var y = 1; y <= m; y++){
      cur[y] = a.charAt(x - 1) === b.charAt(y - 1) ? prev[y - 1] + 1 : Math.max(prev[y], cur[y - 1]);
    }
    prev = cur.slice();
  }
  return prev[m] / Math.max(a.length, b.length);
}
/* ---------- 简答题：按要点覆盖率判分 ---------- */
var PUNCT_RE = /[\s。，、；：！？（）()\[\]【】《》〈〉“”"'‘’—\-…·\/\\,.;:!?]/g;
function stripPunct(s){ return String(s == null ? '' : s).replace(PUNCT_RE, ''); }

function cleanPoint(p){
  return String(p)
    .replace(/^[\s①②③④⑤⑥⑦⑧⑨⑩]+/, '')
    .replace(/^[(（][一二三四五六七八九十\d]{1,3}[)）]\s*/, '')
    .replace(/^\d{1,2}\s*[、)）]\s*/, '')
    .replace(/^[\s：:、]+/, '')
    .trim();
}
function essayPoints(answer){
  var t = String(answer || '').trim();
  if (!t) return [];
  var marker = /(?=[①②③④⑤⑥⑦⑧⑨⑩]|[(（][一二三四五六七八九十\d]{1,3}[)）]|\d{1,2}\s*[、)）])/;
  var parts = t.split(marker).map(cleanPoint).filter(function(p){ return p.length >= 4; });
  if (parts.length < 2){
    parts = t.split(/[。；;\n]/).map(cleanPoint).filter(function(p){ return p.length >= 6; });
  }
  if (parts.length < 2){
    parts = t.split(/[、，,]/).map(cleanPoint).filter(function(p){ return p.length >= 3; });
  }
  if (!parts.length) parts = [cleanPoint(t)];
  return parts;
}
function grams3(s){
  var seen = {}, out = [];
  for (var i = 0; i + 3 <= s.length; i++){
    var g = s.substr(i, 3);
    if (!seen[g]) { seen[g] = 1; out.push(g); }
  }
  return out;
}
function pointHit(point, userNorm){
  var p = stripPunct(point);
  if (!p) return false;
  if (p.length <= 3) return userNorm.indexOf(p) >= 0;
  if (userNorm.indexOf(p) >= 0) return true;
  var g = grams3(p);
  if (!g.length) return false;
  var hit = 0;
  for (var i = 0; i < g.length; i++) if (userNorm.indexOf(g[i]) >= 0) hit++;
  return hit / g.length >= 0.4;
}
function gradeEssay(answer, userText){
  var pts = essayPoints(answer);
  var u = stripPunct(userText);
  var hits = pts.map(function(p){ return pointHit(p, u); });
  var n = pts.length, h = hits.filter(Boolean).length;
  var ratio = n ? h / n : 0;
  var level = ratio >= 0.6 ? 'ok' : ratio >= 0.3 ? 'mid' : 'bad';
  return {
    hit: h, total: n, ratio: ratio, level: level,
    correct: ratio >= 0.6,
    misses: pts.filter(function(p, i){ return !hits[i]; })
  };
}

function matchBlank(input, answer){
  var i0 = normBlank(input), a0 = normBlank(answer);
  if (!i0) return 'wrong';
  if (i0 === a0) return 'exact';
  var tk = blankTokens(answer);
  if (tk.length > 1 && tk.every(function(t){ return i0.indexOf(t) >= 0; })) return 'exact';
  if (a0.indexOf(i0) >= 0){
    if (i0.length >= 4) return 'exact';
    if (i0.length / a0.length >= 0.6) return 'exact';
  }
  if (i0.indexOf(a0) >= 0) return 'exact';
  if (tk.length > 1){
    var hit = tk.filter(function(t){ return i0.indexOf(t) >= 0; }).length;
    if (hit / tk.length >= 0.5) return 'partial';
  }
  var r = lcsRatio(i0, a0);
  if (r >= 0.82) return 'exact';
  if (r >= 0.5) return 'partial';
  return 'wrong';
}

function poolOf(cfg){
  var set = {};
  cfg.kinds.forEach(function(k){ set[k] = true; });
  return ALL.filter(function(q){ return set[q.kind]; });
}
function drawSet(cfg){
  var pool = poolOf(cfg);
  if (cfg.order === 'random') pool = shuffle(pool.slice());
  else {
    pool = pool.slice().sort(function(a, b){
      if (a.kind !== b.kind) return KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind);
      return a.no - b.no;
    });
  }
  var n = cfg.count === 0 ? pool.length : Math.min(cfg.count, pool.length);
  return pool.slice(0, n).map(function(q){ return q.id; });
}

function recOf(q){
  var r = S.session.recs[q.id];
  if (!r){
    r = { picked: [], texts: [], essayText: '', graded: false, correct: null,
          blankHits: null, judge: null };
    if (q.kind === 'blank') r.texts = q.answers.map(function(){ return ''; });
    S.session.recs[q.id] = r;

function answeredCount(){

    if (r && isDone(r, q)) n++;
  });

}
function isDone(rec, q){
  if (!rec) return false;
  if (q.kind === 'essay') return q.a ? !!rec.graded : !!rec.judge;
  return !!rec.graded;
}

            (rec.judge === 'right' ? '✓' : '✗') + '</span>已记为' + (rec.judge === 'right' ? '答对' : '未掌握') + '</div>'

      ansBox += rec.judge === 'auto'
        ? '<div class="judge"><button class="btn sm" data-act="judge" data-v="right">我答得更全，算我对</button>' +
          '<button class="btn sm" data-act="judge" data-v="wrong">我其实没答到</button></div>'
        : '<div class="judge"><button class="btn ghost sm" data-act="judge" data-v="auto">恢复自动判定</button></div>';
    }
  }

  var submitLabel = q.kind === 'essay' ? '提交判分' : '提交答案';
  var nextDisabled = '';
  if (q.kind === 'essay' && rec.graded && !rec.judge) nextDisabled = ' disabled';

  var isLast = idx === total - 1;
  var foot, headRight;
  if (isExam){
    var remain = examRemain();
    headRight = '<span>已答 <b class="num">' + doneN + '</b>/' + total + '</span>' +
      '<span class="clock' + (remain < 60000 ? ' danger' : remain < 600000 ? ' warn' : '') + '" id="clock">' +
      fmtSec(remain / 1000) + '</span>' +
      '<button class="btn ghost sm" data-act="card">答题卡</button>' +
      '<button class="btn primary sm" data-act="askext">交卷</button>';
    foot =
      '<div class="foot">' +
        '<button class="btn ghost" data-act="prev"' + (idx === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<span class="spacer"></span>' +
        '<span class="note">考试中不判分、不给答案，交卷后统一批改</span>' +
        (isLast
          ? '<button class="btn primary" data-act="askext">交卷</button>'
          : '<button class="btn primary" data-act="next">下一题 →</button>') +
      '</div>';
  } else {
    headRight = '<span>已答 <b class="num">' + doneN + '</b>/' + total + '</span><span id="clock">' + elapsed() + '</span>' +
      '<button class="btn ghost sm" data-act="quit" title="退出并保留进度（Esc）">退出</button>';
    foot =
      '<div class="foot">' +
        '<button class="btn ghost" data-act="prev"' + (idx === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<span class="spacer"></span>' +
        (!rec.graded
          ? '<button class="btn ghost" data-act="reveal">不会，看答案</button>' +
            '<button class="btn primary" data-act="submit">' + submitLabel + '</button>'
          : (q.kind === 'essay' && !rec.judge
              ? '<span class="note">本题无参考答案，请先自行判断</span>'
              : '')) +
        '<button class="btn ' + (rec.graded ? 'primary' : '') + '" data-act="next"' + nextDisabled + '>' +
          (isLast ? '交卷查分' : '下一题 →') + '</button>' +
      '</div>';
  }

  main.innerHTML =
  '<div class="quizhead">' +
    '<div class="qh-left"><span class="tag ' + tagCls + '">' + KLABEL[q.kind] + '</span>' +
      '<span class="dim num">第 ' + (idx + 1) + ' / ' + total + ' 题</span>' +
      (isExam ? '' : '<span class="dim">· 原题 ' +
        (q.kind === 'single' || q.kind === 'multi' ? '选择' : q.kind === 'blank' ? '填空' : '简答') + ' #' + q.no + '</span>') +
    '</div>' +
    '<div class="qh-right">' + headRight + '</div>' +
  '</div>' +
  '<div class="progress"><i style="width:' + (total ? (idx + 1) / total * 100 : 0) + '%"></i></div>' +
  '<div class="qcard">' + bodyHTML + verdictHTML + ansBox + '</div>' +
  foot;

  tickClock();
}
function elapsed(){
  if (!S.session) return '0:00';
  return fmtSec((Date.now() - S.session.startedAt) / 1000);
}
function tickClock(){
  clearInterval(S.timer);
  S.timer = setInterval(function(){
    var el = document.getElementById('clock');
    if (!el){ clearInterval(S.timer); return; }
    if (S.session && S.session.mode === 'exam'){
      var remain = examRemain();
      el.textContent = fmtSec(remain / 1000);
      el.className = 'clock' + (remain < 60000 ? ' danger' : remain < 600000 ? ' warn' : '');
      if (remain <= 0) finishExam(true);
    } else {
      el.textContent = elapsed();
    }
  }, 1000);
}

/* ==================== 作答动作 ==================== */
function pick(k){
  var q = curQ(), rec = recOf(q);
  if (rec.graded) return;
  if (q.kind === 'single'){
    rec.picked = [k];
  } else {
    var i = rec.picked.indexOf(k);
    if (i >= 0) rec.picked.splice(i, 1);
    else rec.picked.push(k);
  }
  saveSession();
  render();
}
function submit(){
  var q = curQ(), rec = recOf(q);
  if (q.kind === 'essay'){
    rec.graded = true;
    if (!q.a){
      rec.judge = null; rec.correct = null; rec.essayGrade = null;
    } else {
      var eg = gradeEssay(q.a, rec.essayText || '');
      rec.essayGrade = eg;
      rec.judge = 'auto';
      rec.correct = eg.correct;
      recordResult(q, rec.correct);
    }
  } else if (q.kind === 'blank'){
    rec.blankHits = q.answers.map(function(a, i){ return matchBlank(rec.texts[i] || '', a); });
    rec.correct = rec.blankHits.every(function(h){ return h === 'exact'; });
    rec.graded = true;
    recordResult(q, rec.correct);
  } else {
    if (!rec.picked.length){ toast('请先选择答案，或用「不会，看答案」直接对答案'); return; }
    var sorted = rec.picked.slice().sort().join('');
    rec.correct = sorted === q.answer.split('').sort().join('');
    rec.graded = true;
    recordResult(q, rec.correct);
  }
  saveSession();
  render();
}
/* 简答题人工改判 / 恢复自动判定 */
function judge(v){
  var q = curQ(), rec = recOf(q);
  var prev = rec.correct;
  if (v === 'auto'){
    if (!rec.essayGrade) return;
    rec.judge = 'auto';
    rec.correct = rec.essayGrade.correct;
  } else {
    rec.judge = v;
    rec.correct = v === 'right';
  }
  if (prev !== rec.correct){
    var m = wrongMap();
    if (rec.correct){ if (m[q.id]){ delete m[q.id]; saveWrong(m); } }
    else recordResult(q, false);
  }
  saveSession();
  render();
}
function next(){
  var ses = S.session, q = curQ(), rec = recOf(q);
  if (ses.mode === 'exam'){
    if (ses.idx >= ses.ids.length - 1){ askSubmitExam(); return; }
    ses.idx++;
    saveSession();
    render();
    return;
  }
  if (q.kind === 'essay' && rec.graded && !rec.judge){ toast('请先判断这道题答对没有'); return; }
  if (ses.idx >= ses.ids.length - 1){ finish(); return; }
  ses.idx++;
  saveSession();
  render();
}
function prev(){
  if (S.session.idx === 0) return;
  S.session.idx--;
  saveSession();
  render();
}
function finish(){
  var ses = S.session;
  ses.ended = true;
  ses.finishedAt = Date.now();
  var total = ses.ids.length, right = 0;
  var byKind = {};
  ses.ids.forEach(function(id){
    var q = BY_ID[id], r = ses.recs[id] || {};
    if (!byKind[q.kind]) byKind[q.kind] = { n: 0, right: 0 };
    byKind[q.kind].n++;
    if (isDone(r, q) && r.correct){ right++; byKind[q.kind].right++; }
  });
  var hist = LS.get(K.hist, []);
  hist.unshift({ t: Date.now(), total: total, right: right, secs: Math.round((ses.finishedAt - ses.startedAt) / 1000) });
  LS.set(K.hist, hist.slice(0, 50));
  LS.del(K.sess);
  show('result');
}

/* ==================== 结果 ==================== */
function renderResult(){
  var ses = S.session;
  if (!ses){ show('home'); return; }
  var total = ses.ids.length, right = 0, done = 0;
  var byKind = {};
  var rows = ses.ids.map(function(id, i){
    var q = BY_ID[id], r = ses.recs[id] || {};
    var ok = isDone(r, q) && r.correct;
    if (isDone(r, q)) done++;
    if (ok) right++;
    if (!byKind[q.kind]) byKind[q.kind] = { n: 0, right: 0 };
    byKind[q.kind].n++;
    if (ok) byKind[q.kind].right++;
    return { q: q, r: r, ok: ok, i: i };
  });
  var rate = pct(right, total);
  var C = 2 * Math.PI * 57;
  var dash = C * rate / 100;
  var color = rate >= 80 ? 'var(--ok)' : rate >= 60 ? 'var(--brand)' : 'var(--bad)';
  var secs = (ses.finishedAt ? (ses.finishedAt - ses.startedAt) : (Date.now() - ses.startedAt)) / 1000;

  var kindRows = KINDS.filter(function(k){ return byKind[k]; }).map(function(k){
    var d = byKind[k], p = pct(d.right, d.n);
    return '<div class="rw"><span>' + KLABEL[k] + '</span>' +
      '<span class="bar"><i style="width:' + p + '%;background:' + (p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--brand)' : 'var(--bad)') + '"></i></span>' +
      '<span class="dim num">' + d.right + '/' + d.n + '</span>' +
      '<span class="pct">' + p + '%</span></div>';
  }).join('');

  var wrongList = rows.filter(function(x){ return !x.ok; });
  var reviewHTML = '';
  if (wrongList.length){
    reviewHTML = '<div class="sec"><div class="sec-h">错题回顾（' + wrongList.length + '）</div>' +
      wrongList.map(function(x){
        return qitemHTML(x.q, {
          my: myAnswerText(x.q, x.r),
          note: x.q.kind === 'essay' && !String(x.r.essayText || '').trim() ? '未填写答案' : ''
        });
      }).join('') + '</div>';
  } else {
    reviewHTML = '<div class="card pad" style="margin-top:22px;text-align:center">' +
      '<div style="font-size:30px">🎉</div><div style="font-weight:600;margin-top:6px">全部答对</div>' +
      '<div class="dim">这套题没有错题，继续保持。</div></div>';
  }

  main.innerHTML =
  '<div class="card pad">' +
    '<div class="result-top">' +
      '<div class="ring">' +
        '<svg width="132" height="132" viewBox="0 0 132 132">' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="var(--line)" stroke-width="11"/>' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round" ' +
            'stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="mid"><b>' + rate + '%</b><small>正确率</small></div>' +
      '</div>' +
      '<div style="flex:1;min-width:220px">' +
        '<h2>' + (rate >= 90 ? '非常稳' : rate >= 75 ? '基本过关' : rate >= 60 ? '还需补漏' : '要重点复习') + '</h2>' +
        '<p class="muted" style="margin:6px 0 0">本套 ' + total + ' 题，答对 <b>' + right + '</b> 题，用時 ' + fmtSec(secs) + '。</p>' +
        '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
          '<button class="btn primary" data-act="again">再来一套</button>' +
          (wrongList.length ? '<button class="btn" data-act="drill">只练这套的错题（' + wrongList.length + '）</button>' : '') +
          '<button class="btn ghost" data-act="home">返回首页</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="grid4">' +
      '<div class="kpi"><b class="num">' + total + '</b><span>总题数</span></div>' +
      '<div class="kpi ok"><b class="num">' + right + '</b><span>答对</span></div>' +
      '<div class="kpi bad"><b class="num">' + (total - right) + '</b><span>答错</span></div>' +
      '<div class="kpi"><b class="num">' + fmtSec(secs) + '</b><span>用时</span></div>' +
    '</div>' +
    (kindRows ? '<div class="rows"><div class="hd"><span>题型</span><span>分布</span><span>正确</span><span style="text-align:right">正确率</span></div>' + kindRows + '</div>' : '') +
  '</div>' +
  reviewHTML +
  '<div class="foot" style="margin-top:22px"><span class="spacer"></span>' +
    '<button class="btn" data-act="again">再来一套</button>' +
    '<button class="btn ghost" data-act="home">返回首页</button></div>';

  window.scrollTo(0, 0);
}

function myAnswerText(q, r){
  if (!r) return '';
  if (q.kind === 'single' || q.kind === 'multi'){
    return r.picked && r.picked.length ? r.picked.join('') : '（未作答）';
  }
  if (q.kind === 'blank'){
    var parts = (r.texts || []).map(function(t, i){
      return (i + 1) + '．' + (String(t || '').trim() || '空');
    });
    return parts.join('　');
  }
  if (q.kind === 'essay') return r.essayText ? r.essayText : '（未填写）';
  return '';
}
function answerText(q){
  if (q.kind === 'single' || q.kind === 'multi') return q.answer;
  if (q.kind === 'blank') return q.answers.join('；');
  if (q.kind === 'essay') return q.a || '（题库原表未附参考答案）';
  return '';
}
function stemOf(q){
  if (q.kind === 'essay') return q.q;
  if (q.kind === 'blank'){
    return q.segs.map(function(s){ return s.t === 'text' ? s.v : '＿＿'; }).join('');
  }
  return q.stem;
}
function qitemHTML(q, extra){
  extra = extra || {};
  var st = extra.st ? '<span class="st" style="color:' + (extra.stColor || 'var(--ink3)') + '">' + esc(extra.st) + '</span>' : '';
  var body = '<div class="bd">';
  if (q.kind === 'single' || q.kind === 'multi'){
    body += '<p>' + esc(q.stem) + '</p>';
    body += '<p>' + q.options.map(function(o){
      var isAns = q.answer.indexOf(o.k) >= 0;
      return '<span style="display:inline-block;margin:2px 14px 2px 0;' + (isAns ? 'color:var(--ok);font-weight:600' : '') + '">' +
        o.k + '．' + esc(o.v) + (isAns ? ' ✓' : '') + '</span>';
    }).join('') + '</p>';
  } else if (q.kind === 'blank'){
    body += '<p>' + q.segs.map(function(s){
      return s.t === 'text' ? esc(s.v) : '<span class="an">' + esc(s.v) + '</span>';
    }).join('') + '</p>';
  } else {
    body += '<p>' + esc(q.q) + '</p>';
  }
  body += '<p><span class="lb">正确答案</span><span class="an">' + esc(answerText(q)) + '</span></p>';
  if (extra.my) body += '<p><span class="lb">我的答案</span><span class="my">' + esc(extra.my) + '</span></p>';
  if (extra.note) body += '<p class="dim">' + esc(extra.note) + '</p>';
  body += '</div>';
  return '<details class="qitem"><summary>' +
    '<span class="tag ' + q.kind + '">' + KLABEL[q.kind] + '</span>' +
    '<span class="qt">' + esc(stemOf(q)) + '</span>' +
    '<span class="no">#' + q.no + '</span>' + st +
    '</summary>' + body + '</details>';
}

    '<button class="btn primary" data-act="drillWrong">重练错题（' + items.length + '）</button>' +

/* ==================== 题库浏览 ==================== */
function haystack(q){
  var s = '';
  if (q.kind === 'essay') s = q.q + ' ' + (q.a || '');
  else if (q.kind === 'blank') s = q.segs.map(function(x){ return x.v; }).join('') + ' ' + q.answers.join(' ');
  else s = q.stem + ' ' + q.options.map(function(o){ return o.v; }).join(' ');
  return s + ' #' + q.no + ' ' + KLABEL[q.kind];
}
function renderBrowse(){

  main.innerHTML =
  '<div class="sec-h" style="margin-top:0">题库 · 共 ' + TOTAL + ' 题</div>' +
  '<div class="toolbar">' +
    '<label class="search"><span class="ic">🔍</span>' +
      '<input id="kw" type="search" placeholder="搜索题干、选项、答案关键词…" value="' + esc(st.kw) + '"></label>' +
  '</div>' +
  '<div class="toolbar"><div class="filters" data-act="bfilter">' +

    }).join('') +
  '</div></div>' +
  '<div id="browseList"></div>';
  paintBrowseList();
  var kw = document.getElementById('kw');
  kw.addEventListener('input', function(){ S.browse.kw = kw.value; paintBrowseList(); });
}
function paintBrowseList(){
  var st = S.browse, box = document.getElementById('browseList');
  if (!box) return;
  var kw = (st.kw || '').trim();
  var list = ALL.filter(function(q){
    if (st.kind && q.kind !== st.kind) return false;
    if (kw && haystack(q).indexOf(kw) < 0) return false;
    return true;
  });
  var shown = list.slice(0, 300);
  box.innerHTML =
    (list.length ? '<div class="dim" style="margin:2px 0 10px">匹配 ' + list.length + ' 题' +
        (list.length > shown.length ? '，显示前 ' + shown.length + ' 题' : '') + '　（点开看答案）</div>' : '') +
    shown.map(function(q){ return qitemHTML(q, {}); }).join('') +
    (!list.length ? '<div class="empty"><div class="big">🔍</div><p>没有匹配的题目</p></div>' : '');
}

/* ==================== 模拟考试 ==================== */
/* 结构参照《公司监理人员（市政）考试试卷（2025 年上半年度）》
   选择题 18 分 + 填空题 50 分 + 问答题 32 分 = 100 分 */
var EXAM = {
  minutes: 90,
  pass: 60,
  sections: [
    { kind: 'single', n: 9,  per: 2, label: '一、选择题' },
    { kind: 'blank',  n: 10, per: 5, label: '二、填空题' },
    { kind: 'essay',  n: 5,  per: 0, label: '三、问答题', weights: [8, 8, 8, 4, 4] }
  ]
};
function secFull(sec){
  return sec.per ? sec.per * sec.n : sec.weights.reduce(function(a, b){ return a + b; }, 0);
}
function examFullScore(){
  return EXAM.sections.reduce(function(a, s){ return a + secFull(s); }, 0);
}
function fs(n){ return String(Math.round(n * 10) / 10); }
function remainOf(ses){
  if (!ses || !ses.exam) return 0;
  return Math.max(0, ses.startedAt + ses.exam.minutes * 60000 - Date.now());
}
function examRemain(){ return remainOf(S.session); }

function startExam(){
  var items = [];
  EXAM.sections.forEach(function(sec){
    var pool = ALL.filter(function(q){ return q.kind === sec.kind; });
    shuffle(pool.slice()).slice(0, sec.n).forEach(function(q, i){
      items.push({ id: q.id, section: sec.label, score: sec.per || sec.weights[i] });
    });
  });
  var meta = {};
  items.forEach(function(x){ meta[x.id] = { section: x.section, score: x.score }; });
  S.session = {
    ids: items.map(function(x){ return x.id; }),
    idx: 0, recs: {}, startedAt: Date.now(), ended: false,
    mode: 'exam', meta: meta,
    exam: { minutes: EXAM.minutes, pass: EXAM.pass, full: examFullScore() }
  };
  saveSession();
  show('quiz');
}

function hasAnswer(q, r){
  if (!r) return false;
  if (q.kind === 'single' || q.kind === 'multi') return !!(r.picked && r.picked.length);
  if (q.kind === 'blank') return (r.texts || []).some(function(t){ return String(t || '').trim(); });
  return !!String(r.essayText || '').trim();
}
function examAnswered(){
  var n = 0;
  S.session.ids.forEach(function(id){
    if (hasAnswer(BY_ID[id], S.session.recs[id])) n++;
  });
  return n;
}

/* ---- 弹层 ---- */
function overlay(html){
  var el = document.getElementById('overlay');
  if (!el){
    el = document.createElement('div');
    el.id = 'overlay';
    el.className = 'overlay';
    el.setAttribute('data-act', 'ovlbg');
    document.body.appendChild(el);
  }
  el.innerHTML = '<div class="sheet">' + html + '</div>';
  el.classList.add('on');
}
function closeOverlay(){
  var el = document.getElementById('overlay');
  if (el) el.classList.remove('on');
}
function openCard(){
  var ses = S.session, groups = [], seen = {};
  ses.ids.forEach(function(id, i){
    var sec = (ses.meta[id] && ses.meta[id].section) || '题目';
    if (!seen[sec]){ seen[sec] = { label: sec, idx: [] }; groups.push(seen[sec]); }
    seen[sec].idx.push(i);
  });
  overlay('<h3>答题卡</h3><p>已答 ' + examAnswered() + ' / ' + ses.ids.length + ' 题，蓝底为已作答，点题号可跳转。</p>' +
    groups.map(function(g){
      return '<div class="cardsec"><b>' + g.label + '</b><div class="cardgrid">' +
        g.idx.map(function(i){
          var q = BY_ID[ses.ids[i]];
          var done = hasAnswer(q, ses.recs[q.id]);
          return '<button class="cardno' + (i === ses.idx ? ' cur' : '') + (done ? ' done' : '') +
            '" data-act="jumpq" data-i="' + i + '">' + (i + 1) + '</button>';
        }).join('') + '</div></div>';
    }).join('') +
    '<div class="sheetfoot"><button class="btn ghost" data-act="closeoverlay">继续作答</button>' +
    '<button class="btn primary" data-act="askext">交卷</button></div>');
}
function askSubmitExam(){
  var ses = S.session;
  if (!ses || ses.mode !== 'exam') return;
  var left = ses.ids.length - examAnswered();
  overlay('<h3>确认交卷？</h3><p>' +
    (left > 0 ? '还有 <b>' + left + '</b> 题没作答，交卷后这些题记 0 分。' : '全部题目已作答。') +
    '交卷后不能修改答案。</p><div class="sheetfoot">' +
    '<button class="btn ghost" data-act="closeoverlay">继续作答</button>' +
    '<button class="btn primary" data-act="submitExam">确认交卷</button></div>');
}

/* ---- 交卷判分 ---- */
function gradeExamItem(q, r, full){
  var got = 0, status = 'blank', detail = '';
  if (q.kind === 'single' || q.kind === 'multi'){
    var picked = (r && r.picked) ? r.picked.slice().sort().join('') : '';
    if (!picked) status = 'blank';
    else if (picked === q.answer.split('').sort().join('')){ got = full; status = 'full'; }
    else status = 'wrong';
  } else if (q.kind === 'blank'){
    var texts = (r && r.texts) || [];
    var hits = q.answers.map(function(a, i){ return matchBlank(texts[i] || '', a); });
    var exact = hits.filter(function(h){ return h === 'exact'; }).length;
    if (!texts.some(function(t){ return String(t || '').trim(); })) status = 'blank';
    else if (exact === q.answers.length) status = 'full';
    else if (exact > 0) status = 'partial';
    else status = 'wrong';
    got = full * exact / q.answers.length;
    if (exact) detail = exact + '/' + q.answers.length + ' 空';
  } else {
    var txt = (r && r.essayText) || '';
    if (!String(txt).trim()){ status = 'blank'; got = 0; }
    else {
      var g = gradeEssay(q.a, txt);
      got = q.a ? full * g.ratio : 0;
      status = g.ratio >= 0.6 ? 'full' : g.ratio >= 0.3 ? 'partial' : 'wrong';
      if (g.total) detail = g.hit + '/' + g.total + ' 要点';
    }
  }
  return { got: Math.round(got * 2) / 2, full: full, status: status, detail: detail };
}
function finishExam(auto){
  var ses = S.session;
  if (!ses || ses.mode !== 'exam' || ses.ended) return;
  ses.ended = true;
  ses.finishedAt = Date.now();
  var rows = [], total = 0;
  ses.ids.forEach(function(id, i){
    var q = BY_ID[id], r = ses.recs[id] || {}, m = ses.meta[id] || { score: 0 };
    var g = gradeExamItem(q, r, m.score || 0);
    total += g.got;
    rows.push({ id: id, idx: i, section: m.section || '', got: g.got, full: g.full,
                status: g.status, detail: g.detail, my: myAnswerText(q, r) });
    if (g.status !== 'full') recordResult(q, false);
    else {
      var wm = wrongMap();
      if (wm[q.id]){ delete wm[q.id]; saveWrong(wm); }
    }
  });
  ses.examResult = {
    rows: rows, total: Math.round(total * 10) / 10,
    full: ses.exam.full, pass: ses.exam.pass,
    auto: !!auto, secs: Math.round((ses.finishedAt - ses.startedAt) / 1000)
  };
  clearInterval(S.timer); S.timer = null;
  LS.set('szq.exam', ses.examResult);
  LS.del(K.sess);
  closeOverlay();
  show('examresult');
}

/* ---- 成绩单 ---- */
function renderExamResult(){
  var R = (S.session && S.session.examResult) || LS.get('szq.exam', null);
  if (!R || !R.rows || !R.rows.length){ show('exam'); return; }
  var passed = R.total >= R.pass;
  var order = [], bySec = {};
  R.rows.forEach(function(r){
    if (!bySec[r.section]){ bySec[r.section] = { got: 0, full: 0, n: 0, right: 0 }; order.push(r.section); }
    var d = bySec[r.section];
    d.got += r.got; d.full += r.full; d.n++;
    if (r.status === 'full') d.right++;
  });
  var secRows = order.map(function(k){
    var d = bySec[k], p = d.full ? Math.round(d.got / d.full * 100) : 0;
    return '<div class="exrow"><span>' + k + '</span>' +
      '<span class="dim num" style="text-align:right">全对 ' + d.right + '/' + d.n + '</span>' +
      '<span class="sc">' + fs(d.got) + ' / ' + d.full + '</span></div>';
  }).join('');
  var wrongRows = R.rows.filter(function(r){ return r.status !== 'full'; });

  main.innerHTML =
  '<div class="card pad">' +
    '<div class="result-top">' +
      '<div class="ring">' +
        '<svg width="132" height="132" viewBox="0 0 132 132">' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="var(--line)" stroke-width="11"/>' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="' + (passed ? 'var(--ok)' : 'var(--bad)') +
            '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' +
            (2 * Math.PI * 57 * R.total / R.full).toFixed(1) + ' ' + (2 * Math.PI * 57).toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="mid"><b>' + fs(R.total) + '</b><small>/ ' + R.full + ' 分</small></div>' +
      '</div>' +
      '<div style="flex:1;min-width:220px">' +
        '<div class="bigscore"><b>' + fs(R.total) + '</b><span>分</span></div>' +
        '<p style="margin:8px 0 0">' +
          '<span class="pass ' + (passed ? 'ok' : 'no') + '">' + (passed ? '✓ 及格' : '✗ 未及格') +
          '（及格线 ' + R.pass + '）</span>' +
          (R.auto ? '<span class="dim">　时间到，已自动交卷</span>' : '') +
        '</p>' +
        '<p class="muted" style="margin:8px 0 0">用时 ' + fmtSec(R.secs) + ' · 满分 ' + R.full + ' 分 · 得分率 ' +
          Math.round(R.total / R.full * 100) + '%</p>' +
        '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
          '<button class="btn primary" data-act="startexam">再考一场</button>' +
          (wrongRows.length ? '<button class="btn" data-act="drillexam">只练丢分的题（' + wrongRows.length + '）</button>' : '') +
          '<button class="btn ghost" data-act="home">返回首页</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="rows" style="margin-top:20px">' + secRows + '</div>' +
  '</div>' +
  '<div class="sec"><div class="sec-h">逐题批改（丢分 ' + wrongRows.length + ' 题）</div>' +
    R.rows.map(function(r){
      var q = BY_ID[r.id];
      var color = r.status === 'full' ? 'var(--ok)' : r.status === 'partial' ? 'var(--warn)' : 'var(--bad)';
      return qitemHTML(q, {
        my: r.my,
        st: fs(r.got) + '/' + r.full,
        stColor: color,
        note: (r.status === 'blank' ? '未作答' : '') + (r.detail ? (r.status === 'blank' ? '' : '　' + r.detail) : '')
      });
    }).join('') +
  '</div>';
  window.scrollTo(0, 0);
}

/* ==================== 事件 ==================== */
document.addEventListener('click', function(e){
  /* 过滤按钮（题库 / 错题本）优先处理 */
  var fb = e.target.closest('.filters button');
  if (fb){
    var scope = fb.closest('.filters');
    scope.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === fb); });
    var kb = fb.getAttribute('data-k');
    if (scope.getAttribute('data-act') === 'bfilter'){
      S.browse.kind = kb; paintBrowseList();
    } else {
      var mm = wrongMap();
      var allW = Object.keys(mm).map(function(id){ return BY_ID[id]; }).filter(Boolean);
      var arrW = kb ? allW.filter(function(q){ return q.kind === kb; }) : allW;
      var wl = document.getElementById('wrongList');
      if (wl){
        wl.innerHTML = arrW.map(function(q){
          return qitemHTML(q, { my: '', st: '错' + (mm[q.id].n || 1) + '次', stColor: 'var(--bad)' });
        }).join('') || '<div class="empty"><p>该题型暂无错题</p></div>';
      }
    }
    return;
  }

  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'start'){
    var ids = drawSet(S.cfg);
    if (!ids.length){ toast('请至少选择一种题型'); return; }
    newSession(ids);
    return;
  }
  if (act === 'kind'){
    var k = t.getAttribute('data-k'), i = S.cfg.kinds.indexOf(k);
    if (i >= 0){ if (S.cfg.kinds.length === 1){ toast('至少保留一种题型'); return; } S.cfg.kinds.splice(i, 1); }
    else S.cfg.kinds.push(k);
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'count'){
    S.cfg.count = parseInt(t.getAttribute('data-c'), 10) || 0;
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'order'){
    S.cfg.order = t.getAttribute('data-o');
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'jump'){
    S.browse.kind = t.getAttribute('data-k');
    S.browse.kw = '';
    show('browse');
    return;
  }
  if (act === 'resume'){
    var s = LS.get(K.sess, null);
    if (s && s.ids){
      S.session = s;
      if (typeof s.startedAt !== 'number') s.startedAt = Date.now();
      show('quiz');
    } else { toast('没有可继续的练习'); renderHome(); }
    return;
  }
  if (act === 'pick'){ pick(t.getAttribute('data-k')); return; }
  if (act === 'submit'){ submit(); return; }
  if (act === 'judge'){ judge(t.getAttribute('data-v')); return; }
  if (act === 'next'){ next(); return; }
  if (act === 'prev'){ prev(); return; }
  if (act === 'quit'){
    if (!S.session) { show('home'); return; }
    saveSession();
    S.session = null;
    show('home');
    toast('已退出，进度已保存，可随时继续');
    return;
  }
  if (act === 'reveal'){
    var qr = curQ(), recr = recOf(qr);
    if (recr.graded) return;
    recr.revealed = true;
    if (qr.kind === 'essay' || qr.kind === 'blank'){ submit(); return; }
    if (!recr.picked.length){
      recr.graded = true; recr.correct = false; recr.blankHits = null;
      recordResult(qr, false);
      saveSession(); render();
      return;
    }
    submit();
    return;
  }
  if (act === 'again'){
    var nids = drawSet(S.cfg);
    newSession(nids);
    return;
  }
  if (act === 'drill'){
    var wrongIds = S.session.ids.filter(function(id){
      var q = BY_ID[id], r = S.session.recs[id] || {};
      return !(isDone(r, q) && r.correct);
    });
    if (!wrongIds.length){ toast('没有错题'); return; }
    newSession(shuffle(wrongIds.slice()), { title: '只练错题', kinds: S.cfg.kinds.slice() });
    return;
  }
  if (act === 'drillWrong'){
    var m = wrongMap(), idl = Object.keys(m).filter(function(id){ return BY_ID[id]; });
    if (!idl.length){ toast('错题本是空的'); return; }
    newSession(shuffle(idl.slice()), { title: '错题重练' });
    return;
  }
  if (act === 'clearWrong'){
    if (!confirm('确定清空错题本？此操作不可撤销。')) return;
    saveWrong({});
    renderWrong();
    toast('错题本已清空');
    return;
  }
  if (act === 'home'){ show('home'); return; }
  if (act === 'goexam'){ show('exam'); return; }
  if (act === 'startexam'){ startExam(); return; }
  if (act === 'askext'){ askSubmitExam(); return; }
  if (act === 'submitExam'){ finishExam(false); return; }
  if (act === 'card'){ openCard(); return; }
  if (act === 'closeoverlay'){ closeOverlay(); return; }
  if (act === 'ovlbg'){ if (e.target === t) closeOverlay(); return; }
  if (act === 'jumpq'){
    var ji = parseInt(t.getAttribute('data-i'), 10);
    if (S.session && ji >= 0 && ji < S.session.ids.length){
      S.session.idx = ji; saveSession(); closeOverlay(); render();
    }
    return;
  }
  if (act === 'resumeexam'){
    var es = LS.get(K.sess, null);
    if (es && es.mode === 'exam' && es.ids && !es.ended){
      S.session = es;
      if (remainOf(es) <= 0){ finishExam(true); return; }
      show('quiz');
    } else { toast('没有未完成的考试'); show('exam'); }
    return;
  }
  if (act === 'drillexam'){
    var erR = (S.session && S.session.examResult) || LS.get('szq.exam', null);
    var er = (erR && erR.rows) ? erR.rows : [];
    var loseIds = er.filter(function(x){ return x.status !== 'full'; }).map(function(x){ return x.id; });
    if (!loseIds.length){ toast('这场没有丢分的题'); return; }
    newSession(shuffle(loseIds.slice()), { title: '练丢分题' });
    return;
  }
  if (act === 'lastexam'){ show('examresult'); return; }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-act') === 'blank'){
    var q = curQ(), rec = recOf(q), i = parseInt(t.getAttribute('data-i'), 10);
    rec.texts[i] = t.value;
    saveSession();
  }
  if (t.getAttribute && t.getAttribute('data-act') === 'essay'){
    var q2 = curQ(), rec2 = recOf(q2);
    rec2.essayText = t.value;
    saveSession();
  }
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (S.view !== 'quiz' || !S.session) return;
  var q = curQ(), rec = recOf(q);
  var key = e.key;
  if (/^[1-4]$/.test(key) || /^[a-dA-D]$/.test(key)){
    if (rec.graded) return;
    var idx = /^[1-4]$/.test(key) ? parseInt(key, 10) - 1 : key.toUpperCase().charCodeAt(0) - 65;
    if (q.kind === 'single' || q.kind === 'multi'){
      var o = q.options[idx];
      if (o){ e.preventDefault(); pick(o.k); }
    }
    return;
  }
  if (key === 'Enter'){
    e.preventDefault();
    if (S.session.mode === 'exam'){ next(); return; }
    if (!rec.graded) submit();
    else if (q.kind === 'essay' && rec.graded && !rec.judge) return;
    else next();
    return;
  }
  if (key === 'ArrowLeft'){ e.preventDefault(); prev(); return; }
  if (key === 'ArrowRight'){ e.preventDefault(); next(); return; }
});

document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-nav]');
  if (!b) return;
  var v = b.getAttribute('data-nav');
  var ses = S.session;
  if (v === 'exam'){
    if (ses && ses.mode === 'exam' && !ses.ended){ show('quiz'); return; }
    show('exam');
    return;
  }
  if (v === 'home'){
    if (ses && !ses.ended && ses.mode !== 'exam'){ show('quiz'); return; }
    show('home');
    return;
  }
  show(v);
});

/* ==================== 启动 ==================== */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var ov = document.getElementById('overlay');
  if (ov && ov.classList.contains('on')){ closeOverlay(); return; }
  if (S.view !== 'quiz') return;
  if (S.session && S.session.mode === 'exam'){ toast('考试中，请用「交卷」结束'); return; }
  saveSession(); show('home');
});
document.getElementById('brandSub').textContent = '2024.4 题库 · ' + TOTAL + ' 题';
paintBadge();
show('home');
})();

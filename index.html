 进口产品应符合合同规定的质量要求，并附有"},{"t":"blank","v":"中文说明书"},{"t":"text","v":"和"},{"t":"blank","v":"商检证明"},{"t":"text","v":"，经进场验收合格后方可使用。"}],"answers":["中文说明书","商检证明"],"score":2,"src":"2026 年上半年度填空题第5题"},{"id":"p2026h1-16","no":6,"kind":"blank","segs":[{"t":"text","v":"《浙江省建筑施工安全管理规范》规定基坑专业监测单位应由"},{"t":"blank","v":"建设单位"},{"t":"text","v":"委托具备相应资质的第三方对基坑工程实施现场监测；基坑工程实施前监测单位应编制"},{"t":"blank","v":"监测方案"},{"t":"text","v":"。"}],"answers":["建设单位","监测方案"],"score":2,"src":"2026 年上半年度填空题第6题"},{"id":"p2026h1-17","no":7,"kind":"blank","segs":[{"t":"text","v":"《建筑工程冬期施工规程》JGJ/T 104-2011 规定：当室外日平均气温连续"},{"t":"blank","v":"5d"},{"t":"text","v":"稳定低于"},{"t":"blank","v":"5℃"},{"t":"text","v":"即进入冬期施工，当室外日平均气温连续 5d 高于 5℃ 即解除冬期施工。"}],"answers":["5d","5℃"],"score":2,"src":"2026 年上半年度填空题第7题"},{"id":"p2026h1-18","no":8,"kind":"blank","segs":[{"t":"text","v":"隧道、人防工程、高温、有导电灰尘、比较潮湿或灯具离地面高度低于 2.5m 等场所的照明，电源电压不应大于"},{"t":"blank","v":"36"},{"t":"text","v":"V。"}],"answers":["36"],"score":1,"src":"2026 年上半年度填空题第8题"},{"id":"p2026h1-19","no":9,"kind":"blank","segs":[{"t":"text","v":"10kV 外电线路与在建工程（含脚手架）的最小安全操作距离应为"},{"t":"blank","v":"8m"},{"t":"text","v":"，与塔式起重机的吊具或被吊物体端部的最小安全距离垂直方向应为"},{"t":"blank","v":"3.0m"},{"t":"text","v":"，水平方向应为"},{"t":"blank","v":"2.0m"},{"t":"text","v":"，与外电防护设施的最小安全距离为"},{"t":"blank","v":"2.0m"},{"t":"text","v":"。"}],"answers":["8m","3.0m","2.0m","2.0m"],"score":4,"src":"2026 年上半年度填空题第9题"},{"id":"p2026h1-20","no":10,"kind":"blank","segs":[{"t":"text","v":"专项施工方案实施前，编制人员或项目技术负责人应当向施工现场管理人员进行"},{"t":"blank","v":"方案交底"},{"t":"text","v":"；施工现场管理人员应当向作业人员进行有针对性的"},{"t":"blank","v":"安全技术交底"},{"t":"text","v":"。"}],"answers":["方案交底","安全技术交底"],"score":2,"src":"2026 年上半年度填空题第10题"},{"id":"p2026h1-21","no":11,"kind":"blank","segs":[{"t":"text","v":"超过一定规模的危大工程实施前，应由"},{"t":"blank","v":"施工单位"},{"t":"text","v":"组织"},{"t":"blank","v":"施工条件验收"},{"t":"text","v":"。"}],"answers":["施工单位","施工条件验收"],"score":2,"src":"2026 年上半年度填空题第11题"},{"id":"p2026h1-22","no":12,"kind":"blank","segs":[{"t":"text","v":"浙建〔2025〕15 号文规定，对于超过一定规模的危大工程，建设单位应在招标文件中以"},{"t":"blank","v":"暂列金额"},{"t":"text","v":"的形式列出相应技术措施费用。"}],"answers":["暂列金额"],"score":1,"src":"2026 年上半年度填空题第12题"},{"id":"p2026h1-23","no":13,"kind":"blank","segs":[{"t":"text","v":"项目专职安全生产管理人员在岗履职期间，应当佩戴"},{"t":"blank","v":"安全生产检查记录仪"},{"t":"text","v":"，全过程视频记录在岗履职情况，原始视频资料至少留档保存"},{"t":"blank","v":"6"},{"t":"text","v":"个月。"}],"answers":["安全生产检查记录仪","6"],"score":2,"src":"2026 年上半年度填空题第13题"},{"id":"p2026h1-24","no":14,"kind":"blank","segs":[{"t":"text","v":"项目专职安全生产管理人员应当将"},{"t":"blank","v":"每日"},{"t":"text","v":"安全检查和事故隐患处理情况及时填入"},{"t":"blank","v":"施工安全日志"},{"t":"text","v":"。"}],"answers":["每日","施工安全日志"],"score":2,"src":"2026 年上半年度填空题第14题"},{"id":"p2026h1-25","no":15,"kind":"blank","segs":[{"t":"text","v":"专职安全生产管理人员分为 C1"},{"t":"blank","v":"机械类"},{"t":"text","v":"、C2"},{"t":"blank","v":"土建类"},{"t":"text","v":"、C3"},{"t":"blank","v":"综合类"},{"t":"text","v":"。"}],"answers":["机械类","土建类","综合类"],"score":3,"src":"2026 年上半年度填空题第15题"}]},{"kind":"essay","label":"三、问答题","weights":[5,6,8,8,10],"items":[{"id":"p2026h1-26","no":1,"kind":"essay","q":"盲道应符合哪些规定？","a":"1 盲道按其使用功能可分为行进盲道和提示盲道；\n2 盲道的纹路应凸出路面 4mm 高；\n3 盲道铺设应连续，应避开树木（穴）、电线杆、拉线等障碍物，其他设施不得占用盲道；\n4 盲道的颜色宜与相邻的人行道铺面的颜色形成对比，并与周围景观相协调，宜采用中黄色；\n5 盲道型材表面应防滑。","score":5,"src":"2026 年上半年度问答题第1题"},{"id":"p2026h1-27","no":2,"kind":"essay","q":"箱涵顶进应具备哪些条件？","a":"1 主体结构混凝土必须达到设计强度，防水层及防护层应符合设计要求；\n2 顶进后的后背墙土体强度和稳定性应满足设计要求；\n3 顶进设备经安装调试并试运转合格；\n4 线路加固及基坑、后背等施工工序经检查验收合格；\n5 顶进作业所需的材料、机具、人员及监控量测措施已落实到位。","score":6,"src":"2026 年上半年度问答题第2题"},{"id":"p2026h1-28","no":4,"kind":"essay","q":"依据《城市桥梁工程施工与质量验收规范》CJJ2-2008 规定，模板、支架和拱架的设计中应设施工预拱度。施工预拱度应考虑哪些因素？","a":"1 设计文件规定的结构预拱度；\n2 支架和拱架承受全部施工荷载引起的弹性变形；\n3 受载后由于杆件接头处的挤压和卸落设备压缩而产生的非弹性变形；\n4 支架、拱架基础受载后的沉降。","score":8,"src":"2026 年上半年度问答题第4题"},{"id":"p2026h1-29","no":5,"kind":"essay","q":"建质规（2025）3 号文规定施工总承包企业应当为项目配备专职安全生产管理人员，市政基础设施工程按合同价配备，人员数量应满足哪些要求？","a":"1 5000 万元以下的项目不少于 1 人；\n2 5000 万～2 亿元的项目不少于 2 人；\n3 2 亿元以上的项目不少于 3 人，每增加 2 亿元，应当至少增加 1 人；\n4 施工活动涉及建筑起重机械的，应当至少增加 1 名机械类专职安全生产管理人员。","score":8,"src":"2026 年上半年度问答题第5题"},{"id":"p2026h1-30","no":6,"kind":"essay","q":"浙建（2025）15 号文规定危大工程专项施工方案的主要内容有哪些？","a":"1 工程概况：危大工程概况和特点、施工环境条件（气候、水文、地质条件，地下管线，周边环境等）、施工平面布置、施工要求和技术保证条件、风险辨识与分级等；\n2 编制依据：相关法律、法规、标准、规范性文件及施工图设计文件、施工组织设计等；\n3 施工计划：施工进度计划、材料与设备计划等；\n4 施工工艺技术：技术参数、工艺流程、施工方法、操作要求、检查要求等；\n5 施工安全保证措施：组织和技术保障措施、监测监控措施等；\n6 施工管理及作业人员配备和分工；\n7 验收要求：验收标准、验收程序、验收内容、验收人员等；\n8 应急处置措施；\n9 计算书及相关施工图纸等（采用软件计算的，保留完整计算过程）。","score":10,"src":"2026 年上半年度问答题第6题"}]}],"total":91,"count":30}],"standards":[{"id":"gb55032","code":"GB 55032-2022","name":"建筑与市政工程施工质量控制通用规范","note":"住建部强制性工程建设规范，2023-03-01 实施。下列为正文章节条文（不含附录表格与条文说明）。","sections":[{"no":"1","title":"总则","clauses":[{"no":"1.0.1","text":"为规范建筑与市政工程施工质量控制活动，保证人民群众生命财产安全和人身健康，提高施工质量控制水平，制定本规范。"},{"no":"1.0.2","text":"建筑与市政工程施工质量控制必须执行本规范。"},{"no":"1.0.3","text":"工程建设所采用的技术方法和措施是否符合本规范要求，由相关责任主体判定。其中，创新性的技术方法和措施，应进行论证并符合本规范中有关性能的要求。"}]},{"no":"2","title":"基本规定","clauses":[{"no":"2.0.1","text":"工程项目施工应建立项目质量管理体系，明确质量责任人及岗位职责，建立质量责任追溯制度。"},{"no":"2.0.2","text":"施工过程中应建立质量管理标准化制度，制定质量管理标准化文件，文件中应明确人员管理、技术管理、材料管理、分包管理、施工管理、资料管理和验收管理等要求。"},{"no":"2.0.3","text":"工程项目各方的工程建设合同，应明确具体质量标准、各方质量控制的权利与责任。"},{"no":"2.0.4","text":"勘察、设计文件应符合工程特点和合同要求，应说明工程地质、水文和环境条件可能造成的工程质量风险，设计深度应符合施工要求，并应经过质量管理程序审批。"},{"no":"2.0.5","text":"工程项目各方不得擅自修改工程设计，确需修改的应报建设单位同意，由设计单位出具设计变更文件，并应按原审批程序办理变更手续。"},{"no":"2.0.6","text":"施工进度计划应经建设单位、监理单位审批后执行。施工中不得任意压缩工期，进度计划的重大调整应按原审批程序办理变更手续，并应制定相应的质量控制措施。"},{"no":"2.0.7","text":"工程质量控制资料应准确齐全、真实有效，且具有可追溯性。当部分资料缺失时，应委托有资质的检验检测机构进行相应的实体检验或抽样试验，并应出具检测报告，作为工程质量验收资料的一部分。"},{"no":"2.0.8","text":"实行监理的工程项目，施工前应编制监理规划和监理实施细则，并应按规定程序审批，当需变更时应按原审批程序办理变更手续。"},{"no":"2.0.9","text":"未实行监理的工程项目，建设单位应成立专门机构或委托具备相应质量管理能力的单位独立履行监理职责。"},{"no":"2.0.10","text":"施工现场应根据项目特点和合同约定，制定技能工人配备方案，其中中级工及以上占比应符合项目所在地区施工现场建筑工人配备标准。施工现场技能工人配备方案应报监理单位审查后实施。"},{"no":"2.0.11","text":"施工管理人员和现场作业人员应进行全员质量培训，并应考核合格。质量培训应保留培训记录。应对人员教育培训情况实行动态管理。"}]},{"no":"3.1","title":"一般规定","clauses":[{"no":"3.1","text":"一般规定 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"3.1","text":"一般规定"},{"no":"3.1.1","text":"工程项目中使用的施工图纸及其他有关设计文件应合格有效。施工前应进行勘察说明、设计交底、图纸会审，并应保留记录。"},{"no":"3.1.2","text":"工程项目开工前应进行质量策划，应确定质量目标和要求、质量管理组织体系及管理职责、质量管理与协调的程序、质量控制点、质量风险、实施质量目标的控制措施，并应根据工程进展实施动态管理。"},{"no":"3.1.3","text":"工程质量策划中应在下列部位和环节设置质量控制点：\n1 影响施工质量的关键部位、关键环节；\n2 影响结构安全和使用功能的关键部位、关键环节；\n3 采用新技术、新工艺、新材料、新设备的部位和环节；\n4 隐蔽工程验收。"},{"no":"3.1.4","text":"施工组织设计和施工方案应根据工程特点、现场条件、质量风险和技术要求编制，并应按规定程序审批后执行，当需变更时应按原审批程序办理变更手续。"},{"no":"3.1.5","text":"施工前应对施工管理人员和作业人员进行技术交底，交底的内容应包括施工作业条件、施工方法、技术措施、质量标准以及安全与环保措施等，并应保留相关记录。"},{"no":"3.1.6","text":"分项工程施工，应实施样板示范制度，以多种形式直观展示关键部位、关键工序的做法与要求。"},{"no":"3.1.7","text":"施工使用的测量与计量设备、仪器应经计量检定、校准合格，并在有效期内。监理单位应定期检查设备、仪器的检定和校准报告。"}]},{"no":"3.2","title":"材料、构配件及设备质量控制","clauses":[{"no":"3.2","text":"材料、构配件及设备质量控制 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"3.2","text":"材料、构配件及设备质量控制"},{"no":"3.2.1","text":"工程采用的主要材料、半成品、成品、构配件、器具和设备应进行进场检验。涉及安全、节能、环境保护和主要使用功能的重要材料、产品应按各专业相关规定进行复验，并应经监理工程师检查认可。"},{"no":"3.2.2","text":"对涉及结构安全、节能、环境保护和主要使用功能的试块、试件及材料，应按规定进行见证检验。见证检验应在建设单位或者监理单位的监督下现场取样、送检，检测试样应具有真实性和代表性。"},{"no":"3.2.3","text":"进口产品应符合合同规定的质量要求，并附有中文说明书和商检证明，经进场验收合格后方可使用。"},{"no":"3.2.4","text":"施工现场的材料、半成品、成品、构配件、器具和设备，在运输和储存时应采取确保其质量和性能不受影响的储存及防护措施。"}]},{"no":"3.3","title":"工艺质量控制","clauses":[{"no":"3.3","text":"工艺质量控制 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"3.3","text":"工艺质量控制"},{"no":"3.3.1","text":"施工单位应对施工平面控制网和高程控制点进行复测，其复测成果应经监理单位查验合格，并应对控制网进行定期校核。重要线位、控制点和定位点测设完成后应经复测无误后方可使用。"},{"no":"3.3.2","text":"施工单位应保留工程测量原始观测数据的现场记录及测量成果交付记录，并应对测量结果进行校核。"},{"no":"3.3.3","text":"监理人员应对工程施工质量进行巡视、平行检验，对关键部位、关键工序进行旁站，并应及时记录检查情况。"},{"no":"3.3.4","text":"施工工序间的衔接，应符合下列规定：\n1 每道施工工序完成后，施工单位应进行自检，并应保留检查记录；\n2 各专业工种之间的相关工序应进行交接检验，并应保留检查记录；\n3 对监理规划或监理实施细则中提出检查要求的重要工序，应经专业监理工程师检查合格并签字确认后，进行下道工序施工；\n4 隐蔽工程在隐蔽前应由施工单位通知监理单位进行验收，并应留存现场影像资料，形成验收文件，经验收合格后方可继续施工。"},{"no":"3.3.5","text":"基坑、基槽、沟槽开挖后，建设单位应会同勘察、设计、施工和监理单位实地验槽，并应会签验槽记录。"},{"no":"3.3.6","text":"主体结构为装配式混凝土结构体系时，套筒灌浆连接应采用由接头型式检验确定的相匹配的灌浆套筒、灌浆料，灌浆应密实饱满。"},{"no":"3.3.7","text":"装饰装修工程施工应符合下列规定：\n1 当既有建筑装饰装修工程设计涉及主体结构和承重结构变动时，应在施工前委托原结构设计单位或具有相应资质等级的设计单位提出设计方案，或由鉴定单位对建筑结构的安全性进行鉴定，依据鉴定结果确定设计方案；\n2 建筑外墙外保温系统与外墙的连接应牢固，保温系统各层之间的连接应牢固；\n3 建筑外门窗应安装牢固，推拉门窗扇应配备防脱落装置；\n4 临空处设置的用于防护的栏杆以及无障碍设施的安全抓杆应与主体结构连接牢固；\n5 重量较大的灯具，以及电风扇、投影仪、音响等有振动荷载的设备仪器，不应安装在吊顶工程的龙骨上。"},{"no":"3.3.8","text":"屋面工程施工应符合下列规定：\n1 每道工序完成后应及时采取保护措施；\n2 伸出屋面的管道、设备或预埋件等，应在保温层和防水层施工前安设完毕；\n3 屋面保温层和防水层完工后，不得进行凿孔、打洞或重物冲击等有损屋面的作业；\n4 屋面瓦材必须铺置牢固，在大风及地震设防地区或屋面坡度大于100%时，应采取固定加强措施。"},{"no":"3.3.9","text":"设备、管道及其支吊架等的安装位置、尺寸以及与主体结构的连接方法和质量应满足设计及使用功能要求。"},{"no":"3.3.10","text":"地下管道防腐层应完整连续，新建管道阴极保护设计、施工应与管道设计、施工同时进行，阴极保护应经检测合格，并同时投入使用。"},{"no":"3.3.11","text":"管道清扫冲洗、强度试验及严密性试验和室内消火栓系统试射试验前，施工单位应编制试验方案，应按设计要求确定试验方法、试验压力和合格标准，应制定质量和安全保证措施。"},{"no":"3.3.12","text":"隧道工程施工应对线路中线、高程进行检核，隧道的衬砌结构不得侵入建筑限界。"},{"no":"3.3.13","text":"工程中包含的机械、电气和自动化系统与设备应按设计要求进行试运行，并能正常使用。"}]},{"no":"3.4","title":"施工检测质量控制","clauses":[{"no":"3.4","text":"施工检测质量控制 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"3.4","text":"施工检测质量控制"},{"no":"3.4.1","text":"建设单位应委托具备相应资质的第三方检测机构进行工程质量检测，检测项目和数量应符合抽样检验要求。非建设单位委托的检测机构出具的检测报告不得作为工程质量验收依据。"},{"no":"3.4.2","text":"工程施工前应制定工程试验及检测方案，并应经监理单位审核通过后实施。"},{"no":"3.4.3","text":"施工过程质量检测试样，除确定工艺参数可制作模拟试样外，均应从现场相应的施工部位制取。"},{"no":"3.4.4","text":"检测机构应独立出具检验检测数据和结果。检测机构应对检测数据和检测报告的真实性和准确性负责。对检测结果不合格的报告严禁抽撤、替换或修改。"},{"no":"3.4.5","text":"检测机构严禁出具虚假检测报告。"}]},{"no":"4.1","title":"一般规定","clauses":[{"no":"4.1","text":"一般规定 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"4.1","text":"一般规定"},{"no":"4.1.1","text":"施工质量验收应包括单位工程、分部工程、分项工程和检验批施工质量验收，并应符合下列规定：\n1 检验批应根据施工组织、质量控制和专业验收需要，按工程量、楼层、施工段划分，检验批抽样数量应符合有关专业验收标准的规定。\n2 分项工程应根据工种、材料、施工工艺、设备类别划分，建筑工程分项工程划分应符合本规范附录A、附录B的规定，市政工程分项工程划分应符合本规范附录C的规定。\n3 分部工程应根据专业性质、工程部位划分，建筑工程分部工程划分应符合本规范附录A、附录B的规定，市政工程分部工程划分应符合本规范附录C的规定。\n4 单位工程应为具备独立使用功能的建筑物或构筑物；对市政道路、桥梁、管道、轨道交通、综合管廊等，应根据合同段，并结合使用功能划分单位工程。"},{"no":"4.1.2","text":"施工前，应由施工单位制定单位工程、分部工程、分项工程和检验批的划分方案，并应由监理单位审核通过后实施。施工现场情况与附录不同时，应按实际情况进行分部工程、分项工程和检验批划分，由建设单位组织监理单位、施工单位共同确定。"},{"no":"4.1.3","text":"应建立工程质量信息公示制度。工程竣工验收合格后，建设单位应在建（构）筑物的明显位置设置有关工程质量责任主体的永久性标牌。"},{"no":"4.1.4","text":"工程资料文件的形成和积累应纳入工程建设管理的各个环节和有关人员的职责范围，全面反映工程建设活动和工程实际情况。工程资料文件应随工程建设进度同步形成。"},{"no":"4.1.5","text":"工程资料归档应符合下列规定：\n1 勘察、设计、施工、监理等单位应将本单位形成的工程文件立卷后向建设单位移交；\n2 工程竣工验收备案前，建设单位应根据工程类别和当地城建档案管理机构的要求，将全部工程文件收集齐全、整理立卷，向城建档案管理机构移交。"}]},{"no":"4.2","title":"验收要求","clauses":[{"no":"4.2","text":"验收要求 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"4.2","text":"验收要求"},{"no":"4.2.1","text":"工程施工质量应符合国家现行强制性工程建设规范的规定，并应符合工程勘察设计文件的要求和合同约定。"},{"no":"4.2.2","text":"检验批质量应按主控项目和一般项目验收，并应符合下列规定：\n1 主控项目和一般项目的确定应符合国家现行强制性工程建设规范和现行相关标准的规定；\n2 主控项目的质量经抽样检验应全部合格；\n3 一般项目的质量应符合国家现行相关标准的规定；\n4 应具有完整的施工操作依据和质量验收记录。"},{"no":"4.2.3","text":"当检验批施工质量不符合验收标准时，应按下列规定进行处理：\n1 经返工或返修的检验批，应重新进行验收；\n2 经有资质的检测机构检测能够达到设计要求的检验批，应予以验收；\n3 经有资质的检测机构检测达不到设计要求，但经原设计单位核算认可能够满足安全和使用功能的检验批，应予以验收。"},{"no":"4.2.4","text":"分项工程质量验收合格应符合下列规定：\n1 所含检验批的质量应验收合格；\n2 所含检验批的质量验收记录应完整、真实。"},{"no":"4.2.5","text":"分部工程质量验收合格应符合下列规定：\n1 所含分项工程的质量应验收合格；\n2 质量控制资料应完整、真实；\n3 有关安全、节能、环境保护和主要使用功能的抽样检验结果应符合要求；\n4 观感质量应符合要求。"},{"no":"4.2.6","text":"单位工程质量验收合格应符合下列规定：\n1 所含分部工程的质量应全部验收合格；\n2 质量控制资料应完整、真实；\n3 所含分部工程中有关安全、节能、环境保护和主要使用功能的检验资料应完整；\n4 主要使用功能的抽查结果应符合国家现行强制性工程建设规范的规定；\n5 观感质量应符合要求。"},{"no":"4.2.7","text":"当经返修或加固处理的分项工程、分部工程，确认能够满足安全及使用功能要求时，应按技术处理方案和协商文件的要求予以验收。"},{"no":"4.2.8","text":"经返修或加固处理仍不能满足安全或重要使用功能要求的分部工程及单位工程，严禁验收。"}]},{"no":"4.3","title":"验收组织","clauses":[{"no":"4.3","text":"验收组织 - 建筑与市政工程施工质量控制通用规范 GB55032-2022 - 中国建筑科学研究院建筑防火研究所-消防规范网\n目录\n上节\n下节\n查找\n检索\n建筑与市政工程施工质量控制通用规范 GB55032-2022\n返 回\n返 回\n字变小\n字变大\n白底黑字\n搜索"},{"no":"4.3","text":"验收组织"},{"no":"4.3.1","text":"检验批应由专业监理工程师组织施工单位项目专业质量检查员、专业工长等进行验收。"},{"no":"4.3.2","text":"分项工程应由专业监理工程师组织施工单位项目专业技术负责人等进行验收。"},{"no":"4.3.3","text":"分部工程应由总监理工程师组织施工单位项目负责人和项目技术负责人等进行验收。勘察、设计单位项目负责人和施工单位技术、质量部门负责人应参加地基与基础分部工程的验收，设计单位项目负责人和施工单位技术、质量部门负责人应参加主体结构、节能分部工程的验收。"},{"no":"4.3.4","text":"单位工程完工后，各相关单位应按下列要求进行工程竣工验收：\n1 勘察单位应编制勘察工程质量检查报告，按规定程序审批后向建设单位提交；\n2 设计单位应对设计文件及施工过程的设计变更进行检查，并应编制设计工程质量检查报告，按规定程序审批后向建设单位提交；\n3 施工单位应自检合格，并应编制工程竣工报告，按规定程序审批后向建设单位提交；\n4 监理单位应在自检合格后组织工程竣工预验收，预验收合格后应编制工程质量评估报告，按规定程序审批后向建设单位提交；\n5 建设单位应在竣工预验收合格后组织监理、施工、设计、勘察单位等相关单位项目负责人进行工程竣工验收。"}]},{"no":"5","title":"质量保修与维护","clauses":[{"no":"5.0.1","text":"建筑工程应编制工程使用说明书，并应包括下列内容：\n1 工程概况；\n2 工程设计合理使用年限、性能指标及保修期限；\n3 主体结构位置示意图、房屋上下水布置示意图、房屋电气线路布置示意图及复杂设备的使用说明；\n4 使用维护注意事项。"},{"no":"5.0.2","text":"建设单位应建立质量回访和质量投诉处理机制。施工单位应履行保修义务，并应与建设单位签署施工质量保修书，施工质量保修书中应明确保修范围、保修期限和保修责任。"},{"no":"5.0.3","text":"当工程在保修期内出现一般质量缺陷时，建设单位应向施工单位发出保修通知，施工单位应进行现场勘察、制定保修方案，并及时进行修复。"},{"no":"5.0.4","text":"当工程在保修期内出现涉及结构安全或影响使用功能的严重质量缺陷时，应由原设计单位或相应资质等级的设计单位提出保修设计方案，施工单位实施保修。保修完成后，工程应符合原设计要求。"},{"no":"5.0.5","text":"建设单位、施工单位或受委托的其他单位在保修期内应明确保修和质量投诉受理部门、人员及联系方式，并建立相关工作记录文件。"}]}]},{"id":"dbj33t1361","code":"DBJ33/T 1361-2026","name":"建筑与市政塔式起重机安全技术标准","note":"浙江省工程建设标准，2026-04-27 发布、2026-09-01 实施。条文自官方 PDF 提取，附录表格未收录。","sections":[{"no":"1","title":"总则","clauses":[{"no":"1.0.1","text":"为规范建筑与市政塔式起重机安全技术要求，做到技术先进、经济合理、绿色环保，保障施工安全，制定本标准。"},{"no":"1.0.2","text":"本标准适用于浙江省建筑与市政工程施工中塔式起重机的安全技术管理。"},{"no":"1.0.3","text":"建筑与市政施工塔式起重机的安全技术管理除应执行本标准外，尚应符合国家和浙江省现行有关标准的规定。"}]},{"no":"2","title":"术语","clauses":[{"no":"2.0.1","text":"塔式起重机 towercrane\n臂架位于在工作位置保持基本垂直的塔身顶部的动力驱动的回转臂架起重机。简称塔机。"},{"no":"2.0.2","text":"产权单位 ownershipentity\n建筑起重机械的所有权人，包括出租建筑起重机械的出租单位或自购建筑起重机械的单位。"},{"no":"2.0.3","text":"使用单位 userentity\n具有建筑起重机械使用管理权的单位，包括产权单位或产权单位合同约定代其行使建筑起重机械使用管理权的单位。"},{"no":"2.0.4","text":"安装单位 installationentity\n从事建筑起重机械安装、拆卸活动的单位。亦称安拆单位。"},{"no":"2.0.5","text":"维护 maintenance\n为使塔机保持或恢复到能执行其规定功能的状态而进行的一系列工作，包括维修和保养。"},{"no":"2.0.6","text":"维修 repair\n针对影响塔机正常工作的设备损坏及故障等，通过修理或更换受损的零部件，使设备功能恢复的一系列工作。"},{"no":"2.0.7","text":"保养 upkeep\n保证塔机正常及安全运行所进行的清洁、润滑、紧固、调整、防腐等一系列工作。"},{"no":"2.0.8","text":"重大修理 majorrepair\n具有相应特种设备生产许可证的单位进行的，更换原有塔机主要受力结构件、主要机构、控制系统，但不改变主参数的活动。"},{"no":"2.0.9","text":"改造 retrofitting\n具有相应特种设备生产许可证的单位进行的，改变原有塔机主要受力结构件的结构形式，或者主要机构的配置形式，或者主参数的活动。"},{"no":"2.0.10","text":"内爬式 internalclimbing\n塔机安装于主体结构内，由已完成的主体结构承受塔机所有载荷，在主体结构内整体爬升的方式。"},{"no":"2.0.11","text":"外挂式 externalhanging\n塔机安装于主体结构外，由已完成的主体结构承受塔机所有载荷，在主体结构外整体爬升的方式。"},{"no":"2.0.12","text":"爬升 climbing\n不使用其他起重设备，利用塔机自身装置，实现塔机高度的增加或降低的过程。"},{"no":"2.0.13","text":"安全保护装置 safetyprotectiondevices\n保证塔机安全运行的主要安全部件，包括起升高度限位器、幅度限位器、动臂变幅幅度限制装置、回转限位器、运行限位器、起重力矩限制器和起重量限制器、小车断绳保护装置、小车防坠落装置、抗风防滑装置、钢丝绳防脱装置、爬升装置防脱功能装置、安全监控管理系统装置、风速仪和工作空间限制器等。"},{"no":"2.0.14","text":"组合式基础 combinedfoundation\n由若干格构式钢柱或钢管柱(简称钢立柱)与其下端连接的基桩以及上端连接的混凝土承台或型钢平台组成的基础。"},{"no":"2.0.15","text":"安拆带班工长 installationanddismantl ingsupervisor\n由安装单位任命，具有建筑起重机械安装拆卸工 (塔式起重机)操作资格证书及足够的经验和技能，能够负责管理和监督团队作业的人员。亦称安拆主管。"},{"no":"2.0.16","text":"基本架设高度 basicerectionheight\n塔机安装到第一次爬升前，自支撑塔机塔身的基础顶面或行走式塔机的轨道顶面至起重臂根部铰点的最小高度。"},{"no":"2.0.17","text":"独立起升高度 independentliftingheight\n塔机独立状态下，空载且塔身置于最大高度时，吊钩位于最小幅度和最大允许高度处，吊钩支承面对塔机基准面的最大垂直距离。"},{"no":"2.0.18","text":"悬臂高度 jibheight\n塔机附着后最上面一道附着点之上塔身部分的高度。"},{"no":"2.0.19","text":"附着间距 tie-ininterval\n塔机塔身相邻附着装置之间的垂直距离。"},{"no":"2.0.20","text":"工作状态 in-service\n塔机处于司机控制之下进行作业(含吊载运转、空载运转或间歇停机)的状态。"},{"no":"2.0.21","text":"非工作状态 out-of-service\n已安装完毕的塔机，不吊载，所有机构停止运动，切断动力电源，并已采取防风保护措施的状态。"},{"no":"2.0.22","text":"安全距离 safetyclearance\n塔机运动部分与周围障碍物之间的最小允许距离。"}]},{"no":"3","title":"基本规定","clauses":[{"no":"3.0.1","text":"产权单位、安装单位、使用单位、施工单位、工程监理单位、检验检测机构和建设单位应对塔机的安全管理承担相应的责任。"},{"no":"3.0.2","text":"产权单位应对每台塔机建立安全技术档案。 塔机的安全技术档案应包括下列内容:\n1 购销合同及发票、生产许可证、产品合格证、使用说明书、\n购货清单、产权备案证明等原始资料;\n2 定期检验报告、专项检验报告、定期检查记录、定期维护记录、重大修理和改造记录、运行故障和生产安全事故记录、累计运转时间记录等运行资料;\n3 历次安装验收资料。"},{"no":"3.0.3","text":"塔机整机和主要受力结构件应具有本体标识，宜具有电子标签；塔机整机和主要受力结构件本体标识编码规则应符合本标准附录 A 的要求。"},{"no":"3.0.4","text":"塔机使用说明书应包括下列内容:\n1 产品概述;\n2 主要技术性能参数、用途、使用环境要求及设计使用年限;\n3 总图及控制系统原理图等;\n4 安装与拆卸工艺要求;\n5 使用与维护要求;\n6 贮存与运输要求;\n7 易损件清单;\n8 使用操作规程;\n9 基础图及相关载荷参数;\n10 防台风措施;\n11 安全注意事项。"},{"no":"3.0.5","text":"不同额定起重力矩的塔机，达到表 3.0.5 规定出厂年限的，应进行安全评估。安全评估宜委托检验检测机构进行。\n表3.0.5 塔式起重机安全评估条件表额定起重力矩\nM (t·m) 出厂年限(年)\nM <63 >10\n63≤\nM <125 >15\nM ≥125 >20"},{"no":"3.0.6","text":"出现下列情况之一的，塔机不得使用:\n1 国家明令淘汰或者禁止使用的;\n2 不符合安全技术标准或超过生产厂家规定的使用年限的;\n3 未检验或经检验达不到安全技术标准规定的;\n4 没有齐全有效的安全保护装置的;\n5 安全评估达不到安全技术标准规定的;\n6 没有完整安全技术档案的。"},{"no":"3.0.7","text":"塔机的安装与拆卸应包括基本架设高度安装、爬升、附着装置安装、整机拆卸。"},{"no":"3.0.8","text":"塔机安装前，使用单位应与安装单位签订合同和安全协议，明确塔机在安装与拆卸中双方的安全管理责任。"},{"no":"3.0.9","text":"使用单位应按本标准附录 B 的规定编制《施工现场塔式起重机综合信息表》。"},{"no":"3.0.10","text":"相关责任主体单位应编制下列专项施工方案，并应按规定办理相关审批手续:\n1 施工单位应编制《塔式起重机基础专项施工方案》;\n2 安装单位应编制《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》及相应的生产安全事故应急救援预案;\n3 使用单位应编制《塔式起重机使用生产安全事故应急救援预案》;\n4 施工现场塔机安装数量二台及以上且臂架回转半径重叠时，施工单位应编制《塔式起重机群塔作业专项施工方案》。"},{"no":"3.0.11","text":"《塔式起重机安装专项施工方案》应包括下列内容:\n1 工程概况、编制依据;\n2 施工组织管理体系;\n3 布局与选型;\n4 辅助起重设备及机具选择;\n5 资源配置计划;\n6 安装环境与场地条件;\n7 基本架设高度安装;\n8 爬升;\n9 附着装置安装;\n10 检查与验收;\n11 安全技术要求;\n12 危险源辨识与应急处置措施;\n13 施工平面布置图、立面图、附着详图和计算书等附件。"},{"no":"3.0.12","text":"《塔式起重机拆卸专项施工方案》应包括下列内容:\n1 工程概况、编制依据;\n2 施工组织管理体系;\n3 辅助起重设备及机具选择;\n4 资源配置计划;\n5 拆卸环境与场地条件;\n6 拆除顺序;\n7 拆卸前检查;\n8 拆卸技术要求;\n9 安全技术要求;\n10 危险源辨识与应急处置措施;\n11 施工平面布置图、立面图和附着详图等附件。"},{"no":"3.0.13","text":"《塔式起重机群塔作业专项施工方案》应包括下列内容:\n1 工程概况、编制依据;\n2 施工组织管理体系;\n3 塔机配置;\n4 群塔爬升计划;\n5 群塔作业管理;\n6 施工保证措施;\n7 危险源辨识与应急处置措施;\n8 群塔平面布置图、各阶段相邻塔机关系立面图等附件。"},{"no":"3.0.14","text":"下列情形之一的专项施工方案，施工单位应组织专家论证:\n1 采用非常规起重设备、方法，且单件起吊重量在 100kN 及以上塔机的安装与拆卸;\n2 起重量300kN 及以上，或搭设总高 200m 及以上，或搭设基础标高在200m 及以上塔机的安装和拆卸;\n3 内爬式和外挂式塔机的安装与拆卸(含加节和降节);\n4 采用非常规安装方式或不符合产品使用说明书要求的塔机的安装和拆卸(含加节和降节);\n5 塔机空中调整起重臂长度。"},{"no":"3.0.15","text":"塔机的安装拆卸工、司机、司索信号工、电工等应持有效的建筑施工特种作业操作资格证书上岗作业。"},{"no":"3.0.16","text":"塔机的安装与拆卸应由安装单位负责实施。塔机的安装与拆卸作业，安装单位应配备下列人员:\n1 项目负责人、安全负责人和持有安全生产考核合格证书的机械类专职安全生产管理人员;\n2 配备建筑施工特种作业操作资格证书的安装拆卸工、司机、司索信号工、电工等特种作业人员;\n3 安装拆卸工不应少于4人，并应明确安拆带班工长。"},{"no":"3.0.17","text":"安拆带班工长应符合下列要求:\n1 应具有5年以上塔机的安拆经验，并接受过安拆带班工长方面的相关培训;\n2 应掌握专项施工方案及使用说明书的相关安全技术要求;\n3 应具有对安装拆卸工进行培训和管理的能力;\n4 应具有确认安装与拆卸过程中所使用设备适应性的能力。"},{"no":"3.0.18","text":"施工单位及工程监理单位应对塔机的设备进场安装与拆卸、检验与检测、检查与维护等进行现场巡视检查。"},{"no":"3.0.19","text":"工程监理单位或建设单位对安装和使用的塔机的安全性能有疑义时，可委托具有相应资质的检验检测机构进行检验检测。"},{"no":"3.0.20","text":"塔机的安全保护装置应齐全并调试合格，不得随意调整和拆除安全保护装置；严禁将行程限位开关作为停止运行的控制开关。"},{"no":"3.0.21","text":"塔机在安装、维护和使用时，不得任意改变电气系统的配置。"},{"no":"3.0.22","text":"施工用电应符合现行行业标准《建筑与市政工程施工现场临时用电安全技术标准》JGJ/T 46 的规定和使用说明书的要求。"}]},{"no":"4","title":"安全职责","clauses":[{"no":"4.0.1","text":"产权单位应对进入施工现场塔机设备的安全性能负责，并应履行下列安全职责:\n1 办理建筑起重机械产权备案;\n2 组织从业人员进行安全与技术培训;\n3 负责塔机进场前维护;\n4 参加塔机设备进场验收;\n5 委托检验检测机构对塔机进行专项检验和安全评估;\n6 建立塔机安全技术档案。"},{"no":"4.0.2","text":"安装单位应依法取得起重设备安装工程专业承包资质和建筑施工企业安全生产许可证，并应在资质许可范围内从事塔机的安装与拆卸；应对施工现场塔机的安装与拆卸质量负责。 安装单位应履行下列安全职责:\n1 建立健全安全管理体系和安全管理制度;\n2 配备满足本企业塔机安装、拆除及操作作业的从业人员;\n3 依法与特种作业人员签订劳动合同;\n4 组织从业人员进行安全与技术培训;\n5 编制《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》及相应的生产安全事故应急救援预案;\n6 负责塔机设备进场检查并参加验收;\n7 负责塔机的安装与拆卸;\n8 建立塔机安装、拆卸安全技术档案。"},{"no":"4.0.3","text":"使用单位应建立健全建筑起重机械安全管理制度，设立建筑起重机械安全管理机构；应对施工现场塔机的运行安全负责。\n使用单位应履行下列安全职责:\n1 配置满足项目工程需求的建筑起重机械专职管理人员、专职安全生产管理人员和起重吊装特种作业人员;\n2 组织从业人员进行安全与技术培训;\n3 编制《塔式起重机使用生产安全事故应急救援预案》;\n4 审批安装单位的《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》及相应的生产安全事故应急救援预案;\n5 核查安装单位现场的管理人员和安装作业人员;\n6 在塔机运行范围内设置明显的安全警示标志，对集中作业区做好安全防护;\n7 负责塔机检查、维护与日常安全管理;\n8 建立塔机使用安全技术档案;\n9 塔机安全管理中发现安全事故隐患时，应及时落实整改。"},{"no":"4.0.4","text":"施工单位应建立健全安全管理保证体系和安全管理制度,\n设立建筑机械设备管理机构。施工单位应履行下列安全职责:\n1 配置满足项目工程需求的建筑起重机械设备专职管理人员、专职安全生产管理人员;\n2 编制《塔式起重机基础专项施工方案》和《塔式起重机群塔作业专项施工方案》;\n3 审批使用单位编制的《塔式起重机使用生产安全事故应急救援预案》;\n4 组织专项施工方案专家论证;\n5 核查安装单位、使用单位现场的管理人员和特种作业人员;\n6 在塔机设备进场、安装与拆卸、检验与检测、检查与维护过程中现场巡视检查;\n7 委托检验检测机构进行塔机的安装检验和定期检验;\n8 组织基础验收、首次安装验收和附着装置安装验收;\n9 塔机安全管理中发现安全事故隐患时，应及时落实整改;\n10 建立塔机安全管理台账。"},{"no":"4.0.5","text":"产权单位与施工单位签订租赁合同出租塔机时，应确定塔机的使用管理权，明确塔机在租赁、检查、维护和使用中双方的安全职责；产权单位行使塔机使用管理权时，应同时履行产权单位和使用单位的安全职责；施工单位行使塔机使用管理权时，应同时履行施工单位和使用单位的安全职责。"},{"no":"4.0.6","text":"工程监理单位应建立健全安全管理保证体系和安全管理制度，并应履行下列安全职责:\n1 配置建筑起重机械设备监理人员;\n2 审核施工单位报审的塔机安全技术资料;\n3 核查安装单位现场的管理人员和特种作业人员;\n4 在塔机设备进场、安装与拆卸、检验与检测、检查与维护过程中现场巡视检查；监督安装单位按《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》实施;\n5 参加基础验收、首次安装验收和附着装置安装验收;\n6 监督施工单位落实建筑起重机械安全管理制度;\n7 塔机安全管理中发现安全事故隐患时，应及时督促整改;\n整改不力或拒绝整改的，应责令立即停工，并及时向建设单位和当地建设主管部门报告。"},{"no":"4.0.7","text":"检验检测机构对塔机进行检验检测时，应客观、公正、及时地出具检验检测结果，并应对检验检测结果依法承担法律责任。"},{"no":"4.0.8","text":"建设单位应履行下列安全职责:\n1 不得明示或暗示施工单位使用不符合安全要求的塔机设备;\n2 组织不同合约的施工单位进行塔机的协调安全管理;\n3 监督施工单位建立健全建筑起重机械安全管理制度;\n4 塔机安全管理中发现安全事故隐患时，应及时督促整改;\n整改不力或拒绝整改的，应责令立即停工，并及时向当地建设主管部门报告。"}]},{"no":"5","title":"选型与布局","clauses":[{"no":"5.0.1","text":"施工单位应根据施工组织设计、使用说明书及相关标准等进行塔机的选型与布局。"},{"no":"5.0.2","text":"施工单位应根据吊运物的特征、安装与拆卸条件、使用环境等合理选择塔机类型，并应复核塔机的起重能力。"},{"no":"5.0.3","text":"塔机起吊重量不宜大于该幅度下额定起重量的90%。"},{"no":"5.0.4","text":"塔机布置应符合下列规定:\n1 塔机不得越过无防护设施的外电架空线路作业。 在外电架空线路附近吊装时，塔机的任何部位或被吊物体端部与架空线路边线之间的安全距离应符合表5.0.4的规定。\n表5.0.4 塔机的任何部位或被吊物体端部与架空线路边线之间的安全距离电压(kV) <1 10 35 110 220 330 550\n沿垂直方向(m) 1.5 3.0 4.0 5.0 6.0 7.0 8.5\n沿水平方向(m) 1.5 2.0 3.5 4.0 6.0 7.0 8.5\n2 任意两台塔机之间的最小架设距离应保证低位塔机的起重臂端部与另一台塔机的塔身之间的水平净距离不小于 2m；高位塔机最低位置的部件、吊钩升至最高点或平衡重的最低部位与低位塔机最高位置部件之间的垂直距离不得小于2m。"},{"no":"5.0.5","text":"塔机的附着装置不宜设置在钢筋混凝土装配式构件上。"},{"no":"5.0.6","text":"塔机在航空站、飞机场或航线附近限高区域内安装使用时，应向相关部门通报并获得许可。"},{"no":"5.0.7","text":"塔机在强磁场区域安装使用时，应采取防止对人员和塔机控制系统产生不利影响的措施。"},{"no":"5.0.8","text":"塔机的计算风压应符合现行国家标准《塔式起重机设计规范》GB/T13752的规定，其中塔机非工作工况10m 高度处计算风压不应小于0.8kN/m2。"}]},{"no":"6","title":"基础","clauses":[{"no":"6.0.1","text":"塔机的基础形式应根据工程地质、载荷参数及塔机的稳定性要求、现场条件、技术经济指标等，并结合使用说明书的要求确定。"},{"no":"6.0.2","text":"塔机可采用下列基础形式:\n1 板式基础;\n2 桩基承台式混凝土基础;\n3 组合式基础;\n4 内爬式和外挂式支承结构基础;\n5 轨道式基础。"},{"no":"6.0.3","text":"板式基础、桩基承台式混凝土基础、组合式基础的设计应符合《塔式起重机混凝土基础工程技术标准》 JGJ/T187的规定。"},{"no":"6.0.4","text":"内爬式和外挂式支承结构基础的设计与加工制作应符合下列规定:\n1 设计内容应包括支承钢结构及依附的主体结构;\n2 支承钢结构设计应由相应资质的设计单位完成;\n3 依附的主体结构设计宜由原建筑结构设计单位完成；或由相应资质的设计单位完成，并经原建筑结构设计单位确认;\n4 支承钢结构应由具有相应资质的钢结构施工企业加工制作。钢结构施工企业应提供支承钢结构加工制作的质量证明文件。"},{"no":"6.0.5","text":"轨道式基础应按使用说明书的要求设置，且应符合现行国家标准《塔式起重机安全规程》GB 5144 和《塔式起重机》GB/T\n5031的要求。"},{"no":"6.0.6","text":"塔机基础设计参数计取应符合下列规定:\n1 岩土物理力学参数应以《岩土工程勘察报告》为依据计取,\n必要时应在塔机基础位置补充勘探;\n2 基础载荷参数应以使用说明书为依据计取，包括独立状态下工作状态和非工作状态的垂直荷载、水平荷载、倾覆力矩、扭矩等，且应考虑基础及上部土体的自重荷载;\n3 塔机工作状态和非工作状态下的基础载荷参数与使用说明书不一致时，应按相关标准的规定进行验算。"},{"no":"6.0.7","text":"采用板式基础、桩基承台式混凝土基础、组合式基础、轨道式基础时,《塔式起重机基础专项施工方案》应包括下列内容:\n1 工程概况、编制依据;\n2 施工组织管理体系;\n3 塔机选型及技术参数;\n4 岩土物理力学性能;\n5 基础形式选择;\n6 设计;\n7 施工计划和施工工艺;\n8 检查与验收;\n9 质量保证措施;\n10 安全管理措施;\n11 危险源辨识及应急处置措施;\n12 计算书、基础平面布置图、基础定位图和基础详图等附件。"},{"no":"6.0.8","text":"采用内爬式与外挂式支承结构基础时,《塔式起重机基础专项施工方案》应包括下列内容:\n1 工程概况、编制依据;\n2 施工组织管理体系;\n3 主体结构概况;\n4 塔机选型及技术参数;\n5 塔机安装工况;\n6 支承钢结构设计;\n7 依附主体结构设计;\n8 安装设备选择;\n9 各项资源配置;\n10 支承结构安装;\n11 检查与验收;\n12 安全技术措施;\n13 危险源辨识及应急处置措施;\n14 安装工况图、支撑钢结构设计文件、依附主体结构设计文件等附件。"},{"no":"6.0.9","text":"预埋螺栓、预埋节和预埋支腿的材质和规格应符合使用说明书的要求，预埋节和预埋支腿应由原塔机生产厂家提供。"},{"no":"6.0.10","text":"塔机基础不能避开地下设施和管线时，应对地下设施和管线采取保护措施，地下设施和管线不得承受基础荷载。"},{"no":"6.0.11","text":"塔机基础设置对地下室结构、主体结构或基坑支护结构产生不利影响时，应由建筑结构设计单位或基坑支护结构设计单位出具书面确认意见。"},{"no":"6.0.12","text":"塔机基础预埋螺杆所用材料为非低碳钢时，严禁焊接、\n敲打。"},{"no":"6.0.13","text":"工程基础开挖施工时，应对塔机基础采取保护措施。"},{"no":"6.0.14","text":"塔机基础周围应设置排水设施。"},{"no":"6.0.15","text":"塔机基础施工完毕，施工单位应按本标准附录 C 的规定组织塔机基础验收。"},{"no":"6.0.16","text":"塔机使用过程中，施工单位应对塔机基础进行定期变形监测，基础变形监测应符合专项施工方案和相关标准的要求。"}]},{"no":"7","title":"安装与拆卸","clauses":[{"no":"7.1","text":"〔一般规定〕","isHeading":true},{"no":"7.1.1","text":"塔机安装与拆卸前，安装单位应告知工程所在地县级及以上地方人民政府建设主管部门。"},{"no":"7.1.2","text":"塔机的安装与拆卸应符合《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》及使用说明书的要求。"},{"no":"7.1.3","text":"安装与拆卸作业的辅助起重设备设置在主体结构上时，应明确辅助起重设备设置的位置及固定方法，并应验算主体结构的承载能力，验算结果应经建筑结构设计单位确认。"},{"no":"7.1.4","text":"安装与拆卸作业前，施工单位应按本标准附录 D 的规定组织现场安装、拆卸条件检查，检查结果符合要求后方可安装或拆卸塔机。"},{"no":"7.1.5","text":"安装与拆卸作业前，安装单位应对作业人员进行安全技术交底。"},{"no":"7.1.6","text":"安装与拆卸作业范围应设置警戒线及警示标志。 非作业人员不得进入警戒范围。"},{"no":"7.1.7","text":"安装与拆卸作业人员应正确佩戴安全防护用品，严禁酒后作业。"},{"no":"7.1.8","text":"安装与拆卸作业应由安拆带班工长负责。 安拆带班工长在整个安装与拆卸过程中不得离开现场，并应履行下列职责:\n1 确保塔机安装的部件与塔机设备进场验收的部件一致;\n2 确保辅助起重机械和设备符合规定并经过认证;\n3 确保所有安装拆卸工配备必要的工具和个人防护装备;\n4 确保施工区域内所有人员的通信畅通和有效交流;\n5 指挥所有安装拆卸工及安装与拆卸作业中可能使用的辅助起重机械和设备;\n6 确保按照《塔式起重机安装专项施工方案》、《塔式起重机拆卸专项施工方案》及使用说明书的要求进行操作；当继续作业可能会出现危险时，应终止作业。"},{"no":"7.1.9","text":"安装与拆卸作业中应统一指挥，明确指挥信号。当视线受阻或距离过远时，应采用对讲机或多级指挥。"},{"no":"7.1.10","text":"作业时塔机最大高度处的风速应符合使用说明书的要求；严禁雨、雪、雾、霾、沙尘等天气进行安装与拆卸作业；塔机最高处的风速超过9.0m/s时，应停止塔机安装与拆卸作业。"},{"no":"7.1.11","text":"夜间不宜进行安装与拆卸作业；特殊情况下需在夜间进行安装与拆卸作业时，现场应保证足够的照明，并应采取相关安全技术措施。"},{"no":"7.1.12","text":"特殊情况下安装与拆卸作业不能连续进行时，必须将已安装或未拆卸的部位固定并达到安全状态，经检查确认无安全事故隐患后，方可停止作业。"},{"no":"7.1.13","text":"塔机安装与拆卸时，塔机与周围建筑物及施工设施之间的安全距离应符合下列规定:\n1 除起重臂、起重小车、吊钩、起升和变幅钢丝绳及平衡臂外，塔机其他运动件与周围建筑物及施工设施之间的水平距离不应小于0.6m;\n2 周围建筑物、施工设施等不低于塔机的起重臂或平衡臂时，塔机起重臂或平衡臂最外端与周围建筑物及施工设施之间的水平距离不应小于2.0m;\n3 周围建筑物、施工设施等低于塔机的起重臂或平衡臂且在其回转半径覆盖范围内时，塔机升至最高点的吊钩或平衡重的最低部位与建筑物及施工设施最高部位之间的垂直距离不应小于2.0m。"},{"no":"7.1.14","text":"塔机安装与拆卸时，塔机任何部位或辅助安装的起重设备与周围架空输电线的安全距离应符合相关标准的规定。"},{"no":"7.1.15","text":"塔机首次安装的独立起升高度不宜大于使用说明书规定的最大独立起升高度的80%。"},{"no":"7.1.16","text":"安装时，应确保各部件之间的连接件和防松防脱元件齐全且连接可靠。严禁用其他物品代用连接件及防松防脱元件。"},{"no":"7.1.17","text":"高强度螺栓连接应符合使用说明书的要求，应采用专用工具施拧到使用说明书规定的扭矩；螺栓副安装紧固后，螺栓外露螺纹长度应不小于3倍螺距。"},{"no":"7.1.18","text":"塔机空载且风速不大于 3m/s时，独立状态下塔身轴心线的侧向垂直度允许偏差不应大于4/1000；塔机附着状态下最高附着点以上塔身轴心线的侧向垂直度允许偏差不应大于 4/1000,\n最高附着点以下塔身轴心线的侧向垂直度允许偏差不应大于\n2/1000。"},{"no":"7.1.19","text":"塔机空载且风速不大于 3m/s时，内爬式和外挂式的塔机安装后，塔身侧向垂直度允许偏差不应大于4/1000。"},{"no":"7.1.20","text":"塔机首次安装完成后，应进行首次安装验收。 首次安装验收应符合下列规定:\n1 安装单位应按本标准附录 E 的规定进行首次安装自检;\n2 安装单位首次安装自检合格后，施工单位应委托有相应资质的检验检测机构进行安装检验;\n3 检验检测机构安装检验合格后，施工单位应按本标准附录\nF 的规定组织首次安装验收；实行施工总承包的，应由施工总承包单位组织首次安装验收。"},{"no":"7.1.21","text":"塔机首次安装验收合格后方可投入使用；未经首次安装验收或首次安装验收不合格，塔机严禁使用。"},{"no":"7.1.22","text":"内爬式和外挂式塔机支承结构基础安装和拆除过程中,\n作业平台应设置牢固，并应配置攀登设施和防坠落装置。"},{"no":"7.1.23","text":"塔机的安装、拆卸安全技术档案应包括下列内容:\n1 安装、拆卸合同及安全协议书;\n2 安装与拆卸专项施工方案;\n3 安装与拆卸生产安全事故应急救援预案;\n4 安全技术交底等相关资料;\n5 安装验收资料。"},{"no":"7.1.24","text":"塔机首次安装验收合格后，应在醒目位置悬挂安全警示牌、操作规程牌、验收合格牌、定岗定员牌等标牌标识。"},{"no":"7.2","text":"〔设备进场管理〕","isHeading":true},{"no":"7.2.1","text":"塔机设备进场前，产权单位应对进入施工现场的塔机设备进行维护，并应按本标准附录 G 的规定编制《进场塔式起重机整机和主要受力结构件信息归集表》，提供相关技术资料。"},{"no":"7.2.2","text":"塔机设备的性能应符合现行国家标准《塔式起重机》GB/T\n5031的规定。"},{"no":"7.2.3","text":"塔机设备进场后，安装单位应依据《进场塔式起重机整机和主要受力结构件信息归集表》、使用说明书及相关技术资料对进场的塔机设备进行检查；检查合格后，施工单位应组织塔机设备进场验收，验收结果应符合本标准附录 H 的要求。"},{"no":"7.2.4","text":"塔机设备进场验收合格后，安装单位方可进行安装。"},{"no":"7.3","text":"〔基本架设高度安装〕","isHeading":true},{"no":"7.3.1","text":"基本架设高度安装应符合专项施工方案和使用说明书的要求。"},{"no":"7.3.2","text":"塔机安装时，基础混凝土强度应大于设计强度的80%。"},{"no":"7.3.3","text":"起吊起重臂总成时，应试吊确认其处于平衡状态，严禁外力拉曳；试吊时宜标记吊装起重臂的吊点位置。"},{"no":"7.3.4","text":"不同臂长组合造成平衡重数量减少时，平衡重空缺的部位应采取防坠落措施。"},{"no":"7.3.5","text":"塔机的主体结构、电动机机座及所有电气设备的金属外壳、导线的金属保护管均应可靠接地，接地电阻不应大于4Ω；采用多处重复接地时，接地电阻不应大于10Ω。"},{"no":"7.4","text":"〔爬升、附着装置安装〕","isHeading":true},{"no":"7.4.1","text":"爬升作业前，应按使用说明书要求对塔机进行检查，检查结果应符合下列规定:\n1 爬升架结构应完好，爬升支撑装置和换步支撑装置应无结构变形或裂纹;\n2 爬升支撑装置防脱功能应有效;\n3 换步支撑装置锁定或位置保持功能应有效，动作应灵活无卡阻;\n4 爬升架导向装置与塔身主弦杆的间隙应符合使用说明书要求;\n5 下支座或爬升过渡节应与爬升架可靠连接;\n6 爬升液压系统功能应完好，各管路应无泄漏，顶升油缸连接与锁定应完好;\n7 应放松并预留足够长度的供电电缆。"},{"no":"7.4.2","text":"爬升作业过程应符合使用说明书要求，并应符合下列规定:\n1 应对塔机油缸顶起的上部结构进行平衡状态调整，保证顶起的上部结构的重心落在顶升油缸上;\n2 操作顶升油缸顶升前，应确保爬升支撑装置两端同时正确支撑在标准节爬升支撑部位，并应使爬升支撑装置的防脱装置正确锁定;\n3 爬升支撑装置与爬升换步装置相互转换时，两侧的换步支撑装置应同时正确支撑在标准节爬升支撑部位，严禁单边承载;\n4 爬升过程中，下支座或爬升过渡节与标准节未可靠连接时，严禁进行起升、回转和变幅等操作;\n5 爬升过程中出现异常情况时，应立即停止作业，排除异常情况后方可继续作业。"},{"no":"7.4.3","text":"爬升作业结束后，应将标准节与下支座或爬升过渡节可靠连接。"},{"no":"7.4.4","text":"爬升作业的安装拆卸工不应少于 4 人。安拆带班工长应按下列要求加强过程控制:\n1 应统一指挥安装拆卸工协同作业，严禁擅自操作;\n2 确认爬升支撑装置两端同时正确支撑在标准节爬升支撑部位，且爬升支撑装置的防脱装置可靠锁定后，方可发出液压油缸操作指令;\n3 爬升支撑装置与换步支撑装置相互转换时，确认两侧的换步支撑装置同时正确支撑在标准节爬升支撑部位后，方可发出液压油缸操作指令;\n4 确认下支座或爬升过渡节与标准节可靠连接后，方可发出起升、回转和变幅操作指令;\n5 确认下支座或爬升过渡节与标准节可靠连接后，方可中途暂停或结束作业。"},{"no":"7.4.5","text":"塔机爬升作业时，应对相邻塔机采取防止发生相互干涉的措施。"},{"no":"7.4.6","text":"塔机安装高度超过独立起升高度时，应安装附着装置。附着装置的安装位置、附着间距和塔机的悬臂高度应符合使用说明书要求。"},{"no":"7.4.7","text":"施工单位应依据使用说明书复核附着装置附着点的主体结构强度，必要时复核结果应经主体结构设计单位确认；附着装置附着点为混凝土结构时，混凝土达到设计强度后方可使用塔机。"},{"no":"7.4.8","text":"附着装置的安装应符合使用说明书要求，并应符合下列规定:\n1 附着装置安装前，应搭设作业平台;\n2 附着框宜安装在标准节水平腹杆的位置;\n3 附着支座与主体结构宜采用螺栓连接;\n4 附着框与附着杆应水平安装，附着杆水平安装倾角允许偏差为±5°;\n5 附着杆的长细比不应大于120，附着杆的两端固定应采用销轴连接。"},{"no":"7.4.9","text":"附着装置安装完成，安装单位自检合格后，施工单位应按本标准附录I的规定组织附着装置安装验收。"},{"no":"7.5","text":"〔整机拆卸〕","isHeading":true},{"no":"7.5.1","text":"整机拆卸前，应对塔机及附着装置进行全面检查，发现安全事故隐患应及时采取措施整改，安全事故隐患治理后方可进行拆卸作业。"},{"no":"7.5.2","text":"拆卸时应先降节、后拆除附着装置；拆除最上一道附着装置后，塔机的悬臂高度或独立起升高度不应超过使用说明书的要求。"},{"no":"7.5.3","text":"拆卸起重臂、平衡臂根部连接销轴前，应找准重心，并应采取防止连接销轴拆除后可能引起冲击的措施。"},{"no":"7.5.4","text":"拆卸完毕后，应拆除为塔机拆卸作业而设置的所有设施,\n并清理吊索具、工具等各种零配件和杂物。"},{"no":"7.5.5","text":"已拆卸部件应安全妥善放置。"}]},{"no":"8","title":"使用","clauses":[{"no":"8.1","text":"〔一般规定〕","isHeading":true},{"no":"8.1.1","text":"塔机首次安装验收合格之日起 30 日内，使用单位应向工程所在地县级及以上地方人民政府建设主管部门办理使用登记。"},{"no":"8.1.2","text":"施工现场存在下列情况之一时，应采取相应的限制措施、\n安全防护措施及应急措施:\n1 塔机回转半径内存在障碍物;\n2 塔机回转半径内存在外电高压输送线路;\n3 塔机回转半径下方存在建(构)筑物及人流密集场所。"},{"no":"8.1.3","text":"每台塔机应至少配备两名司索信号工。塔机使用前应对司机、司索信号工等从业人员进行安全与技术交底，安全与技术交底内容应包括使用说明书和专项施工方案的相关内容。"},{"no":"8.1.4","text":"基础混凝土达到设计强度后方可使用塔机。"},{"no":"8.1.5","text":"塔机使用时，起重臂和吊物下方严禁人员停留或穿行；物件吊运时，严禁吊物在人员上方通过；严禁使用塔机载运人员。"},{"no":"8.1.6","text":"遇到暴雨、大雪、急冻、台风等恶劣天气时应停止塔机作业。恶劣天气过后，应对塔机主要受力结构件、安全保护装置和电气系统等进行检查，经试吊确认各机构运转正常、安全保护装置工作有效、制动器灵敏可靠后方可进行作业。"},{"no":"8.1.7","text":"非工作状态下的塔机应符合下列规定:\n1 回转机构应解除制动;\n2 应摘除吊钩上的吊索具，吊钩应升至最高限位处;\n3 小车变幅塔机的小车应收至起重臂根部，动臂变幅塔机的起重臂应停放在使用说明书规定的幅度位置;\n4 行走式塔机的夹轨器应与轨道夹紧，或采用锚定等抗风防滑措施。"},{"no":"8.1.8","text":"为满足安全距离要求，动臂变幅塔机需改变非工作状态下起重臂安全停放位置时，使用单位应采取防止起重臂意外后倾的非吊钩挂载方式的附加措施。"},{"no":"8.1.9","text":"塔机存在下列情况之一的，不得使用:\n1 结构件上有可见裂纹和严重锈蚀的;\n2 主要受力结构件存在塑性变形的;\n3 连接件存在严重磨损和塑性变形的;\n4 钢丝绳达到报废标准的;\n5 安全保护装置不齐全或失效的。"},{"no":"8.2","text":"〔检查与维护〕","isHeading":true},{"no":"8.2.1","text":"使用单位应按相关标准的规定及使用说明书的要求对塔机实施每日使用前检查和月度检查，对检查发现的问题应及时进行整改，并记录存档。"},{"no":"8.2.2","text":"塔机每日使用前，塔机司机应按本标准附录 K 的规定进行每日使用前检查。"},{"no":"8.2.3","text":"使用单位应按本标准附录 L 的规定对塔机进行月度检查，每月检查不应少于两次。"},{"no":"8.2.4","text":"塔机停用6个月及以上，在使用前，施工单位应委托相应资质的检验检测机构对塔机进行检验。"},{"no":"8.2.5","text":"使用单位应负责塔机月度维护，并应按本标准附录 M 的规定进行记录；维护期间塔机应暂停使用，并应设置警示标志。"},{"no":"8.2.6","text":"塔机维修时，严禁改变主要受力结构件、控制系统和主要性能参数。"},{"no":"8.2.7","text":"检查或检验结果表明塔机应进行重大修理或改造时，塔机应停止使用。"},{"no":"8.2.8","text":"塔机的重大修理和改造应由产权单位负责，塔机的重大修理和改造应符合下列规定:\n1 应由具有特种设备生产许可证的塔机生产厂家实施;\n2 经过重大修理的塔机，塔机生产厂家应提供完整的重大修理技术资料;\n3 经过改造的塔机，产权单位应重新办理产权备案手续。"},{"no":"8.2.9","text":"维护作业人员应持建筑起重机安装拆卸工(塔式起重机)\n或建筑电工证，并应经培训后上岗。"},{"no":"8.3","text":"〔安全防护〕","isHeading":true},{"no":"8.3.1","text":"塔机作业范围内应设置明显的安全警示标志，对集中作业区应进行安全防护。"},{"no":"8.3.2","text":"办公区、生活区不宜设置在塔机作业半径与吊物坠落半径之和范围内；办公区、生活区设置在塔机作业半径与吊物坠落半径之和范围内时，办公区、生活区上方应设置双层安全防护棚。"},{"no":"8.3.3","text":"塔机基础地面四周应搭设围护设施，围护设施高度不应小于1.8m，并应涂警戒色；当塔机位于场内主要道路边时，应设置防撞设施。"},{"no":"8.3.4","text":"塔机司机室内应配置灭火器。"},{"no":"8.3.5","text":"塔机应配置风速仪；风速大于工作允许风速时，应能发出停止作业的警报。塔顶高度超过30m 时，应配置障碍灯。"},{"no":"8.3.6","text":"除塔机使用说明书规定设置的挡风板，塔机上不得悬挂任何挡风物。"},{"no":"8.3.7","text":"建筑物和塔身之间设置人行通道时，通道宽度不应大于\n800mm，两侧防护栏杆高度不应小于1.5m；通道及栏杆应与塔身和建筑物可靠连接，且不应采用两端固接方式；通道不得与作业脚手架和支撑脚手架连接。"},{"no":"8.4","text":"〔作业〕","isHeading":true},{"no":"8.4.1","text":"塔机司机、司索信号工应密切配合，应明确指挥信号，统一指挥。"},{"no":"8.4.2","text":"起吊前，应对吊具与索具进行检查，确认合格后方可起吊。"},{"no":"8.4.3","text":"塔机起吊、回转、变幅、行走及落钩动作前应鸣笛警示。"},{"no":"8.4.4","text":"塔机开始起吊时，应先将吊物吊离地面 200mm~300mm,\n检查制动性能和物件绑扎状态等，确认无误后方可起吊。 对有晃动的物件，必须拴拉溜绳使之稳固。"},{"no":"8.4.5","text":"吊物与地面或其他物件之间存在钩挂或不明阻力时，不得起吊。"},{"no":"8.4.6","text":"吊装作业出现下列情况之一时，应停止作业:\n1 指挥信号不明确;\n2 超载或吊物质量不明确;\n3 歪拉或斜挂吊物;\n4 无法看清吊物;\n5 吊物上有人或吊物下站人;\n6 吊物埋在地下或沉入水中;\n7 吊物捆绑或吊挂不牢固，不符合安全要求;\n8 吊物棱角处与捆绑绳间未采取防范措施;\n9 安全保护装置失灵;\n10 六级或六级以上强风。"},{"no":"8.4.7","text":"塔机作业中突发故障，应采取措施将吊物降落到安全地点。严禁吊物长时间悬挂在空中。"},{"no":"8.4.8","text":"夜间作业应有足够照明，照明设施应符合现行行业标准《建筑与市政工程施工现场临时用电安全技术标准》JGJ/T 46 的规定。"},{"no":"8.4.9","text":"作业完成后，应松开回转制动器；各机构应处于非工作状态，控制开关应置于零位，并应关闭门窗、切断总电源。"},{"no":"8.4.10","text":"塔机起重臂回转范围内存在同时作业的流动式起重机、\n混凝土泵车等设备，且其任何位置高于塔机臂架时，应采取防碰撞措施或暂停塔机作业。"},{"no":"8.5","text":"〔防台风〕","isHeading":true},{"no":"8.5.1","text":"使用单位应根据生产安全事故应急救援预案要求，组织塔机防台风应急救援演练。"},{"no":"8.5.2","text":"塔机使用说明书应明确不同安装工况、不同风力等级下应采取的安全技术措施。"},{"no":"8.5.3","text":"相关部门发布台风预警时，施工单位应组织使用单位对塔机进行检查，并应按照使用说明书的安全技术措施采取相应的应急处置措施。"},{"no":"8.5.4","text":"台风过后，使用单位应对塔机进行检查与维护，必要时可委托检验检测机构对塔机进行检验；检查或检验合格后方可恢复塔机使用。"},{"no":"8.5.5","text":"塔机在台风中遭遇重大损伤影响安全使用时，应及时拆除，并应采取防止次生灾害发生的措施。"}]},{"no":"9","title":"检验","clauses":[{"no":"9.0.1","text":"塔机检验应包括安装检验、定期检验和专项检验；安装检验和定期检验应由施工单位委托检验检测机构完成，专项检验应由产权单位委托检验检测机构完成。"},{"no":"9.0.2","text":"塔机检验检测机构应具备相应资质，检验检测人员应具备相应的从业资格和能力。"},{"no":"9.0.3","text":"委托单位应向检验检测机构提供与被检塔机相符的完整技术资料，并应对提供的技术资料真实性负责。"},{"no":"9.0.4","text":"塔机进行安装检验和定期检验时，相关人员应符合下列规定:\n1 检验检测机构的检验人员不应少于2人;\n2 安装单位和使用单位的相关人员应到场全程配合。"},{"no":"9.0.5","text":"塔机的安装检验和定期检验内容应符合《建筑施工升降设备设施检验标准》 JGJ305的规定。"},{"no":"9.0.6","text":"对于检验结果不合格项，施工单位应组织整改，整改应符合下列规定:\n1 检验检测机构应对保证项目不合格项的整改情况进行现场复检确认;\n2 检验结果判定为合格，且一般项目存在不合格项时，一般项目的不合格项应整改至合格;\n3 整改资料经工程监理单位审核后报送检验检测机构;\n4 不合格项整改后经检验检测机构审核或现场复验确认仍不合格时，检验检测机构应出具检验不合格报告，并应将检验不合格报告上报工程所在地建设行政主管部门。"},{"no":"9.0.7","text":"施工单位不得将已被检验且存在不合格项或已出具不合格检验结果的塔机委托其他检验检测机构重新检验。"},{"no":"9.0.8","text":"应对下列情形之一的塔机进行专项检验:\n1 出厂满4年;\n2 最近一次专项检验合格后满两年。"},{"no":"9.0.9","text":"专项检验内容应包括塔机主要受力结构件的外观检查、壁厚检测和无损检测。无损检测应符合现行行业标准《建筑起重机械安全评估技术规程》 JGJ/T189的规定。"},{"no":"9.0.10","text":"检验检测机构出具的检验报告宜具有网上查询功能。"}]},{"no":"10","title":"数字化管理","clauses":[{"no":"10.0.1","text":"塔机的生产厂家、产权单位、安装单位、使用单位、施工单位、工程监理单位及检验检测机构应按相关规定上传相关数据至浙江省工程建设数字化管理系统。"},{"no":"10.0.2","text":"塔机宜具备主要运行数据存储和实时传输功能。主要运行数据宜包括起重量、起重力矩、起升高度、工作幅度、回转角度和运行行程等信息。"},{"no":"10.0.3","text":"塔机的视频存储时间不宜小于 72h，其他运行数据存储时间不宜少于30个连续工作日。"},{"no":"10.0.4","text":"塔机宜具备建筑起重机械司机(塔式起重机)的信息识别与记录功能。"},{"no":"10.0.5","text":"已办理使用登记手续的塔机，使用前宜在显著位置设置数字化标识。"},{"no":"10.0.6","text":"施工单位宜建立数字化管理系统，对施工现场使用的塔机实施全过程数字化管理；产权单位宜建立数字化管理系统，对塔机的使用和技术档案实施全生命周期数字化管理。"}]}]}]};</script>
<script>
(function(){
'use strict';

/* ==================== 存储 ==================== */
var LS = (function(){
  var mem = {}, ok = true;
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); } catch(e){ ok = false; }
  return {
    get: function(k, d){ try { var v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set: function(k, v){ try { var s = JSON.stringify(v); if(ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){} },
    del: function(k){ try { if(ok) localStorage.removeItem(k); else delete mem[k]; } catch(e){} }
  };
})();
var K = { cfg:'szq.cfg', wrong:'szq.wrong', hist:'szq.hist', sess:'szq.sess', theme:'szq.theme' };

/* ==================== 数据 ==================== */
var KINDS = ['single','multi','blank','essay'];
var KLABEL = { single:'单选题', multi:'多选题', blank:'填空题', essay:'简答题' };

var ALL = [], BY_ID = {}, COUNT = { single:0, multi:0, blank:0, essay:0 };
(function(){
  (BANK.choice || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:q.type, stem:q.stem, options:q.options, answer:q.answer };
    ALL.push(item); BY_ID[item.id] = item; COUNT[item.kind]++;
  });
  (BANK.blank || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:'blank', segs:q.segs, answers:q.answers, src:q.src };
    ALL.push(item); BY_ID[item.id] = item; COUNT.blank++;
  });
  (BANK.essay || []).forEach(function(q){
    var item = { id:q.id, no:q.no, kind:'essay', q:q.q, a:q.a, src:q.src };
    ALL.push(item); BY_ID[item.id] = item; COUNT.essay++;
  });
  /* 独立试卷的题目只进 BY_ID（供渲染/判分），不进题库清单与统计 */
  (BANK.papers || []).forEach(function(p){
    p.sections.forEach(function(sec){
      sec.items.forEach(function(q){ BY_ID[q.id] = q; });
    });
  });
})();
var TOTAL = ALL.length;

/* ==================== 工具 ==================== */
var main = document.getElementById('main');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtSec(s){
  s = Math.max(0, Math.round(s));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(x) : m + ':' + pad2(x);
}
function pct(a, b){ return b > 0 ? Math.round(a / b * 100) : 0; }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

/* 填空模糊判分 */
function normBlank(s){
  return String(s || '').toLowerCase()
    .replace(/[\s\u3000]/g, '')
    .replace(/[。．.,，、；;：:！!？?（）()【】\[\]《》〈〉“”"'‘’\-—–_·]/g, '')
    .replace(/[～~]/g, '-')
    .replace(/％/g, '%');
}
function blankTokens(a){
  return String(a).split(/[、，,；;\/]|或者|或/).map(normBlank).filter(function(t){ return t.length > 0; });
}
function lcsRatio(a, b){
  if (!a.length || !b.length) return 0;
  if (a.length > 80 || b.length > 80) {
    var short = a.length < b.length ? a : b, long = a.length < b.length ? b : a, hit = 0;
    for (var i = 0; i < short.length; i++) if (long.indexOf(short.charAt(i)) >= 0) hit++;
    return hit / long.length;
  }
  var m = b.length, prev = new Array(m + 1).fill(0), cur = new Array(m + 1).fill(0);
  for (var x = 1; x <= a.length; x++){
    for (var y = 1; y <= m; y++){
      cur[y] = a.charAt(x - 1) === b.charAt(y - 1) ? prev[y - 1] + 1 : Math.max(prev[y], cur[y - 1]);
    }
    prev = cur.slice();
  }
  return prev[m] / Math.max(a.length, b.length);
}
/* ---------- 简答题：按要点覆盖率判分 ---------- */
var PUNCT_RE = /[\s。，、；：！？（）()\[\]【】《》〈〉“”"'‘’—\-…·\/\\,.;:!?]/g;
function stripPunct(s){ return String(s == null ? '' : s).replace(PUNCT_RE, ''); }

function cleanPoint(p){
  return String(p)
    .replace(/^[\s①②③④⑤⑥⑦⑧⑨⑩]+/, '')
    .replace(/^[(（][一二三四五六七八九十\d]{1,3}[)）]\s*/, '')
    .replace(/^\d{1,2}\s*[、)）]\s*/, '')
    .replace(/^[\s：:、]+/, '')
    .trim();
}
function essayPoints(answer){
  var t = String(answer || '').trim();
  if (!t) return [];
  var marker = /(?=[①②③④⑤⑥⑦⑧⑨⑩]|[(（][一二三四五六七八九十\d]{1,3}[)）]|\d{1,2}\s*[、)）])/;
  var parts = t.split(marker).map(cleanPoint).filter(function(p){ return p.length >= 4; });
  if (parts.length < 2){
    parts = t.split(/[。；;\n]/).map(cleanPoint).filter(function(p){ return p.length >= 6; });
  }
  if (parts.length < 2){
    parts = t.split(/[、，,]/).map(cleanPoint).filter(function(p){ return p.length >= 3; });
  }
  if (!parts.length) parts = [cleanPoint(t)];
  return parts;
}
function grams3(s){
  var seen = {}, out = [];
  for (var i = 0; i + 3 <= s.length; i++){
    var g = s.substr(i, 3);
    if (!seen[g]) { seen[g] = 1; out.push(g); }
  }
  return out;
}
function pointHit(point, userNorm){
  var p = stripPunct(point);
  if (!p) return false;
  if (p.length <= 3) return userNorm.indexOf(p) >= 0;
  if (userNorm.indexOf(p) >= 0) return true;
  var g = grams3(p);
  if (!g.length) return false;
  var hit = 0;
  for (var i = 0; i < g.length; i++) if (userNorm.indexOf(g[i]) >= 0) hit++;
  return hit / g.length >= 0.4;
}
function gradeEssay(answer, userText){
  var pts = essayPoints(answer);
  var u = stripPunct(userText);
  var hits = pts.map(function(p){ return pointHit(p, u); });
  var n = pts.length, h = hits.filter(Boolean).length;
  var ratio = n ? h / n : 0;
  var level = ratio >= 0.6 ? 'ok' : ratio >= 0.3 ? 'mid' : 'bad';
  return {
    hit: h, total: n, ratio: ratio, level: level,
    correct: ratio >= 0.6,
    misses: pts.filter(function(p, i){ return !hits[i]; })
  };
}

/* 填空题整题判分：先按空位判，若不通过再按“内容集合”重排匹配 —— 顺序不同也算对 */
function gradeBlanks(q, texts){
  var answers = q.answers, n = answers.length;
  texts = texts || [];
  var direct = answers.map(function(a, i){ return matchBlank(texts[i] || '', a); });
  var directAll = direct.every(function(h){ return h === 'exact'; });
  if (directAll) return { hits: direct, correct: true, reordered: false, matched: n, total: n };

  // 二分图匹配：answer 与 input 一一对应（用 matchBlank 判定能否配对）
  var owner = new Array(n).fill(-1);      // 输入位 j → 答案 i
  var assigned = new Array(n).fill(false);
  answers.forEach(function(a, i){
    if (direct[i] === 'exact' && owner[i] === -1){ owner[i] = i; assigned[i] = true; }
  });
  function augment(i, seen){
    for (var j = 0; j < n; j++){
      if (seen[j]) continue;
      if (matchBlank(texts[j] || '', answers[i]) !== 'exact') continue;
      seen[j] = true;
      if (owner[j] === -1 || augment(owner[j], seen)){ owner[j] = i; return true; }
    }
    return false;
  }
  var matched = 0;
  for (var i = 0; i < n; i++){
    if (assigned[i]) { matched++; continue; }
    if (augment(i, new Array(n).fill(false))) matched++;
  }
  var allOk = matched === n;
  var hits = answers.map(function(a, i){
    if (direct[i] === 'exact') return 'exact';
    if (allOk) return 'exact';          // 顺序不同但内容都能对上
    return direct[i];
  });
  return { hits: hits, correct: allOk, reordered: allOk, matched: matched, total: n };
}

function matchBlank(input, answer){
  var i0 = normBlank(input), a0 = normBlank(answer);
  if (!i0) return 'wrong';
  if (i0 === a0) return 'exact';
  var tk = blankTokens(answer);
  if (tk.length > 1 && tk.every(function(t){ return i0.indexOf(t) >= 0; })) return 'exact';
  if (a0.indexOf(i0) >= 0){
    if (i0.length >= 4) return 'exact';
    if (i0.length / a0.length >= 0.6) return 'exact';
  }
  if (i0.indexOf(a0) >= 0) return 'exact';
  if (tk.length > 1){
    var hit = tk.filter(function(t){ return i0.indexOf(t) >= 0; }).length;
    if (hit / tk.length >= 0.5) return 'partial';
  }
  var r = lcsRatio(i0, a0);
  if (r >= 0.82) return 'exact';
  if (r >= 0.5) return 'partial';
  return 'wrong';
}

function poolOf(cfg){

  return ALL.filter(function(q){ return set[q.kind]; });
}
function drawSet(cfg){
  var pool = poolOf(cfg);
  if (cfg.order === 'random') pool = shuffle(pool.slice());
  else {
    pool = pool.slice().sort(function(a, b){
      if (a.kind !== b.kind) return KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind);
      return a.no - b.no;
    });
  }
  var n = cfg.count === 0 ? pool.length : Math.min(cfg.count, pool.length);
  return pool.slice(0, n).map(function(q){ return q.id; });
}

        (rec.judge

            (rec.judge === 'right' ? '✓' : '✗') + '</span>已记为' + (rec.judge === 'right' ? '答对' : '未掌握') + '</div>'
          : '<div class="judge"><button class="btn" data-act="judge" data-v="right">我答对了</button>' +
            '<button class="btn" data-act="judge" data-v="wrong">没答对</button></div>');
    } else {
      ansBox = '<div class="ansbox"><h4>参考答案（共 ' + eg.total + ' 个要点）</h4><div class="body">' + esc(q.a) + '</div></div>';
      if (eg.misses.length){
        ansBox += '<div class="ansbox mine"><h4>你没写到的要点（' + eg.misses.length + '）</h4>' +
          '<div class="body misslist">' + eg.misses.map(function(m, i){
            return '<span class="miss">' + (i + 1) + '．' + esc(m) + '</span>';
          }).join('') + '</div></div>';
      }
      ansBox += rec.judge === 'auto'
        ? '<div class="judge"><button class="btn sm" data-act="judge" data-v="right">我答得更全，算我对</button>' +
          '<button class="btn sm" data-act="judge" data-v="wrong">我其实没答到</button></div>'
        : '<div class="judge"><button class="btn ghost sm" data-act="judge" data-v="auto">恢复自动判定</button></div>';
    }
  }

  var submitLabel = q.kind === 'essay' ? '提交判分' : '提交答案';
  var nextDisabled = '';
  if (q.kind === 'essay' && rec.graded && !rec.judge) nextDisabled = ' disabled';

  var isLast = idx === total - 1;
  var foot, headRight;
  if (isExam){
    var remain = examRemain();
    headRight = '<span>已答 <b class="num">' + doneN + '</b>/' + total + '</span>' +
      '<span class="clock' + (remain < 60000 ? ' danger' : remain < 600000 ? ' warn' : '') + '" id="clock">' +
      fmtSec(remain / 1000) + '</span>' +
      '<button class="btn ghost sm" data-act="card">答题卡</button>' +
      '<button class="btn primary sm" data-act="askext">交卷</button>';
    foot =
      '<div class="foot">' +
        '<button class="btn ghost" data-act="prev"' + (idx === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<span class="spacer"></span>' +
        '<span class="note">考试中不判分、不给答案，交卷后统一批改</span>' +
        (isLast
          ? '<button class="btn primary" data-act="askext">交卷</button>'
          : '<button class="btn primary" data-act="next">下一题 →</button>') +
      '</div>';
  } else {
    headRight = '<span>已答 <b class="num">' + doneN + '</b>/' + total + '</span><span id="clock">' + elapsed() + '</span>' +
      '<button class="btn ghost sm" data-act="quit" title="退出并保留进度（Esc）">退出</button>';
    foot =
      '<div class="foot">' +
        '<button class="btn ghost" data-act="prev"' + (idx === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<span class="spacer"></span>' +
        (!rec.graded
          ? '<button class="btn ghost" data-act="reveal">不会，看答案</button>' +
            '<button class="btn primary" data-act="submit">' + submitLabel + '</button>'
          : (q.kind === 'essay' && !rec.judge
              ? '<span class="note">本题无参考答案，请先自行判断</span>'
              : '')) +
        '<button class="btn ' + (rec.graded ? 'primary' : '') + '" data-act="next"' + nextDisabled + '>' +
          (isLast ? '交卷查分' : '下一题 →') + '</button>' +
      '</div>';
  }

  main.innerHTML =
  '<div class="quizhead">' +
    '<div class="qh-left"><span class="tag ' + tagCls + '">' + KLABEL[q.kind] + '</span>' +
      '<span class="dim num">第 ' + (idx + 1) + ' / ' + total + ' 题</span>' +
      (isExam ? '' : '<span class="dim">· ' + (q.src ? '补充题' : '原题 ' +
        (q.kind === 'single' || q.kind === 'multi' ? '选择' : q.kind === 'blank' ? '填空' : '简答') + ' #' + q.no) + '</span>') +
    '</div>' +
    '<div class="qh-right">' + headRight + '</div>' +
  '</div>' +
  '<div class="progress"><i style="width:' + (total ? (idx + 1) / total * 100 : 0) + '%"></i></div>' +
  '<div class="qcard">' + bodyHTML + verdictHTML + ansBox +
    (q.src ? '<div class="srcline">出题依据：' + srcLinkHTML(q.src) + '</div>' : '') +
  '</div>' +
  foot;

  tickClock();
}
function elapsed(){
  if (!S.session) return '0:00';
  return fmtSec((Date.now() - S.session.startedAt) / 1000);
}
function tickClock(){
  clearInterval(S.timer);
  S.timer = setInterval(function(){
    var el = document.getElementById('clock');
    if (!el){ clearInterval(S.timer); return; }
    if (S.session && S.session.mode === 'exam'){
      var remain = examRemain();
      el.textContent = fmtSec(remain / 1000);
      el.className = 'clock' + (remain < 60000 ? ' danger' : remain < 600000 ? ' warn' : '');
      if (remain <= 0) finishExam(true);
    } else {
      el.textContent = elapsed();
    }
  }, 1000);
}

/* ==================== 作答动作 ==================== */
function pick(k){
  var q = curQ(), rec = recOf(q);
  if (rec.graded) return;
  if (q.kind === 'single'){
    rec.picked = [k];
  } else {
    var i = rec.picked.indexOf(k);
    if (i >= 0) rec.picked.splice(i, 1);
    else rec.picked.push(k);
  }
  saveSession();
  render();
}
function submit(){
  var q = curQ(), rec = recOf(q);
  if (q.kind === 'essay'){
    rec.graded = true;
    if (!q.a){
      rec.judge = null; rec.correct = null; rec.essayGrade = null;
    } else {
      var eg = gradeEssay(q.a, rec.essayText || '');
      rec.essayGrade = eg;
      rec.judge = 'auto';
      rec.correct = eg.correct;
      recordResult(q, rec.correct);
    }
  } else if (q.kind === 'blank'){
    var gb = gradeBlanks(q, rec.texts);
    rec.blankHits = gb.hits;
    rec.correct = gb.correct;
    rec.blankReordered = !!(gb.correct && gb.reordered);
    rec.graded = true;
    recordResult(q, rec.correct);
  } else {
    if (!rec.picked.length){ toast('请先选择答案，或用「不会，看答案」直接对答案'); return; }
    var sorted = rec.picked.slice().sort().join('');
    rec.correct = sorted === q.answer.split('').sort().join('');
    rec.graded = true;
    recordResult(q, rec.correct);
  }
  saveSession();
  render();
}
/* 简答题人工改判 / 恢复自动判定 */
function judge(v){
  var q = curQ(), rec = recOf(q);
  var prev = rec.correct;
  if (v === 'auto'){
    if (!rec.essayGrade) return;
    rec.judge = 'auto';
    rec.correct = rec.essayGrade.correct;
  } else {
    rec.judge = v;
    rec.correct = v === 'right';
  }
  if (prev !== rec.correct){
    var m = wrongMap();
    if (rec.correct){ if (m[q.id]){ delete m[q.id]; saveWrong(m); } }
    else recordResult(q, false);
  }
  saveSession();
  render();
}
function next(){
  var ses = S.session, q = curQ(), rec = recOf(q);
  if (ses.mode === 'exam'){
    if (ses.idx >= ses.ids.length - 1){ askSubmitExam(); return; }
    ses.idx++;
    saveSession();
    render();
    return;
  }
  if (q.kind === 'essay' && rec.graded && !rec.judge){ toast('请先判断这道题答对没有'); return; }
  if (ses.idx >= ses.ids.length - 1){ finish(); return; }
  ses.idx++;
  saveSession();
  render();
}
function prev(){
  if (S.session.idx === 0) return;
  S.session.idx--;
  saveSession();
  render();
}
function finish(){
  var ses = S.session;
  ses.ended = true;
  ses.finishedAt = Date.now();
  var total = ses.ids.length, right = 0;
  var byKind = {};
  ses.ids.forEach(function(id){
    var q = BY_ID[id], r = ses.recs[id] || {};
    if (!byKind[q.kind]) byKind[q.kind] = { n: 0, right: 0 };
    byKind[q.kind].n++;
    if (isDone(r, q) && r.correct){ right++; byKind[q.kind].right++; }
  });
  var hist = LS.get(K.hist, []);
  hist.unshift({ t: Date.now(), total: total, right: right, secs: Math.round((ses.finishedAt - ses.startedAt) / 1000) });
  LS.set(K.hist, hist.slice(0, 50));
  LS.del(K.sess);
  show('result');
}

/* ==================== 结果 ==================== */
function renderResult(){
  var ses = S.session;
  if (!ses){ show('home'); return; }
  var total = ses.ids.length, right = 0, done = 0;
  var byKind = {};
  var rows = ses.ids.map(function(id, i){
    var q = BY_ID[id], r = ses.recs[id] || {};
    var ok = isDone(r, q) && r.correct;
    if (isDone(r, q)) done++;
    if (ok) right++;
    if (!byKind[q.kind]) byKind[q.kind] = { n: 0, right: 0 };
    byKind[q.kind].n++;
    if (ok) byKind[q.kind].right++;
    return { q: q, r: r, ok: ok, i: i };
  });
  var rate = pct(right, total);
  var C = 2 * Math.PI * 57;
  var dash = C * rate / 100;
  var color = rate >= 80 ? 'var(--ok)' : rate >= 60 ? 'var(--brand)' : 'var(--bad)';
  var secs = (ses.finishedAt ? (ses.finishedAt - ses.startedAt) : (Date.now() - ses.startedAt)) / 1000;

  var kindRows = KINDS.filter(function(k){ return byKind[k]; }).map(function(k){
    var d = byKind[k], p = pct(d.right, d.n);
    return '<div class="rw"><span>' + KLABEL[k] + '</span>' +
      '<span class="bar"><i style="width:' + p + '%;background:' + (p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--brand)' : 'var(--bad)') + '"></i></span>' +
      '<span class="dim num">' + d.right + '/' + d.n + '</span>' +
      '<span class="pct">' + p + '%</span></div>';
  }).join('');

  var wrongList = rows.filter(function(x){ return !x.ok; });
  var reviewHTML = '';
  if (wrongList.length){
    reviewHTML = '<div class="sec"><div class="sec-h">错题回顾（' + wrongList.length + '）</div>' +
      wrongList.map(function(x){
        return qitemHTML(x.q, {
          my: myAnswerText(x.q, x.r),
          note: x.q.kind === 'essay' && !String(x.r.essayText || '').trim() ? '未填写答案' : ''
        });
      }).join('') + '</div>';
  } else {
    reviewHTML = '<div class="card pad" style="margin-top:22px;text-align:center">' +
      '<div style="font-size:30px">🎉</div><div style="font-weight:600;margin-top:6px">全部答对</div>' +
      '<div class="dim">这套题没有错题，继续保持。</div></div>';
  }

  main.innerHTML =
  '<div class="card pad">' +
    '<div class="result-top">' +
      '<div class="ring">' +
        '<svg width="132" height="132" viewBox="0 0 132 132">' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="var(--line)" stroke-width="11"/>' +
          '<circle cx="66" cy="66" r="57" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round" ' +
            'stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="mid"><b>' + rate + '%</b><small>正确率</small></div>' +
      '</div>' +
      '<div style="flex:1;min-width:220px">' +
        '<h2>' + (rate >= 90 ? '非常稳' : rate >= 75 ? '基本过关' : rate >= 60 ? '还需补漏' : '要重点复习') + '</h2>' +
        '<p class="muted" style="margin:6px 0 0">本套 ' + total + ' 题，答对 <b>' + right + '</b> 题，用時 ' + fmtSec(secs) + '。</p>' +
        '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
          '<button class="btn primary" data-act="again">再来一套</button>' +
          (wrongList.length ? '<button class="btn" data-act="drill">只练这套的错题（' + wrongList.length + '）</button>' : '') +
          '<button class="btn ghost" data-act="home">返回首页</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="grid4">' +
      '<div class="kpi"><b class="num">' + total + '</b><span>总题数</span></div>' +
      '<div class="kpi ok"><b class="num">' + right + '</b><span>答对</span></div>' +
      '<div class="kpi bad"><b class="num">' + (total - right) + '</b><span>答错</span></div>' +
      '<div class="kpi"><b class="num">' + fmtSec(secs) + '</b><span>用时</span></div>' +
    '</div>' +
    (kindRows ? '<div class="rows"><div class="hd"><span>题型</span><span>分布</span><span>正确</span><span style="text-align:right">正确率</span></div>' + kindRows + '</div>' : '') +
  '</div>' +
  reviewHTML +
  '<div class="foot" style="margin-top:22px"><span class="spacer"></span>' +
    '<button class="btn" data-act="again">再来一套</button>' +

function myAnswerText(q, r){
  if (!r) return '';
  if (q.kind === 'single' || q.kind === 'multi'){
    return r.picked && r.picked.length ? r.picked.join('') : '（未作答）';
  }
  if (q.kind === 'blank'){
    var parts = (r.texts || []).map(function(t, i){
      return (i + 1) + '．' + (String(t || '').trim() || '空');
    });
    return parts.join('　');
  }
  if (q.kind === 'essay') return r.essayText ? r.essayText : '（未填写）';
  return '';
}
function answerText(q){
  if (q.kind === 'single' || q.kind === 'multi') return q.answer;
  if (q.kind === 'blank') return q.answers.join('；');
  if (q.kind === 'essay') return q.a || '（题库原表未附参考答案）';
  return '';
}
function stemOf(q){
  if (q.kind === 'essay') return q.q;
  if (q.kind === 'blank'){
    return q.segs.map(function(s){ return s.t === 'text' ? s.v : '＿＿'; }).join('');
  }
  return q.stem;
}
function qitemHTML(q, extra){
  extra = extra || {};
  var st = extra.st ? '<span class="st" style="color:' + (extra.stColor || 'var(--ink3)') + '">' + esc(extra.st) + '</span>' : '';
  var body = '<div class="bd">';
  if (q.kind === 'single' || q.kind === 'multi'){
    body += '<p>' + esc(q.stem) + '</p>';
    body += '<p>' + q.options.map(function(o){
      var isAns = q.answer.indexOf(o.k) >= 0;
      return '<span style="display:inline-block;margin:2px 14px 2px 0;' + (isAns ? 'color:var(--ok);font-weight:600' : '') + '">' +
        o.k + '．' + esc(o.v) + (isAns ? ' ✓' : '') + '</span>';
    }).join('') + '</p>';
  } else if (q.kind === 'blank'){
    body += '<p>' + q.segs.map(function(s){
      return s.t === 'text' ? esc(s.v) : '<span class="an">' + esc(s.v) + '</span>';
    }).join('') + '</p>';
  } else {
    body += '<p>' + esc(q.q) + '</p>';
  }
  body += '<p><span class="lb">正确答案</span><span class="an">' + esc(answerText(q)) + '</span></p>';
  if (extra.my) body += '<p><span class="lb">我的答案</span><span class="my">' + esc(extra.my) + '</span></p>';
  if (q.src) body += '<p><span class="lb">出题依据</span><span class="dim">' + srcLinkHTML(q.src) + '</span></p>';
  if (extra.note) body += '<p class="dim">' + esc(extra.note) + '</p>';
  body += '</div>';
  return '<details class="qitem"><summary>' +
    '<span class="tag ' + q.kind + '">' + KLABEL[q.kind] + '</span>' +
    '<span class="qt">' + esc(stemOf(q)) + '</span>' +
    '<span class="no">#' + q.no + '</span>' + st +
    '</summary>' + body + '</details>';
}

function haystack(q){
  var s = '';
  if (q.kind === 'essay') s = q.q + ' ' + (q.a || '');
  else if (q.kind === 'blank') s = q.segs.map(function(x){ return x.v; }).join('') + ' ' + q.answers.join(' ');
  else s = q.stem + ' ' + q.options.map(function(o){ return o.v; }).join(' ');
  return s + ' #' + q.no + ' ' + KLABEL[q.kind];
}

function paintBrowseList(){
  var st = S.browse, box = document.getElementById('browseList');

        (list.length > shown.length ? '，显示前 ' + shown.length + ' 题' : '') + '　（点开看答案）</div>' : '') +

    (!list.length ? '<div class="empty"><div class="big">🔍</div><p>没有匹配的题目</p></div>' : '');

/* ==================== 模拟考试 ==================== */
/* 结构参照两家真实试卷：
   2026 上半年：选择 20 + 填空 34 + 问答 46 = 100
   2025 上半年：选择 18 + 填空 50 + 问答 32 = 100
   另可随机配比，总分恒为 100 */
var EXAM_MINUTES = 90, EXAM_PASS = 60;
var EXAM_PRESETS = {

      { kind: 'blank', label: '二、填空题', weights: [4, 4, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2] },

      { kind: 'essay', label: '三、问答题', weights: [8, 8, 8, 4, 4] }
    ]
  },
  random: { name: '随机配比', desc: '题型、题量、分值都随机，总分固定 100' }
};
function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function roundHalf(x){ return Math.round(x * 2) / 2; }
function sectionsTotal(sections){
  var t = 0;
  sections.forEach(function(s){
    s.weights.forEach(function(w){ t += w; });
  });
  return t;
}
function secFull(sec){
  return sec.weights.reduce(function(a, b){ return a + b; }, 0);
}
function randomSections(){
  var nS = randInt(8, 12);
  var S = nS * 2;
  var nB = randInt(8, 15);
  var share = 0.35 + Math.random() * 0.3;
  var nE = randInt(4, 6);
  var perB = Math.max(1, roundHalf((100 - S) * share / nB));
  // 保证问答每题至少 2 分
  while (perB > 1 && (100 - S - perB * nB) < nE * 2) perB = roundHalf(perB - 0.5);
  var B = perB * nB;
  var R = 100 - S - B;
  var base = Math.max(2, Math.floor(R / nE * 2) / 2);
  var ew = [];
  for (var i = 0; i < nE; i++) ew.push(base);
  ew[nE - 1] = roundHalf(ew[nE - 1] + (R - base * nE));
  if (ew[nE - 1] <= 0){ ew[nE - 1] = 2; }
  return [
    { kind: 'single', label: '一、选择题', weights: new Array(nS).fill(2) },
    { kind: 'blank', label: '二、填空题', weights: new Array(nB).fill(perB) },
    { kind: 'essay', label: '三、问答题', weights: ew }
  ];
}
function currentSections(){
  if (!S.examDraft){ rebuildDraft(); }
  return S.examDraft.sections;
}
function examFull(){ return S.examDraft ? S.examDraft.total : 100; }

/* ---- 考试来源选择：独立试卷 / 结构预设 / 随机配比 ---- */
var PAPERS = BANK.papers || [];
S.examSel = PAPERS.length ? { type: 'paper', id: PAPERS[0].id } : { type: 'preset', key: 'latest' };
S.examDraft = null;

function rebuildDraft(){
  var sel = S.examSel;
  if (sel.type === 'paper'){
    var p = PAPERS.filter(function(x){ return x.id === sel.id; })[0];
    if (!p){ S.examSel = { type: 'preset', key: 'latest' }; return rebuildDraft(); }
    S.examDraft = {
      minutes: p.minutes, pass: p.pass, total: p.total, paperId: p.id, paperName: p.name,
      note: p.note,
      sections: p.sections.map(function(s){
        return { kind: s.kind, label: s.label, weights: s.weights.slice(),
                 count: s.items.length };
      })
    };
  } else if (sel.type === 'random'){
    var secs = randomSections();
    S.examDraft = { minutes: EXAM_MINUTES, pass: EXAM_PASS, total: 100, sections: secs };
  } else {
    var pre = EXAM_PRESETS[sel.key] || EXAM_PRESETS.latest;
    S.examDraft = {
      minutes: EXAM_MINUTES, pass: EXAM_PASS,
      total: sectionsTotal(pre.sections),
      sections: pre.sections.map(function(s){
        return { kind: s.kind, label: s.label, weights: s.weights.slice(), count: s.weights.length };
      })
    };
  }
}
function fs(n){ return String(Math.round(n * 10) / 10); }
function remainOf(ses){
  if (!ses || !ses.exam) return 0;
  return Math.max(0, ses.startedAt + ses.exam.minutes * 60000 - Date.now());
}
function examRemain(){ return remainOf(S.session); }

function startExam(){
  if (!S.examDraft) rebuildDraft();
  var draft = S.examDraft, items = [];
  if (S.examSel.type === 'paper'){
    var paper = PAPERS.filter(function(x){ return x.id === S.examSel.id; })[0];
    paper.sections.forEach(function(sec){
      sec.items.forEach(function(q){
        items.push({ id: q.id, section: sec.label, score: q.score });
      });
    });
  } else {
    draft.sections.forEach(function(sec){
      var pool = ALL.filter(function(q){ return q.kind === sec.kind; });
      shuffle(pool.slice()).slice(0, sec.weights.length).forEach(function(q, i){
        // 填空题统一按“1 空 1 分”，分值 = 该题空数
        var sc = sec.kind === 'blank' ? q.answers.length : sec.weights[i];
        items.push({ id: q.id, section: sec.label, score: sc });
      });
    });
  }
  var meta = {};
  items.forEach(function(x){ meta[x.id] = { section: x.section, score: x.score }; });
  var totalScore = items.reduce(function(a, x){ return a + x.score; }, 0);
  var passLine = (S.examSel.type === 'paper') ? draft.pass : Math.max(1, Math.round(totalScore * 0.6));
  S.session = {
    ids: items.map(function(x){ return x.id; }),
    idx: 0, recs: {}, startedAt: Date.now(), ended: false,
    mode: 'exam', meta: meta,
    exam: { minutes: draft.minutes, pass: passLine, full: totalScore,
            title: draft.paperName || (EXAM_PRESETS[S.examSel.key] || {}).name || '模拟考试' }
  };
  saveSession();
  show('quiz');
}

function hasAnswer(q, r){
  if (!r) return false;
  if (q.kind === 'single' || q.kind === 'multi') return !!(r.picked && r.picked.length);
  if (q.kind === 'blank') return (r.texts || []).some(function(t){ return String(t || '').trim(); });
  return !!String(r.essayText || '').trim();
}
function examAnswered(){
  var n = 0;
  S.session.ids.forEach(function(id){
    if (hasAnswer(BY_ID[id], S.session.recs[id])) n++;
  });
  return n;
}

/* ---- 交卷判分 ---- */
function gradeExamItem(q, r, full){
  var got = 0, status = 'blank', detail = '';
  if (q.kind === 'single' || q.kind === 'multi'){
    var picked = (r && r.picked) ? r.picked.slice().sort().join('') : '';
    if (!picked) status = 'blank';
    else if (picked === q.answer.split('').sort().join('')){ got = full; status = 'full'; }
    else status = 'wrong';
  } else if (q.kind === 'blank'){
    var texts = (r && r.texts) || [];
    var gr = gradeBlanks(q, texts);
    var exact = gr.hits.filter(function(h){ return h === 'exact'; }).length;
    if (!texts.some(function(t){ return String(t || '').trim(); })) status = 'blank';
    else if (gr.correct) status = 'full';
    else if (exact > 0) status = 'partial';
    else status = 'wrong';
    got = full * (gr.correct ? q.answers.length : gr.matched) / q.answers.length;
    if (exact) detail = exact + '/' + q.answers.length + ' 空' + (gr.reordered ? '（顺序不同）' : '');
  } else {
    var txt = (r && r.essayText) || '';
    if (!String(txt).trim()){ status = 'blank'; got = 0; }
    else {
      var g = gradeEssay(q.a, txt);
      got = q.a ? full * g.ratio : 0;
      status = g.ratio >= 0.6 ? 'full' : g.ratio >= 0.3 ? 'partial' : 'wrong';
      if (g.total) detail = g.hit + '/' + g.total + ' 要点';
    }
  }
  return { got: Math.round(got * 2) / 2, full: full, status: status, detail: detail };
}
function finishExam(auto){
  var ses = S.session;
  if (!ses || ses.mode !== 'exam' || ses.ended) return;
  ses.ended = true;
  ses.finishedAt = Date.now();
  var rows = [], total = 0;
  ses.ids.forEach(function(id, i){
    var q = BY_ID[id], r = ses.recs[id] || {}, m = ses.meta[id] || { score: 0 };
    var g = gradeExamItem(q, r, m.score || 0);
    total += g.got;
    rows.push({ id: id, idx: i, section: m.section || '', got: g.got, full: g.full,
                status: g.status, detail: g.detail, my: myAnswerText(q, r) });
    if (g.status !== 'full') recordResult(q, false);
    else {
      var wm = wrongMap();
      if (wm[q.id]){ delete wm[q.id]; saveWrong(wm); }
    }
  });
  ses.examResult = {
    rows: rows, total: Math.round(total * 10) / 10,
    full: ses.exam.full, pass: ses.exam.pass,
    auto: !!auto, secs: Math.round((ses.finishedAt - ses.startedAt) / 1000)
  };
  clearInterval(S.timer); S.timer = null;
  LS.set('szq.exam', ses.examResult);
  LS.del(K.sess);
  closeOverlay();
  show('examresult');
}

var STDS = BANK.standards || [];

/* 从题目的「出题依据」里解析出 规范 + 条文号，用于跳转 */
function stdRefFromSrc(src){
  if (!src) return null;
  var id = null;
  if (/GB\s*55032/.test(src)) id = 'gb55032';
  else if (/DBJ33\s*\/?\s*T?\s*1361/.test(src)) id = 'dbj33t1361';
  if (!id) return null;
  var m = /第\s*([\d]+(?:\.[\d]+)*)/.exec(src);
  return { stdId: id, no: m ? m[1] : '' };
}
/* 「出题依据」渲染：能定位到条文的做成可点链接 */
function srcLinkHTML(src){
  var ref = stdRefFromSrc(src);
  if (!ref || !STDS || !STDS.some(function(s){ return s.id === ref.stdId; })) return esc(src);
  return '<button class="srcgo" data-act="gostd" data-std="' + ref.stdId + '" data-no="' + esc(ref.no) +
    '" title="打开规范对应条文">' + esc(src) + ' ↗</button>';
}

  '<div class="toolbar"><label class="search"><span class="ic">🔍</span>' +
    '<input id="stdkw" type="search" placeholder="搜条文号或关键词，如 3.3.4、见证检验、使用登记…" value="' + esc(kw) + '"></label></div>' +
  '<div id="stdBody"></div>';

  var box = document.getElementById('stdkw');
  if (box){
    box.addEventListener('input', function(){ S.stdKw = box.value; paintStandardsBody(std); });
  }
  paintStandardsBody(std);

  if (S.stdJump && S.stdJump.stdId === std.id && S.stdJump.no){
    var target = document.querySelector('.stdit.hl');
    if (target) setTimeout(function(){ target.scrollIntoView({ block: 'center' }); }, 60);
  }
  S.stdJump = null;
}

function paintStandardsBody(std){
  var box = document.getElementById('stdBody');
  if (!box) return;
  var kw = (S.stdKw || '').trim();
  var jumpNo = (S.stdJump && S.stdJump.stdId === std.id) ? S.stdJump.no : '';

  function hi(c, idx){
    var isHl = jumpNo && c.no === jumpNo;
    var text = esc(c.text);
    if (kw){
      try { text = text.replace(new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g'), '<mark>$1</mark>'); } catch (e) {}
    }
    return '<div class="stdit' + (isHl ? ' hl' : '') + '" id="cl-' + std.id + '-' + idx + '">' +
      '<div class="cn">' + esc(c.no) + '</div><div class="stdtxt">' + text + '</div></div>';
  }

  if (!kw){
    box.innerHTML = std.sections.map(function(sec, si){
      var open = jumpNo && sec.clauses.some(function(c){ return c.no === jumpNo; });
      return '<details class="stdsec"' + (open ? ' open' : '') + '>' +
        '<summary>' + sec.no + '　' + esc(sec.title) + '<span class="cnt">' + sec.clauses.length + ' 条</span></summary>' +
        sec.clauses.map(function(c, i){ return hi(c, si + '-' + i); }).join('') + '</details>';
    }).join('');
    return;
  }

  var hits = [];
  std.sections.forEach(function(sec, si){
    sec.clauses.forEach(function(c, i){
      if (c.text.indexOf(kw) >= 0 || c.no.indexOf(kw) >= 0) hits.push({ sec: sec, c: c, si: si, i: i });
    });
  });
  box.innerHTML = '<div class="dim" style="margin:2px 0 10px">命中 ' + hits.length + ' 条</div>' +
    (hits.slice(0, 200).map(function(h){
      return '<div class="stdsec"><div class="stdit" style="border:0">' +
        '<div class="cn">' + esc(h.c.no) + '</div><div>' +
        '<div class="stdtxt">' + hi(h.c, h.si + '-' + h.i).replace(/^[\s\S]*?<div class="stdtxt">/, '') + '</div>' +
        '<div class="dim" style="font-size:12px;margin-top:4px">' + esc(h.sec.no + ' ' + h.sec.title) + '</div>' +
        '</div></div></div>';
    }).join('') || '<div class="empty"><div class="big">🔍</div><p>没有匹配的条文</p></div>');
}

/* ==================== 事件 ==================== */
document.addEventListener('click', function(e){
  /* 过滤按钮（题库 / 错题本）优先处理 */
  var fb = e.target.closest('.filters button');
  if (fb){
    var scope = fb.closest('.filters');
    scope.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === fb); });
    var kb = fb.getAttribute('data-k');
    if (scope.getAttribute('data-act') === 'bfilter'){
      S.browse.kind = kb; paintBrowseList();
    } else {
      var mm = wrongMap();
      var allW = Object.keys(mm).map(function(id){ return BY_ID[id]; }).filter(Boolean);
      var arrW = kb ? allW.filter(function(q){ return q.kind === kb; }) : allW;
      var wl = document.getElementById('wrongList');
      if (wl){
        wl.innerHTML = arrW.map(function(q){
          return qitemHTML(q, { my: '', st: '错' + (mm[q.id].n || 1) + '次', stColor: 'var(--bad)' });
        }).join('') || '<div class="empty"><p>该题型暂无错题</p></div>';
      }
    }
    return;
  }

  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'start'){
    var ids = drawSet(S.cfg);
    if (!ids.length){ toast('请至少选择一种题型'); return; }
    newSession(ids);
    return;
  }
  if (act === 'kind'){
    var k = t.getAttribute('data-k'), i = S.cfg.kinds.indexOf(k);
    if (i >= 0){ if (S.cfg.kinds.length === 1){ toast('至少保留一种题型'); return; } S.cfg.kinds.splice(i, 1); }
    else S.cfg.kinds.push(k);
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'count'){
    S.cfg.count = parseInt(t.getAttribute('data-c'), 10) || 0;
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'order'){
    S.cfg.order = t.getAttribute('data-o');
    LS.set(K.cfg, S.cfg);
    renderHome();
    return;
  }
  if (act === 'jump'){
    S.browse.kind = t.getAttribute('data-k');
    S.browse.kw = '';
    show('browse');
    return;
  }
  if (act === 'resume'){
    var s = LS.get(K.sess, null);
    if (s && s.ids){
      S.session = s;
      if (typeof s.startedAt !== 'number') s.startedAt = Date.now();
      show('quiz');
    } else { toast('没有可继续的练习'); renderHome(); }
    return;
  }
  if (act === 'pick'){ pick(t.getAttribute('data-k')); return; }
  if (act === 'submit'){ submit(); return; }
  if (act === 'judge'){ judge(t.getAttribute('data-v')); return; }
  if (act === 'next'){ next(); return; }
  if (act === 'prev'){ prev(); return; }
  if (act === 'quit'){
    if (!S.session) { show('home'); return; }
    saveSession();
    S.session = null;
    show('home');
    toast('已退出，进度已保存，可随时继续');
    return;
  }
  if (act === 'reveal'){
    var qr = curQ(), recr = recOf(qr);
    if (recr.graded) return;
    recr.revealed = true;
    if (qr.kind === 'essay' || qr.kind === 'blank'){ submit(); return; }
    if (!recr.picked.length){
      recr.graded = true; recr.correct = false; recr.blankHits = null;
      recordResult(qr, false);
      saveSession(); render();
      return;
    }
    submit();
    return;
  }
  if (act === 'again'){
    var nids = drawSet(S.cfg);
    newSession(nids);
    return;
  }
  if (act === 'drill'){
    var wrongIds = S.session.ids.filter(function(id){
      var q = BY_ID[id], r = S.session.recs[id] || {};
      return !(isDone(r, q) && r.correct);
    });
    if (!wrongIds.length){ toast('没有错题'); return; }
    newSession(shuffle(wrongIds.slice()), { title: '只练错题', kinds: S.cfg.kinds.slice() });
    return;
  }
  if (act === 'drillWrong'){
    var m = wrongMap(), idl = Object.keys(m).filter(function(id){ return BY_ID[id]; });
    if (!idl.length){ toast('错题本是空的'); return; }
    newSession(shuffle(idl.slice()), { title: '错题重练' });
    return;
  }
  if (act === 'clearWrong'){
    if (!confirm('确定清空错题本？此操作不可撤销。')) return;
    saveWrong({});
    renderWrong();
    toast('错题本已清空');
    return;
  }
  if (act === 'home'){ show('home'); return; }
  if (act === 'stdsel'){ S.stdSel = t.getAttribute('data-id'); S.stdKw = ''; S.stdJump = null; renderStandards(); return; }
  if (act === 'gostd'){
    S.stdSel = t.getAttribute('data-std');
    S.stdKw = '';
    S.stdJump = { stdId: S.stdSel, no: t.getAttribute('data-no') || '' };
    show('standards');
    return;
  }
  if (act === 'goexam'){ show('exam'); return; }
  if (act === 'startexam'){ startExam(); return; }
  if (act === 'exsel'){
    var etype = t.getAttribute('data-type'), eid = t.getAttribute('data-id');
    S.examSel = etype === 'preset' ? { type: 'preset', key: eid }
              : etype === 'random' ? { type: 'random' }
              : { type: 'paper', id: eid };
    S.examDraft = null;
    rebuildDraft();
    renderExamIntro();
    return;
  }
  if (act === 'reroll'){ S.examDraft = null; rebuildDraft(); renderExamIntro(); return; }
  if (act === 'askext'){ askSubmitExam(); return; }
  if (act === 'submitExam'){ finishExam(false); return; }
  if (act === 'card'){ openCard(); return; }
  if (act === 'closeoverlay'){ closeOverlay(); return; }
  if (act === 'ovlbg'){ if (e.target === t) closeOverlay(); return; }
  if (act === 'jumpq'){
    var ji = parseInt(t.getAttribute('data-i'), 10);
    if (S.session && ji >= 0 && ji < S.session.ids.length){
      S.session.idx = ji; saveSession(); closeOverlay(); render();
    }
    return;
  }
  if (act === 'resumeexam'){
    var es = LS.get(K.sess, null);
    if (es && es.mode === 'exam' && es.ids && !es.ended){
      S.session = es;
      if (remainOf(es) <= 0){ finishExam(true); return; }
      show('quiz');
    } else { toast('没有未完成的考试'); show('exam'); }
    return;
  }
  if (act === 'drillexam'){
    var erR = (S.session && S.session.examResult) || LS.get('szq.exam', null);
    var er = (erR && erR.rows) ? erR.rows : [];
    var loseIds = er.filter(function(x){ return x.status !== 'full'; }).map(function(x){ return x.id; });
    if (!loseIds.length){ toast('这场没有丢分的题'); return; }
    newSession(shuffle(loseIds.slice()), { title: '练丢分题' });
    return;
  }
  if (act === 'lastexam'){ show('examresult'); return; }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-act') === 'blank'){
    var q = curQ(), rec = recOf(q), i = parseInt(t.getAttribute('data-i'), 10);
    rec.texts[i] = t.value;
    saveSession();
  }
  if (t.getAttribute && t.getAttribute('data-act') === 'essay'){
    var q2 = curQ(), rec2 = recOf(q2);
    rec2.essayText = t.value;
    saveSession();
  }
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (S.view !== 'quiz' || !S.session) return;
  var q = curQ(), rec = recOf(q);
  var key = e.key;
  if (/^[1-4]$/.test(key) || /^[a-dA-D]$/.test(key)){
    if (rec.graded) return;
    var idx = /^[1-4]$/.test(key) ? parseInt(key, 10) - 1 : key.toUpperCase().charCodeAt(0) - 65;
    if (q.kind === 'single' || q.kind === 'multi'){
      var o = q.options[idx];
      if (o){ e.preventDefault(); pick(o.k); }
    }
    return;
  }
  if (key === 'Enter'){
    e.preventDefault();
    if (S.session.mode === 'exam'){ next(); return; }
    if (!rec.graded) submit();
    else if (q.kind === 'essay' && rec.graded && !rec.judge) return;
    else next();
    return;
  }
  if (key === 'ArrowLeft'){ e.preventDefault(); prev(); return; }
  if (key === 'ArrowRight'){ e.preventDefault(); next(); return; }
});

document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('[data-nav]');
  if (!b) return;
  var v = b.getAttribute('data-nav');
  var ses = S.session;
  if (v === 'exam'){
    if (ses && ses.mode === 'exam' && !ses.ended){ show('quiz'); return; }
    show('exam');
    return;
  }
  if (v === 'home'){
    if (ses && !ses.ended && ses.mode !== 'exam'){ show('quiz'); return; }
    show('home');
    return;
  }
  show(v);
});

/* ==================== 启动 ==================== */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var ov = document.getElementById('overlay');
  if (ov && ov.classList.contains('on')){ closeOverlay(); return; }
  if (S.view !== 'quiz') return;
  if (S.session && S.session.mode === 'exam'){ toast('考试中，请用「交卷」结束'); return; }
  saveSession(); show('home');
});
document.getElementById('brandSub').textContent = '2024.4 题库 · ' + TOTAL + ' 题';
paintBadge();
show('home');
})();
</script>
